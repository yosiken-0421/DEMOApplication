<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ff5fa2">
<title>トントン☆パレード</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#2b1747;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
  canvas{display:block;touch-action:none}
  #ov{position:fixed;inset:0;z-index:5;background:rgba(43,23,71,.72);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-left,0px));touch-action:auto}
  #ov .ovp{background:#fffaf0;border:5px solid #2b1747;border-radius:28px;box-shadow:0 8px 0 #2b1747;padding:20px;width:100%;max-width:420px;box-sizing:border-box;
    font-family:"Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Noto Sans CJK JP",sans-serif;color:#2b1747}
  #ov h2{margin:0 0 6px;font-size:22px;text-align:center}
  #ov p{margin:6px 0 10px;font-size:14px;line-height:1.5}
  #ov .msg{color:#d6336c;font-weight:bold;min-height:1.5em}
  #ov input,#ov textarea{width:100%;box-sizing:border-box;font-size:17px;padding:10px 12px;border:3px solid #2b1747;border-radius:14px;background:#fff;color:#2b1747;
    -webkit-user-select:text;user-select:text;touch-action:auto;font-family:inherit}
  #ov textarea{resize:none;font-size:14px}
  #ov .ovb{display:flex;gap:10px;margin-top:12px}
  #ov button{flex:1;font-weight:bold;font-size:17px;font-family:inherit;padding:12px;border:4px solid #2b1747;border-radius:18px;background:#ff5fa2;color:#fff;box-shadow:0 4px 0 #2b1747}
  #ov button.sub{background:#fff;color:#2b1747}
  #ov button:focus-visible{outline:3px solid #4cc9f0;outline-offset:2px}
  #safe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<script>
// ---- 00_core.js ----
'use strict';
// =====================================================================
//  トントン☆パレード  core : canvas / clock / save / draw helpers / UI
// =====================================================================
const W = 720; let H = 1280;
const FONT = '"Hiragino Maru Gothic ProN","HiraMaruProN-W4","M PLUS Rounded 1c","Noto Sans CJK JP","Noto Sans JP",sans-serif';
const INK = '#2b1747';
const COL = {
  pink: '#ff5fa2', yellow: '#ffd23f', mint: '#3ee0b5', sky: '#4cc9f0', purple: '#8b5cf6',
  orange: '#ff8c42', red: '#ff4d6d', green: '#7bd64f', cream: '#fff6e0', white: '#ffffff', navy: '#1d1b4f'
};
let DPR = 1, SC = 1, OX = 0, OY = 0, VW = 0, VH = 0, SAFE_T = 0, SAFE_B = 0;
const cv = document.getElementById('c');
const g = cv.getContext('2d');
const safeEl = document.getElementById('safe');

function resize() {
  VW = window.innerWidth; VH = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  cv.style.width = VW + 'px'; cv.style.height = VH + 'px';
  SC = VW / W; H = VH / SC;
  if (H < 1150) { H = 1150; SC = VH / H; }
  OX = (VW - W * SC) / 2; OY = 0;
  try {
    const cs = getComputedStyle(safeEl);
    SAFE_T = (parseFloat(cs.paddingTop) || 0) / SC;
    SAFE_B = (parseFloat(cs.paddingBottom) || 0) / SC;
  } catch (e) { SAFE_T = SAFE_B = 0; }
}
window.addEventListener('resize', resize);

// ---------- math / easing ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const ease = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inCubic: t => t * t * t,
  outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  outElastic: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1,
  inOut: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
};
// beat pulse: 1 at the beat, decays to 0
const pulse = (B, k = 6) => Math.exp(-((B % 1 + 1) % 1) * k);
const frac = x => ((x % 1) + 1) % 1;
function rand(seed) { // deterministic pseudo random 0..1
  const x = Math.sin(seed * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x);
}

// ---------- save ----------
const SAVE_KEY = 'tontonparade_v1';
const SAVE = { calib: 0, music: 0.6, sfx: 1.0, guide: false, res: {}, seenHelp: false };
function loadSave() {
  try {
    // two copies may exist (app storage / web storage): use the newer one
    let a = window.__TT_SAVE__, b = null;
    if (typeof a === 'string') a = JSON.parse(a);
    try { const s = localStorage.getItem(SAVE_KEY); if (s) b = JSON.parse(s); } catch (e) { }
    let d = a || b;
    if (a && b) d = (b.ts || 0) > (a.ts || 0) ? b : a;
    if (d && typeof d === 'object') Object.assign(SAVE, d);
  } catch (e) { }
}
function writeSave() {
  SAVE.ts = Date.now();
  const s = JSON.stringify(SAVE);
  try { localStorage.setItem(SAVE_KEY, s); } catch (e) { }
  try { if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'save', data: s })); } catch (e) { }
}
function haptic(kind) {
  try { if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'haptic', kind })); } catch (e) { }
}

// ---------- drawing helpers ----------
function circle(x, y, r) { g.beginPath(); g.arc(x, y, Math.max(0.01, r), 0, TAU); }
function ell(x, y, rx, ry, rot = 0) { g.beginPath(); g.ellipse(x, y, Math.max(.01, rx), Math.max(.01, ry), rot, 0, TAU); }
function rrect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function fs(fill, lw = 6, stroke = INK) {
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (lw > 0) { g.lineWidth = lw; g.strokeStyle = stroke; g.lineJoin = 'round'; g.stroke(); }
}
function text(str, x, y, size, fill = '#fff', stroke = INK, align = 'center', lw) {
  g.font = `bold ${size}px ${FONT}`; g.textAlign = align; g.textBaseline = 'middle'; g.lineJoin = 'round';
  if (stroke) { g.lineWidth = lw != null ? lw : Math.max(3, size * 0.24); g.strokeStyle = stroke; g.strokeText(str, x, y); }
  g.fillStyle = fill; g.fillText(str, x, y);
}
function textShadow(str, x, y, size, fill, dy = 6, align = 'center') {
  text(str, x, y + dy, size, INK, INK, align);
  text(str, x, y, size, fill, INK, align);
}
function wrapText(str, x, y, size, maxW, fill = INK, lineH = 1.45, align = 'center', stroke = null) {
  g.font = `bold ${size}px ${FONT}`;
  const lines = []; let cur = '';
  for (const ch of str) {
    if (ch === '\n') { lines.push(cur); cur = ''; continue; }
    if (g.measureText(cur + ch).width > maxW && cur) { lines.push(cur); cur = ch; } else cur += ch;
  }
  if (cur) lines.push(cur);
  lines.forEach((l, i) => text(l, x, y + i * size * lineH, size, fill, stroke, align, stroke ? size * 0.2 : 0));
  return lines.length * size * lineH;
}
// pop shadow: draw path twice (offset ink, then fill)
function popShape(pathFn, fill, lw = 6, dy = 8) {
  g.save(); g.translate(0, dy); pathFn(); g.fillStyle = INK; g.fill(); g.restore();
  pathFn(); fs(fill, lw);
}
function sunburst(cx, cy, n, c1, c2, rot, R = 2000) {
  g.fillStyle = c1; g.fillRect(-50, -50, W + 100, H + 100);
  g.fillStyle = c2; g.beginPath();
  for (let i = 0; i < n; i++) {
    const a0 = rot + i * TAU / n, a1 = a0 + TAU / n / 2;
    g.moveTo(cx, cy); g.lineTo(cx + Math.cos(a0) * R, cy + Math.sin(a0) * R); g.lineTo(cx + Math.cos(a1) * R, cy + Math.sin(a1) * R);
  }
  g.fill();
}
function polka(color, sp, r, ox = 0, oy = 0, alpha = 1) {
  g.save(); g.globalAlpha = alpha; g.fillStyle = color; g.beginPath();
  const sx = ((ox % sp) + sp) % sp, sy = ((oy % sp) + sp) % sp;
  for (let y = -sp + sy, row = 0; y < H + sp; y += sp / 2, row++) {
    for (let x = -sp + sx + (row % 2 ? sp / 2 : 0); x < W + sp; x += sp) { g.moveTo(x + r, y); g.arc(x, y, r, 0, TAU); }
  }
  g.fill(); g.restore();
}
function stripes(c1, c2, w, angle, off) {
  g.save(); g.fillStyle = c1; g.fillRect(-50, -50, W + 100, H + 100);
  g.translate(W / 2, H / 2); g.rotate(angle); g.fillStyle = c2;
  const L = Math.hypot(W, H) + 200; off = ((off % (w * 2)) + w * 2) % (w * 2);
  g.beginPath();
  for (let x = -L / 2 - w * 2 + off; x < L / 2; x += w * 2) g.rect(x, -L / 2, w, L);
  g.fill(); g.restore();
}
function star(x, y, r, n = 5, inner = 0.5, rot = -Math.PI / 2) {
  g.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const rr = i % 2 ? r * inner : r; const a = rot + i * Math.PI / n;
    i ? g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : g.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  g.closePath();
}
function heart(x, y, s) {
  g.beginPath(); g.moveTo(x, y + s * 0.9);
  g.bezierCurveTo(x - s * 1.6, y - s * 0.2, x - s * 0.6, y - s * 1.3, x, y - s * 0.4);
  g.bezierCurveTo(x + s * 0.6, y - s * 1.3, x + s * 1.6, y - s * 0.2, x, y + s * 0.9); g.closePath();
}
// cute face: eyes + mouth
function face(x, y, s, o = {}) {
  let eye = o.eye || 'dot'; const mouth = o.mouth || 'smile', look = o.look || 0, lookY = o.lookY || 0;
  if (eye === 'dot' && o.blink !== false) { const seed = x * 0.013 + y * 0.007; if (((sceneT + seed * 1.7) % 3.3 + 3.3) % 3.3 < 0.11) eye = 'closed'; }
  const ex = s * 0.38, ey = -s * 0.08;
  g.lineCap = 'round';
  for (const side of [-1, 1]) {
    const cx = x + side * ex + look * s * 0.12, cy = y + ey + lookY * s * 0.1;
    if (eye === 'happy') { g.beginPath(); g.arc(cx, cy + s * 0.05, s * 0.15, Math.PI * 1.1, Math.PI * 1.9); g.lineWidth = s * 0.09; g.strokeStyle = INK; g.stroke(); }
    else if (eye === 'x') { g.beginPath(); const k = s * 0.12; g.moveTo(cx - k, cy - k); g.lineTo(cx + k, cy + k); g.moveTo(cx + k, cy - k); g.lineTo(cx - k, cy + k); g.lineWidth = s * 0.08; g.strokeStyle = INK; g.stroke(); }
    else if (eye === 'closed') { g.beginPath(); g.moveTo(cx - s * 0.13, cy); g.lineTo(cx + s * 0.13, cy); g.lineWidth = s * 0.08; g.strokeStyle = INK; g.stroke(); }
    else if (eye === 'spiral') { g.beginPath(); for (let a = 0; a < 12; a += 0.4) { const r = a * s * 0.012; g.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); } g.lineWidth = s * 0.05; g.strokeStyle = INK; g.stroke(); }
    else if (eye === 'none') { }
    else if (eye === 'star') { star(cx, cy, s * 0.17, 5, 0.45); fs(COL.yellow, s * 0.04); }
    else { ell(cx, cy, s * 0.11, s * 0.15); g.fillStyle = INK; g.fill(); circle(cx + s * 0.04, cy - s * 0.06, s * 0.045); g.fillStyle = '#fff'; g.fill(); }
  }
  if (o.cheek !== false) { g.fillStyle = 'rgba(255,90,140,0.45)'; ell(x - s * 0.62, y + s * 0.18, s * 0.14, s * 0.09); g.fill(); ell(x + s * 0.62, y + s * 0.18, s * 0.14, s * 0.09); g.fill(); }
  const my = y + s * 0.28;
  g.lineWidth = s * 0.08; g.strokeStyle = INK;
  if (mouth === 'smile') { g.beginPath(); g.arc(x + look * s * 0.08, my - s * 0.08, s * 0.16, Math.PI * 0.15, Math.PI * 0.85); g.stroke(); }
  else if (mouth === 'open' || mouth === 'big') {
    const r = mouth === 'big' ? s * 0.26 : s * 0.18;
    g.beginPath(); g.arc(x + look * s * 0.08, my - s * 0.05, r, 0, Math.PI); g.closePath(); fs('#b8325a', s * 0.07);
  }
  else if (mouth === 'o') { ell(x + look * s * 0.08, my, s * 0.1, s * 0.13); fs('#b8325a', s * 0.06); }
  else if (mouth === 'sad') { g.beginPath(); g.arc(x, my + s * 0.12, s * 0.15, Math.PI * 1.2, Math.PI * 1.8); g.stroke(); }
  else if (mouth === 'flat') { g.beginPath(); g.moveTo(x - s * 0.12, my); g.lineTo(x + s * 0.12, my); g.stroke(); }
  else if (mouth === 'wave') { g.beginPath(); for (let i = 0; i <= 8; i++) { const px = x - s * 0.2 + i * s * 0.05; g.lineTo(px, my + Math.sin(i * 1.6) * s * 0.04); } g.stroke(); }
}

// ---------- cheering crowd (reacts to combo) ----------
const CROWD_COLS = ['#ff5fa2', '#ffd23f', '#3ee0b5', '#4cc9f0', '#8b5cf6', '#ff8c42', '#7bd64f', '#ff4d6d', '#ffffff'];
function crowd(B, run, yBase, o = {}) {
  const combo = run ? (run.combo || 0) : 0;
  const sad = run && run.missB != null && B - run.missB >= 0 && B - run.missB < 1.2;
  const hype = Math.min(combo, 24) / 24;
  const n = 9;
  for (let row = 0; row < 2; row++) {
    for (let i = 0; i < n; i++) {
      const x = (i + (row ? 0.5 : 0)) * (W / (n - 1)) - (row ? 0 : 0);
      const ph = frac(B + i * 0.13);
      const jump = sad ? 0 : (6 + hype * 26) * Math.exp(-ph * 5) * (row ? 0.8 : 1);
      const y = yBase + row * 70 - jump + (sad ? 8 : 0);
      const c = CROWD_COLS[(i * 3 + row * 5) % CROWD_COLS.length];
      const r = row ? 52 : 46;
      if (!sad && hype > 0.2) { // arms up
        const up = 30 + hype * 40;
        g.lineCap = 'round'; g.lineWidth = 14; g.strokeStyle = INK;
        g.beginPath(); g.moveTo(x - r * 0.7, y + 10); g.lineTo(x - r * 0.9, y - up); g.moveTo(x + r * 0.7, y + 10); g.lineTo(x + r * 0.9, y - up); g.stroke();
        g.lineWidth = 7; g.strokeStyle = c; g.stroke();
        if (hype > 0.6) { const lc = (i + row) % 2 ? COL.yellow : COL.pink; for (const s of [-1, 1]) { circle(x + s * r * 0.9, y - up - 8, 9); fs(lc, 3); } }
      }
      circle(x, y + 40, r); fs(c, 5);
      face(x, y + 30, r * 0.7, { eye: sad ? 'closed' : hype > 0.4 ? 'happy' : 'dot', mouth: sad ? 'o' : hype > 0.3 ? 'open' : 'smile', cheek: true });
    }
  }
  if (sad) text('あ〜…', W / 2, yBase - 40, 40, '#fff');
}

// ---------- groove: every character dances on the beat ----------
let HYPE = 1; // 0.8 .. 1.8, follows the combo
function groove(B, phase = 0) {
  const ph = frac(B + phase), k = Math.exp(-ph * 5);
  return { sx: 1 + 0.06 * HYPE * k, sy: 1 - 0.08 * HYPE * k + 0.02 * HYPE * (1 - k), lean: Math.sin((B + phase) * Math.PI) * 0.05 * HYPE };
}
function grooveAt(x, footY, B, phase, fn) {
  const q = groove(B, phase);
  g.save(); g.translate(x, footY); g.rotate(q.lean); g.scale(q.sx, q.sy); g.translate(-x, -footY); fn(); g.restore();
}
// small dancing buddies (per stage they get their own look)
function dancer(x, y, s, B, o = {}) {
  const col = o.col || COL.pink, ph = o.phase || 0, beat = Math.floor(B + ph);
  const k = Math.exp(-frac(B + ph) * 5);
  const jump = (beat % 4 === 0 ? 26 : 10) * k * HYPE;
  const armUp = beat % 2 === 0;
  g.save(); g.translate(x, y - jump); g.scale(s, s * (1 - 0.08 * k));
  g.rotate(Math.sin((B + ph) * Math.PI) * 0.12);
  // arms
  g.lineCap = 'round';
  for (const sd of [-1, 1]) {
    const up = (sd < 0) === armUp;
    const ex = sd * 62, ey = up ? -78 : 18;
    g.lineWidth = 16; g.strokeStyle = INK; g.beginPath(); g.moveTo(sd * 34, -6); g.lineTo(ex, ey); g.stroke();
    g.lineWidth = 9; g.strokeStyle = col; g.stroke();
    if (HYPE > 1.3) { circle(ex, ey - 6, 11); fs(sd < 0 ? COL.yellow : COL.mint, 3); }
  }
  // feet
  ell(-20, 44, 16, 9); fs(INK, 0); ell(20, 44, 16, 9); fs(INK, 0);
  // body
  if (o.kind === 'rice') { g.beginPath(); g.moveTo(0, -52); g.quadraticCurveTo(50, -20, 46, 34); g.lineTo(-46, 34); g.quadraticCurveTo(-50, -20, 0, -52); g.closePath(); fs('#fff', 5); g.fillStyle = '#1f4d3a'; g.fillRect(-24, 10, 48, 24); }
  else if (o.kind === 'bot') { rrect(-40, -46, 80, 82, 18); fs(col, 5); rrect(-28, -32, 56, 30, 8); fs('#24324f', 3); }
  else { ell(0, -4, 46, 46); fs(col, 5); }
  if (o.kind === 'bot') { for (const sd of [-1, 1]) { circle(sd * 12, -17, 5); g.fillStyle = k > 0.5 ? '#ffffff' : '#7bffb2'; g.fill(); } g.beginPath(); g.moveTo(0, -46); g.lineTo(0, -66); g.lineWidth = 4; g.strokeStyle = INK; g.stroke(); circle(0, -70, 7); fs(beat % 2 ? COL.red : COL.yellow, 3); }
  else face(0, o.kind === 'rice' ? -10 : -8, 30, { eye: o.kind === 'alien' ? 'dot' : (k > 0.5 ? 'happy' : 'dot'), mouth: k > 0.3 ? 'open' : 'smile' });
  if (o.kind === 'alien') { circle(0, -36, 9); fs('#fff', 3); circle(0, -35, 4); g.fillStyle = INK; g.fill(); g.beginPath(); g.moveTo(-14, -48); g.lineTo(-24, -76); g.moveTo(14, -48); g.lineTo(24, -76); g.lineWidth = 4; g.strokeStyle = INK; g.stroke(); circle(-24, -80, 6); fs(COL.yellow, 3); circle(24, -80, 6); fs(COL.pink, 3); }
  if (o.hat === 'band') { g.fillStyle = COL.red; rrect(-44, -36, 88, 14, 6); fs(COL.red, 3); g.beginPath(); g.moveTo(40, -30); g.lineTo(62, -40); g.lineTo(60, -20); g.closePath(); fs(COL.red, 3); }
  if (o.hat === 'flower') { for (let i = 0; i < 5; i++) { const a = i * TAU / 5 - Math.PI / 2; circle(Math.cos(a) * 12, -50 + Math.sin(a) * 12, 9); fs('#ffb3d1', 3); } circle(0, -50, 7); fs(COL.yellow, 3); }
  if (o.hat === 'bow') { g.beginPath(); g.moveTo(0, -48); g.lineTo(-22, -60); g.lineTo(-22, -36); g.closePath(); g.moveTo(0, -48); g.lineTo(22, -60); g.lineTo(22, -36); g.closePath(); fs(COL.red, 3); circle(0, -48, 6); fs(COL.yellow, 3); }
  if (o.hat === 'top') { rrect(-24, -86, 48, 40, 6); fs(INK, 0); rrect(-36, -50, 72, 10, 4); fs(INK, 0); g.fillStyle = COL.red; g.fillRect(-24, -60, 48, 8); }
  g.restore();
}

// ---------- particles / effects ----------
const SHAKE = { amp: 0, t: 0 };
function shake(a) { SHAKE.amp = Math.max(SHAKE.amp, a); SHAKE.t = 0; }
const JUDGE_LOOK = { p: { t: 'PERFECT!!', s: 60 }, g: { t: 'GREAT!', c: '#ff5fa2', s: 54 }, o: { t: 'GOOD', c: '#3ee0b5', s: 48 }, m: { t: 'MISS', c: '#a59cc2', s: 48 } };
const FX = {
  list: [],
  add(p) { this.list.push(p); if (this.list.length > 400) this.list.shift(); },
  burst(x, y, n, colors, spd = 400, opts = {}) {
    for (let i = 0; i < n; i++) {
      const a = (opts.a0 ?? 0) + Math.random() * (opts.spread ?? TAU), v = spd * (0.4 + Math.random() * 0.8);
      this.add({ k: opts.k || 'conf', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (opts.up || 0), g: opts.grav ?? 900,
        life: opts.life || (0.7 + Math.random() * 0.5), t: 0, c: colors[i % colors.length], s: (opts.size || 12) * (0.6 + Math.random() * 0.8), r: Math.random() * TAU, vr: (Math.random() - .5) * 14 });
    }
  },
  stars(x, y, n = 6, c = COL.yellow) { this.burst(x, y, n, [c, '#fff'], 380, { k: 'star', size: 18, grav: 300, life: 0.6 }); },
  ring(x, y, c = '#fff', r = 80) { this.add({ k: 'ring', x, y, t: 0, life: 0.35, c, s: r }); },
  word(x, y, str, c = '#fff', size = 54) { this.add({ k: 'word', x, y, t: 0, life: 0.8, c, s: size, str, vy: -120 }); },
  judge(x, y, r, sub) {
    this.list = this.list.filter(p => p.k !== 'judge'); // only the newest judgement stays on screen

class CB {
  constructor(bpm, bpb) { this.bpm = bpm; this.bpb = bpb; this.song = new Song(bpm, bpb); this.sfx = []; this.hits = []; this.objs = []; this.segs = []; this.hints = []; this.countIn = bpb; }

  obj(gid, o) { o.g = gid; this.objs.push(o); return o; }

  hint(bar, str) { this.hints.push({ b: bar * this.bpb, str }); } // bar-based
  finish(meta) {
    this.hits.sort((a, b) => a.b - b.b);
    this.objs.sort((a, b) => (a.c ?? a.b ?? 0) - (b.c ?? b.b ?? 0));
    return Object.assign({ bpm: this.bpm, bpb: this.bpb, countIn: this.countIn, song: this.song, sfx: this.sfx, hits: this.hits, objs: this.objs, segs: this.segs, hints: this.hints.sort((a, b) => a.b - b.b) }, meta);
  }

// structural validation (used by tests + dev): returns list of problems
function validateChart(ch) {
  const errs = []; const spb = 60 / ch.bpm;
  const hs = ch.hits.filter(h => h.kind !== 'release');
  for (let i = 1; i < hs.length; i++) {
    const gap = (hs[i].b - hs[i - 1].b) * spb;
    if (gap < 0.18) errs.push(`press gap ${gap.toFixed(3)}s at beat ${hs[i].b} (${hs[i].g})`);
  }
  // holds must not overlap other presses
  for (const h of ch.hits) if (h.kind === 'hold') {
    const r = h.pair;
    if (!r || r.b <= h.b) errs.push('bad hold at ' + h.b);
    for (const o of ch.hits) if (o !== h && o !== r && o.kind !== 'release' && o.b > h.b - 0.01 && o.b < r.b + 0.3) errs.push(`press during hold at ${o.b}`);
    for (const o of ch.hits) if (o !== r && o.kind !== 'release' && Math.abs(o.b - r.b) * spb < 0.15) errs.push(`press too close to release at ${r.b}`);

  if (ch.hits.some(h => h.b < 0 || h.b > ch.len)) errs.push('hit outside song');
  return errs;
}

  },
  draw(run, B, st, theme) {
    const fy = this.fy();

    let pile = 0;

    for (let i = 0; i < shown; i++) { const row = i < 4 ? 0 : i < 7 ? 1 : i < 9 ? 2 : 3; const idx = [0, 1, 2, 3, 0, 1, 2, 0, 1, 0][i]; const n = [4, 3, 2, 1][row]; this.drawOnigiri(px + (idx - (n - 1) / 2) * 70, py + 6 - row * 52, 0.7, 0, true, null); }

        const k = (B - o.h) / 0.8; if (k > 1) continue;

    crowd(B, run, H - 190 - SAFE_B * 0.5);
  },
  icon(x, y, s) { this.drawOnigiri(x, y, s, -0.15, true, 'happy'); },
};

  draw(run, B, st, theme) {

  },
  icon(x, y, s) { this.drawFrog(x, y + 10 * s, s * 0.7, COL.green, { open: 0.7, eye: 'happy', badge: true }); },

function gear(x, y, r, teeth, rot, col) {
  g.save(); g.translate(x, y); g.rotate(rot); g.beginPath();
  for (let i = 0; i < teeth * 2; i++) {
    const a0 = i * Math.PI / teeth, a1 = (i + 1) * Math.PI / teeth, rr = i % 2 ? r : r * 1.18;
    g.lineTo(Math.cos(a0) * rr, Math.sin(a0) * rr); g.lineTo(Math.cos(a1) * rr, Math.sin(a1) * rr);
  }
  g.closePath(); fs(col, 6); circle(0, 0, r * 0.35); fs(INK, 0); g.restore();
}

const ORDER = ['onigiri', 'frog', 'robo', 'pong', 'balloon', 'remix', 'ura', 'suika', 'jazz', 'surf', 'hanabi', 'remix2'];
const resKey = (id, diff) => id + '_' + diff;
function best(id, diff) { return SAVE.res[resKey(id, diff)] || null; }
function cleared(id, diff = 'n') { const r = best(id, diff); return !!(r && r.best >= 60); }
function isUnlocked(id, diff) {
  const idx = ORDER.indexOf(id);
  if (SAVE.unlockAll) return true;
  if (diff === 'h') { const r = best(id, 'n'); return !!(r && r.best >= 85); }
  const gm = GAMES[id], world = gm.world || 1;
  if (gm.isRemix) return ORDER.filter(x => (GAMES[x].world || 1) === world && !GAMES[x].isRemix).every(x => cleared(x));
  return idx === 0 || cleared(ORDER[idx - 1]);
}
function medalCount() { let n = 0; for (const k in SAVE.res) if (SAVE.res[k].best >= 85) n++; return n; }
function anyHard() { return ORDER.some(id => isUnlocked(id, 'h')); }

Scenes.play = {
  enter(arg) {
    this.arg = arg; Bgm.stop(); FX.clear(); audioUnlock();
    const gm = GAMES[arg.id];
    this.chart = arg.diff === 'p' ? gm.practice() : gm.build(arg.diff);
    this.run = new Run(this.chart, { mode: arg.diff === 'p' ? 'practice' : 'main', auto: !!arg.auto });
    this.endT = null; this.pausedUI = false;
    window.__TT_RUN = this.run;
  },
  leave() { if (A.ctx && A.ctx.state === 'suspended') A.ctx.resume(); },
  onHide() { if (!this.pausedUI && this.run && !this.run.done) this.pause(); },
  pause() { this.pausedUI = true; this.run.pause(); try { A.ctx.suspend(); } catch (e) { } },
  resume() { this.pausedUI = false; try { A.ctx.resume(); } catch (e) { } this.run.paused = false; },
  update() {
    const r = this.run; if (this.pausedUI) return;
    r.update();
    if (r.done && this.endT == null) this.endT = sceneT;
    if (this.endT != null && sceneT - this.endT > 0.7) this.finish();
  },
  finish() {
    const r = this.run, arg = this.arg;
    const score = r.score();
    if (arg.diff === 'p') { go('pracEnd', { id: arg.id, next: arg.next || 'n', st: r.st, n: r.hits.length, score }); return; }
    const key = resKey(arg.id, arg.diff), prev = SAVE.res[key];
    const perfect = r.st.m === 0 && r.st.o === 0 && r.st.stray === 0;
    const before = { unl: ORDER.map(id => isUnlocked(id, 'n')), hard: ORDER.map(id => isUnlocked(id, 'h')) };
    const rec = !prev || score > prev.best;
    SAVE.res[key] = { best: Math.max(prev ? prev.best : 0, score), perfect: (prev && prev.perfect) || perfect, plays: (prev ? prev.plays || 0 : 0) + 1 };
    writeSave();
    const news = [];
    ORDER.forEach((id, i) => { if (!before.unl[i] && isUnlocked(id, 'n')) news.push(GAMES[id].name + ' が解放!'); if (!before.hard[i] && isUnlocked(id, 'h')) news.push(GAMES[id].name + ' ハードが解放!'); });
    go('result', { id: arg.id, diff: arg.diff, score, st: r.st, n: r.hits.length, rec, perfect, news });
  },
  draw() {
    const r = this.run, B = r.B;
    const seg = r.c.segs.length ? r.gameAt(B) : null;
    const gid = seg ? seg.g : r.c.id;
    const gm = GAMES[gid];
    HYPE = 0.8 + Math.min(r.combo || 0, 30) / 30;
    SHAKE.t += 1 / 60; const sa = SHAKE.amp * Math.max(0, 1 - SHAKE.t / 0.25);
    g.save(); if (sa > 0.2) g.translate((Math.random() - 0.5) * sa * 2, (Math.random() - 0.5) * sa * 2);
    gm.draw(r, B, r.gs[gid], seg ? seg.theme : null);
    g.restore();
    // combo HUD
    if ((r.combo || 0) >= 5) {
      const since = B - (r.comboPopB ?? -9); const sc = since >= 0 && since < 0.5 ? 1 + 0.35 * Math.exp(-since * 8) : 1 + pulse(B, 8) * 0.05;
      g.save(); g.translate(W - 110, SAFE_T + 150); g.scale(sc, sc); g.rotate(0.06);
      text(String(r.combo), 0, 0, 64, r.combo >= 30 ? COL.yellow : '#fff'); text('COMBO', 0, 44, 24, COL.yellow);
      g.restore();
    }
    if (seg) GAMES.remix.drawOverlay(r, B);
    // guide rings
    if (r.guide) {
      for (let k = r.hi; k < r.hits.length; k++) {
        const h = r.hits[k]; const db = h.b - B; if (db > 1.6) break; if (h.res || db < -0.2) continue;
        if (h.kind === 'release' && r.holdHit !== h) continue;
        const gmh = GAMES[h.g]; const p = gmh.guidePos ? gmh.guidePos(r.gs[h.g], h, r) : { x: W / 2, y: H / 2 };
        const rad = 56 + Math.max(0, db) * 110;
        g.save(); g.globalAlpha = clamp(1.4 - db, 0.25, 1);
        circle(p.x, p.y, rad); g.lineWidth = 8; g.strokeStyle = '#fff'; g.stroke(); g.lineWidth = 3; g.strokeStyle = INK; g.stroke();
        circle(p.x, p.y, 50); g.lineWidth = 4; g.strokeStyle = 'rgba(255,255,255,0.8)'; g.stroke();
        const lab = h.kind === 'tap' ? 'タップ' : h.kind === 'flick' ? '↑フリック' : h.kind === 'hold' ? '長押し' : 'はなす';
        if (db < 1.0) text(lab, p.x, p.y - rad - 22, 26, '#fff');
        g.restore();
      }
    }
    // hint bubble (practice)
    const hint = r.hint(B);
    if (hint && r.mode === 'practice') {

      g.save(); g.globalAlpha = 0.95;

      rrect(40, y, W - 80, hh, 30); fs('#fff', 5);

    // count-in

      rrect(W / 2 - 150, y - 50, 300, 100, 50); fs('rgba(255,255,255,0.9)', 5);

    // pause button
    UI.btn('pause', 22, SAFE_T + 22, 84, 84, 'II', '#fff', () => this.pause(), { fg: INK, size: 34, r: 42 });
    if (r.mode === 'practice') UI.btn('skip', W - 190, SAFE_T + 22, 168, 84, 'スキップ', '#fff', () => { this.run.done = true; this.endT = sceneT - 1; Scenes.play.leaveNow = true; }, { fg: INK, size: 28 });
    if (this.pausedUI) {
      g.fillStyle = 'rgba(30,10,50,0.7)'; g.fillRect(0, 0, W, H);
      textShadow('ポーズ', W / 2, H * 0.3, 80, '#fff', 8);
      UI.btn('resume', 160, H * 0.42, 400, 110, 'つづける', COL.mint, () => this.resume());
      UI.btn('retry', 160, H * 0.42 + 140, 400, 110, 'やりなおす', COL.orange, () => { try { A.ctx.resume(); } catch (e) { } go('play', this.arg); });
      UI.btn('quit', 160, H * 0.42 + 280, 400, 110, 'やめる', '#9a8fb5', () => { try { A.ctx.resume(); } catch (e) { } go('intro', { id: this.arg.id, diff: this.arg.diff === 'p' ? (this.arg.next || 'n') : this.arg.diff }); });
    }
  },
  down(p) { if (UI.down(p)) return; if (!this.pausedUI) this.run.down(p); },

Scenes.calib = {

  reset() { this.spb = 0.6; this.n = 24; this.t0 = A.ctx.currentTime + 0.8; this.next = 0; this.d = []; this.result = null; this.flash = -9; },
  update() {

        const s = this.d.slice().sort((x, y) => x - y); const med = s[Math.floor(s.length / 2)];
        this.result = clamp(Math.round(med * 1000), -250, 300);

    if (this.result == null) {
      wrapText('「ピッ」に合わせて画面をタップ。\nできれば目をとじて、音だけで!', W / 2, top + 250, 32, W - 120, INK);
      const ph = b >= 0 ? frac(b) : 1; const sc = 1 + Math.exp(-ph * 8) * 0.25;
      circle(W / 2, H * 0.55, 150 * sc); fs(b >= 4 ? COL.pink : '#fff', 8);
      text(b < 4 ? 'まず聞いて…' : 'タップ!', W / 2, H * 0.55, 50, b >= 4 ? '#fff' : INK, b >= 4 ? INK : null);
      if (Clock.t - this.flash < 0.15) { circle(W / 2, H * 0.55, 175); g.lineWidth = 10; g.strokeStyle = COL.mint; g.stroke(); }
      text('タップ ' + this.d.length + ' 回', W / 2, H * 0.55 + 230, 34, INK, null);
    } else if (this.result === 'few') {
      wrapText('タップが少なかったみたい。\nもう一度やってみよう!', W / 2, H * 0.4, 34, W - 120, INK);
      UI.btn('re', 160, H * 0.6, 400, 110, 'もう一回', COL.orange, () => this.reset());
    } else {
      text('きみのズレ', W / 2, H * 0.36, 36, INK, null);
      textShadow((this.result > 0 ? '+' : '') + this.result + ' ms', W / 2, H * 0.44, 90, COL.pink, 8);
      wrapText(Math.abs(this.result) < 20 ? 'ほぼピッタリ!' : this.result > 0 ? '少しおそめ(音がとどくのが遅い)なので補正します' : '少しはやめなので補正します', W / 2, H * 0.53, 28, W - 120, INK);
      UI.btn('save', 120, H * 0.62, 480, 110, 'この値で保存', COL.mint, () => { SAVE.calib = this.result; writeSave(); go('settings'); });
      UI.btn('re', 120, H * 0.62 + 140, 480, 100, 'もう一回', '#fff', () => this.reset(), { fg: INK });
    }
  },
  down(p) {
    if (UI.down(p)) return;
    if (this.result != null) return;
    const t = Clock.at(p.ts); const b = (t - this.t0) / this.spb; const nb = Math.round(b);
    if (nb >= 4 && nb < this.n) { const d = t - (this.t0 + nb * this.spb); if (Math.abs(d) < 0.28) { this.d.push(d); this.flash = Clock.t; } }
  },
  up(p) { UI.up(p); }
};

// ---- 21_social.js ----
// =====================================================================
//  friends ranking : share a score code (LINE etc.) & import friends' codes
// =====================================================================
const CODE_SALT = 'tonton-parade|v1|';
function fnv(str) { let h = 0x811c9dc5; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(36); }
function b64e(s) { return btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function b64d(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return decodeURIComponent(escape(atob(s))); }
function myId() {
  if (!SAVE.pid) { SAVE.pid = Math.random().toString(36).slice(2, 10); writeSave(); }
  return SAVE.pid;
}
function today() { const d = new Date(); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }
// my record -> code
function makeCode() {
  const r = {}, pf = [];
  for (const k in SAVE.res) { r[k] = SAVE.res[k].best; if (SAVE.res[k].perfect) pf.push(k); }
  const body = b64e(JSON.stringify({ v: 1, id: myId(), n: SAVE.name || 'ななし', r, pf, t: today() }));
  return 'TTP1.' + body + '.' + fnv(CODE_SALT + body);
}
// any text (a whole LINE message is fine) -> list of valid records
function readCodes(textIn) {
  const out = []; let bad = 0;
  const re = /TTP1\.([A-Za-z0-9_-]+)\.([0-9a-z]+)/g; let m;
  while ((m = re.exec(textIn))) {
    if (fnv(CODE_SALT + m[1]) !== m[2]) { bad++; continue; }
    try {
      const o = JSON.parse(b64d(m[1]));
      if (o && o.v === 1 && typeof o.id === 'string' && o.r && typeof o.r === 'object') {
        const r = {}; for (const k in o.r) { const v = +o.r[k]; if (v >= 0 && v <= 100) r[k] = Math.round(v); }
        out.push({ id: o.id.slice(0, 12), n: String(o.n || 'ななし').slice(0, 10), r, pf: Array.isArray(o.pf) ? o.pf.slice(0, 20) : [], t: +o.t || 0 });
      } else bad++;
    } catch (e) { bad++; }
  }
  return { recs: out, bad };
}
function addFriends(recs) {
  SAVE.friends = SAVE.friends || [];
  let added = 0, updated = 0, self = 0;
  for (const r of recs) {
    if (r.id === myId()) { self++; continue; }
    const i = SAVE.friends.findIndex(f => f.id === r.id);
    if (i < 0) { SAVE.friends.push(r); added++; }
    else {
      const f = SAVE.friends[i]; // keep each stage's best, newest name
      for (const k in r.r) f.r[k] = Math.max(f.r[k] || 0, r.r[k]);
      f.pf = [...new Set([...(f.pf || []), ...r.pf])]; if (r.t >= f.t) { f.n = r.n; f.t = r.t; } updated++;
    }
  }
  if (SAVE.friends.length > 40) SAVE.friends = SAVE.friends.slice(-40);
  writeSave();
  return { added, updated, self };
}
function shareText(headline) {
  return '🎵トントン☆パレード\n' + (headline ? headline + '\n' : '') +
    'ランキング用コード(アプリの「ランキング」→「友達のコードを読み込む」に貼ってね)\n' + makeCode();
}
// ---------- share (iPhone app: native share sheet / browser: share or copy) ----------
function shareOut(textOut) {
  if (window.ReactNativeWebView) { window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'share', text: textOut })); return; }
  if (navigator.share) { navigator.share({ text: textOut }).catch(() => Overlay.copyBox(textOut)); return; }
  Overlay.copyBox(textOut);
}

// ---------- DOM overlay (text input / paste / copy) ----------
const Overlay = {
  el: null,
  open(html) {
    this.close();
    const d = document.createElement('div');
    d.id = 'ov';
    d.innerHTML = '<div class="ovp">' + html + '</div>';
    document.body.appendChild(d); this.el = d;
    d.addEventListener('pointerdown', e => e.stopPropagation());
    return d;
  },
  close() { if (this.el) { this.el.remove(); this.el = null; } },
  get isOpen() { return !!this.el; },
  name(after) {
    const d = this.open('<h2>あなたの名前</h2><p>ランキングに表示されます(10文字まで)</p>' +
      '<input id="ovName" maxlength="10" autocomplete="off" placeholder="例: よしけん">' +
      '<div class="ovb"><button id="ovCancel" class="sub">やめる</button><button id="ovOk">決定</button></div>');
    const inp = d.querySelector('#ovName'); inp.value = SAVE.name || '';
    d.querySelector('#ovCancel').onclick = () => this.close();
    d.querySelector('#ovOk').onclick = () => {
      const v = inp.value.trim().slice(0, 10); if (!v) { inp.focus(); return; }
      SAVE.name = v; writeSave(); this.close(); Sfx.ui(1); if (after) after();
    };
    setTimeout(() => inp.focus(), 50);
  },
  paste() {
    const d = this.open('<h2>友達のコードを読み込む</h2><p>LINEなどで届いたメッセージを丸ごと貼り付けてOK。何人分でもまとめて読み込めます。</p>' +
      '<textarea id="ovCode" rows="6" placeholder="ここに長押しで貼り付け"></textarea><p id="ovMsg" class="msg"></p>' +
      '<div class="ovb"><button id="ovCancel" class="sub">閉じる</button><button id="ovOk">読み込む</button></div>');
    const ta = d.querySelector('#ovCode'), msg = d.querySelector('#ovMsg');
    d.querySelector('#ovCancel').onclick = () => this.close();
    d.querySelector('#ovOk').onclick = () => {
      const { recs, bad } = readCodes(ta.value);
      if (!recs.length) { msg.textContent = bad ? 'コードが壊れているか書き換えられています。もう一度コピーしてね。' : 'コードが見つかりません。「TTP1.」から始まる部分を含めて貼ってね。'; return; }
      const r = addFriends(recs);
      msg.textContent = (r.added ? r.added + '人を追加 ' : '') + (r.updated ? r.updated + '人の記録を更新 ' : '') + (r.self && !r.added && !r.updated ? '自分のコードでした' : '');
      Sfx.fanfare(A.ctx ? A.ctx.currentTime : 0, false); ta.value = '';
    };
  },
  copyBox(textOut) {
    const d = this.open('<h2>コピーして友達に送ってね</h2><textarea id="ovCopy" rows="7" readonly></textarea><p id="ovMsg" class="msg"></p>' +
      '<div class="ovb"><button id="ovCancel" class="sub">閉じる</button><button id="ovOk">コピー</button></div>');
    const ta = d.querySelector('#ovCopy'); ta.value = textOut;
    d.querySelector('#ovCancel').onclick = () => this.close();
    d.querySelector('#ovOk').onclick = () => {
      const done = () => { d.querySelector('#ovMsg').textContent = 'コピーしました。LINEなどに貼り付けて送ってね。'; };
      try { navigator.clipboard.writeText(textOut).then(done, () => { ta.select(); document.execCommand('copy'); done(); }); }
      catch (e) { ta.select(); try { document.execCommand('copy'); } catch (e2) { } done(); }
    };
  }
};
function withName(fn) { if (SAVE.name) fn(); else Overlay.name(fn); }

// ---------- ranking scene ----------
const RANK_TABS = ['total'].concat(ORDER);
Scenes.rank = {
  enter() { this.tab = this.tab || 'total'; this.diff = this.diff || 'n'; this.scroll = 0; this.confirm = 0; startMenuMusic(); },
  leave() { Overlay.close(); },
  rows() {
    const ppl = (SAVE.friends || []).map(f => ({ id: f.id, n: f.n, r: f.r, pf: f.pf || [], me: false }));
    const mine = {}; const mpf = []; for (const k in SAVE.res) { mine[k] = SAVE.res[k].best; if (SAVE.res[k].perfect) mpf.push(k); }
    ppl.push({ id: myId(), n: SAVE.name || 'あなた', r: mine, pf: mpf, me: true });
    const d = this.diff;
    const val = p => {
      if (this.tab === 'total') { let s = 0, c = 0; for (const id of ORDER) { const v = p.r[id + '_' + d]; if (v != null) { s += v; c++; } } return c ? s : null; }
      return p.r[this.tab + '_' + d] ?? null;
    };
    const list = ppl.map(p => ({ ...p, v: val(p), perf: this.tab !== 'total' && p.pf.includes(this.tab + '_' + d) })).filter(p => p.v != null || p.me);
    list.sort((a, b) => (b.v ?? -1) - (a.v ?? -1));
    let rank = 0, prev = null; list.forEach((p, i) => { if (p.v !== prev) { rank = i + 1; prev = p.v; } p.rank = p.v == null ? null : rank; });
    return list;
  },
  draw() {
    const B = Bgm.beat();
    popBg('#ffd23f', '#ffe36e', B);
    const top = SAFE_T + 30;
    UI.btn('back', 24, top + 10, 150, 76, 'もどる', '#fff', () => go('select'), { fg: INK, size: 30 });
    textShadow('友達ランキング', W / 2 + 40, top + 50, 46, '#fff', 6);
    // name
    rrect(40, top + 110, W - 80, 64, 32); fs('#fff', 5);
    text('名前: ' + (SAVE.name || '未設定'), 70, top + 143, 28, INK, null, 'left');
    UI.btn('name', W - 210, top + 116, 160, 52, '変更', COL.sky, () => Overlay.name(), { size: 24, r: 22 });
    // difficulty
    const dy = top + 195;
    UI.btn('dn', 40, dy, 310, 64, 'ノーマル', this.diff === 'n' ? COL.pink : '#c9c9d9', () => { this.diff = 'n'; }, { size: 28 });
    UI.btn('dh', 370, dy, 310, 64, 'ハード', this.diff === 'h' ? COL.purple : '#c9c9d9', () => { this.diff = 'h'; }, { size: 28 });
    // stage chips
    const cw = 86, gap = 8, perRow = 7, x0 = (W - (perRow * cw + (perRow - 1) * gap)) / 2;
    RANK_TABS.forEach((id, i) => {
      const cy = dy + 90 + Math.floor(i / perRow) * (cw + 14);
      const x = x0 + (i % perRow) * (cw + gap) + (i >= perRow ? (cw + gap) / 2 : 0), sel = this.tab === id;
      UI.areas.push({ id: 'tab' + id, x, y: cy, w: cw, h: cw, fn: () => { this.tab = id; this.scroll = 0; } });
      rrect(x, cy + 6, cw, cw, 22); g.fillStyle = INK; g.fill();
      rrect(x, cy + (sel ? 6 : 0), cw, cw, 22); fs(sel ? (id === 'total' ? COL.orange : GAMES[id].color) : '#fff', 5);
      if (id === 'total') text('総合', x + cw / 2, cy + cw / 2 + (sel ? 6 : 0), 28, sel ? '#fff' : INK, sel ? INK : null);
      else GAMES[id].icon(x + cw / 2, cy + cw / 2 + 4 + (sel ? 6 : 0), 0.42);
    });
    const cy = dy + 90 + (cw + 14);
    const label = this.tab === 'total' ? '総合(全ステージの合計点)' : GAMES[this.tab].name;
    text(label, W / 2, cy + cw + 38, 30, '#fff');
    // list
    const ly = cy + cw + 70, bottomBtns = 250 + SAFE_B, rowH = 84;
    const rows = this.rows();
    const viewH = H - ly - bottomBtns; this.maxScroll = Math.max(0, rows.length * rowH - viewH); this.scroll = clamp(this.scroll, 0, this.maxScroll);
    g.save(); g.beginPath(); g.rect(0, ly, W, viewH); g.clip();
    if (rows.length <= 1 && !(SAVE.friends || []).length) {
      rrect(50, ly + 10, W - 100, 230, 30); fs('#fffaf0', 5);
      wrapText('まだ友達がいません。\n「自分の記録を送る」でLINEなどにコードを送り、友達から届いたコードを「読み込む」と、ここに順位が並びます。', W / 2, ly + 60, 27, W - 160, INK);
    }
    rows.forEach((p, i) => {
      const y = ly + i * rowH - this.scroll + (rows.length <= 1 && !(SAVE.friends || []).length ? 250 : 0); if (y > ly + viewH || y + rowH < ly) return;
      rrect(40, y, W - 80, rowH - 12, 24); fs(p.me ? '#ffe0ef' : '#fff', 5);
      const mc = p.rank === 1 ? '#ffc93c' : p.rank === 2 ? '#c9d1dc' : p.rank === 3 ? '#e09a5a' : null;
      if (mc) { circle(92, y + 36, 26); fs(mc, 4); text(String(p.rank), 92, y + 37, 28, INK, null); }
      else text(p.rank ? p.rank + '位' : '−', 92, y + 37, 26, INK, null);
      text(p.n + (p.me ? '(あなた)' : ''), 140, y + 37, 30, INK, null, 'left');
      if (p.perf) { star(W - 210, y + 36, 16); fs(COL.yellow, 3); }
      text(p.v == null ? '未プレイ' : p.v + (this.tab === 'total' ? '' : '点'), W - 70, y + 37, p.v == null ? 24 : 36, p.v == null ? '#9a8fb5' : INK, null, 'right');
    });
    g.restore();
    // buttons
    const by = H - bottomBtns + 20;
    UI.btn('send', 40, by, W - 80, 96, '自分の記録を送る', COL.mint, () => withName(() => shareOut(shareText(''))), { size: 34 });
    UI.btn('read', 40, by + 112, (W - 100) * 0.68, 88, '友達のコードを読み込む', COL.pink, () => Overlay.paste(), { size: 28 });
    UI.btn('clr', 60 + (W - 100) * 0.68, by + 112, (W - 100) * 0.32, 88, this.confirm ? 'もう一度' : '友達を消す', this.confirm ? COL.red : '#9a8fb5', () => {
      if (this.confirm) { SAVE.friends = []; writeSave(); this.confirm = 0; } else this.confirm = 1;
    }, { size: 22 });
  },
  down(p) { if (Overlay.isOpen) return; UI.down(p); this.drag = { y: p.y, s: this.scroll }; this.moved = false; },
  move(p) { if (this.drag) { const d = p.y - this.drag.y; if (Math.abs(d) > 12) { this.moved = true; UI.pressed = null; } this.scroll = clamp(this.drag.s - d, 0, this.maxScroll || 0); } },
  up(p) { if (!this.moved) UI.up(p); this.drag = null; }
};

    g.save(); g.translate(150, 170); g.rotate(-0.25); text('♪', 0, 0, 150, COL.mint, INK, 'center', 14); g.restore();
    g.save(); g.translate(585, 150); g.rotate(0.2); text('♫', 0, 0, 140, COL.sky, INK, 'center', 14); g.restore();
    window.__ICON_DONE = true; return;
  }
  loadSave(); resize(); setupInput();
  window.__TT = { GAMES, Run, validateChart, go, SAVE, A, Clock, Scenes, ORDER, FX };
  if (q.get('auto')) {
    audioUnlock();
    go('play', { id: q.get('g') || 'onigiri', diff: q.get('d') || 'n', auto: true });
  } else if (q.get('scene')) {
    audioUnlock();
    const arg = q.get('arg') ? JSON.parse(q.get('arg')) : undefined;
    go(q.get('scene'), arg);
  } else go('title');
  requestAnimationFrame(frame);
})();

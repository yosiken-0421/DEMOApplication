name: MichiNavi
options:
  minimumXcodeGenVersion: 2.42.0
  developmentLanguage: ja
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  MichiNavi:
    type: application
    platform: iOS
    sources:
      - path: MichiNavi
    info:
      path: MichiNavi/Info.plist
      properties:
        UIBackgroundModes: [audio, location]
        LSApplicationQueriesSchemes: [orbis]
        NSLocationWhenInUseUsageDescription: 現在地を地図に表示し、ルート案内をするために使います。
        NSLocationAlwaysAndWhenInUseUsageDescription: 画面を閉じていてもルート案内を続けるために使います。
        NSSpeechRecognitionUsageDescription: 話した行き先を文字にして検索するために使います。
        NSMicrophoneUsageDescription: 行き先を声で入力するために使います。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yosiken0421.michinavi
        PRODUCT_NAME: MichiNavi
        INFOPLIST_KEY_CFBundleDisplayName: ミチナビ
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.navigation
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO

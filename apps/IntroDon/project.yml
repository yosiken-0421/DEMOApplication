name: IntroDon
options:
  bundleIdPrefix: com.yosiken0421.introdon
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  IntroDon:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: IntroDon
        PRODUCT_BUNDLE_IDENTIFIER: com.yosiken0421.introdon
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: イントロどんぴしゃ
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBG
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSAppleMusicUsageDescription: iPhoneのミュージックやApple Musicの曲をイントロクイズで再生するために使います。
        ITSAppUsesNonExemptEncryption: false

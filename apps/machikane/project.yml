name: Machikane
options:
  bundleIdPrefix: com.yosiken0421
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""                 # GitHub Actions では Secrets の APPLE_TEAM_ID を使う
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"         # GitHub Actions では github.run_number で上書き
    MK_BUNDLE_ID: com.yosiken0421.machikane
    MK_APP_GROUP: group.com.yosiken0421.machikane
packages:
  MachikaneCore:
    path: MachikaneCore
targets:
  Machikane:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - target: MachikaneWidget
      - package: MachikaneCore
    settings:
      base:
        PRODUCT_NAME: Machikane
        PRODUCT_BUNDLE_IDENTIFIER: $(MK_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: App/Machikane.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: まちかね
        CFBundleDevelopmentRegion: ja
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # 1 日 1 回程度の自動取得（BGAppRefreshTask）
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.yosiken0421.machikane.refresh]
        # 当日の残り時間（Live Activity）
        NSSupportsLiveActivities: true
        NSCalendarsWriteOnlyAccessUsageDescription: 作品の発売日・放送日を iPhone のカレンダーに登録するために使います。
        NSCalendarsFullAccessUsageDescription: 登録した予定を、発売日の変更（延期など）に合わせて自動で更新・削除するために使います。ほかの予定は読み取りません。
        MKAppGroup: $(MK_APP_GROUP)
    entitlements:
      path: App/Machikane.entitlements
      properties:
        com.apple.security.application-groups: [$(MK_APP_GROUP)]

  MachikaneWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    dependencies:
      - package: MachikaneCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_NAME: MachikaneWidget
        PRODUCT_BUNDLE_IDENTIFIER: $(MK_BUNDLE_ID).widget
        CODE_SIGN_ENTITLEMENTS: Widget/MachikaneWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: まちかね
        CFBundleDevelopmentRegion: ja
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MKAppGroup: $(MK_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/MachikaneWidget.entitlements
      properties:
        com.apple.security.application-groups: [$(MK_APP_GROUP)]

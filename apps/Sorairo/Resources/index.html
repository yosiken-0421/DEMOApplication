<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>そらいろ冒険隊</title>
<style>
:root{
  --ink:#4A3550; --ink2:#7A6283; --ink3:#A996B0;
  --pink:#FF8FB8; --pink2:#FFC2D8; --pink3:#FFE8F1;
  --lav:#B9A8F5; --lav2:#DCD3FF; --mint:#8EDDC4; --mint2:#D3F5EA;
  --sky:#9FD3FF; --lemon:#FFE08A; --peach:#FFC9A8;
  --card:#FFFFFF; --panel:#FFF7FB; --line:#F3DCE8;
  --font:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","M PLUS Rounded 1c","Rounded Mplus 1c",system-ui,sans-serif;
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#FFE8F1;font-family:var(--font);color:var(--ink);touch-action:manipulation}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---------- top bar ---------- */
#top{padding:calc(var(--st) + 10px) 12px 6px;display:flex;gap:8px;align-items:center;z-index:5;background:linear-gradient(#FFE8F1,#FFE8F1cc)}
.pill{display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:5px 12px 5px 6px;font-weight:700;font-size:15px;box-shadow:0 2px 0 #F3C9DA}
.pill .ic{width:22px;height:22px;flex:none}
#goldPill{flex:1.4;min-width:0}
#goldTxt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gemPill{flex:.9}
#featherPill{flex:.8}
#setBtn{width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 2px 0 #F3C9DA;display:flex;align-items:center;justify-content:center;flex:none}
.bump{animation:bump .25s ease-out}
@keyframes bump{40%{transform:scale(1.12)}100%{transform:scale(1)}}

/* ---------- battle ---------- */
#battle{position:relative;height:44vh;min-height:300px;margin:4px 10px 0;border-radius:26px;overflow:hidden;box-shadow:0 4px 0 #F3C9DA, inset 0 0 0 3px #fff}
#sky{position:absolute;inset:0;transition:background 1s}
#ground{position:absolute;left:-10%;right:-10%;bottom:-38%;height:62%;border-radius:50%;transition:background 1s}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.75;animation:drift linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:55%;height:160%;left:15%;top:-70%}
.cloud:after{width:40%;height:130%;right:12%;top:-45%}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(520px)}}
#stageBar{position:absolute;left:12px;right:12px;top:10px;display:flex;align-items:center;gap:8px;z-index:3}
#areaName{background:#ffffffd9;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;color:var(--ink2)}
#stageNo{background:var(--ink);color:#fff;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
#dots{display:flex;gap:4px;margin-left:auto;background:#ffffffd9;border-radius:999px;padding:6px 9px}
#dots i{width:8px;height:8px;border-radius:50%;background:#EBDDE6;display:block;transition:background .2s,transform .2s}
#dots i.on{background:var(--pink);transform:scale(1.15)}
#bossTimer{position:absolute;left:12px;right:12px;top:44px;height:10px;border-radius:6px;background:#ffffffb0;overflow:hidden;display:none;z-index:3}
#bossTimer div{height:100%;background:linear-gradient(90deg,#FF8FB8,#FFB37A);border-radius:6px}
#enemyBox{position:absolute;left:50%;top:17%;width:46%;max-width:210px;transform:translateX(-30%);z-index:2}
#enemyName{text-align:center;font-size:13px;font-weight:700;margin-bottom:2px;text-shadow:0 1px 0 #fff,0 -1px 0 #fff,1px 0 0 #fff,-1px 0 0 #fff}
#hpBar{height:12px;border-radius:7px;background:#fff;box-shadow:0 2px 0 #00000014;overflow:hidden;margin:0 8%}
#hpFill{height:100%;width:100%;background:linear-gradient(90deg,#FF8FB8,#FF6F9E);border-radius:7px;transition:width .12s}
#hpTxt{display:table;margin:3px auto 0;font-size:11px;font-weight:700;color:var(--ink2);background:#ffffffcc;border-radius:999px;padding:0 8px}
#enemy{position:relative;width:100%;aspect-ratio:1;margin-top:2px}
#enemy svg{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 0 #00000014)}
#enemy .bob{animation:bob 2.2s ease-in-out infinite;transform-origin:50% 90%;width:100%;height:100%}
@keyframes bob{50%{transform:translateY(-5px) scale(1.02,.98)}}
#enemy.hit .squ{animation:squ .16s ease-out}
@keyframes squ{40%{transform:scale(1.12,.86)}100%{transform:scale(1)}}
#enemy .squ{width:100%;height:100%;transform-origin:50% 90%}
#enemy.flash svg{filter:brightness(1.6) drop-shadow(0 6px 0 #00000014)}
#enemy.die .squ{animation:pop .32s ease-in forwards}
@keyframes pop{30%{transform:scale(1.2,.8)}100%{transform:scale(0);opacity:0}}
#enemy.spawn .squ{animation:spawn .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes spawn{from{transform:scale(.2);opacity:0}}
#party{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:8px;z-index:3;padding:0 10px}
.hero{width:21%;max-width:66px;position:relative;transition:transform .2s}
.hero .face{width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;background:#fff;box-shadow:0 0 0 3px #fff,0 4px 0 3px #00000018}
.hero .face svg{width:100%;height:100%;display:block}
.hero .tag{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);background:#fff;border-radius:999px;font-size:10px;font-weight:700;padding:1px 7px;white-space:nowrap;color:var(--ink2)}
.hero{animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(-3px)}}
.hero .face{will-change:transform}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
#floatLayer{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.dmg{position:absolute;font-weight:800;font-size:18px;color:#fff;white-space:nowrap;transform:translate(-50%,-50%);
  text-shadow:0 2px 0 var(--c,#E0558A),2px 0 0 var(--c,#E0558A),-2px 0 0 var(--c,#E0558A),0 -2px 0 var(--c,#E0558A),2px 2px 0 var(--c,#E0558A),-2px 2px 0 var(--c,#E0558A);
  animation:floatUp .9s ease-out forwards}
.dmg.crit{font-size:28px;--c:#FF7A3D;animation:floatCrit 1s ease-out forwards}
.dmg.gold{--c:#E6A817;font-size:15px}
.dmg.sm{font-size:13px;--c:#9C7FD9}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-70%) scale(1.15)}30%{transform:translate(-50%,-90%) scale(1)}100%{opacity:0;transform:translate(-50%,-220%)}}
@keyframes floatCrit{0%{opacity:0;transform:translate(-50%,-40%) scale(.4) rotate(-8deg)}18%{opacity:1;transform:translate(-50%,-80%) scale(1.35) rotate(4deg)}35%{transform:translate(-50%,-95%) scale(1.1) rotate(0)}100%{opacity:0;transform:translate(-50%,-230%) scale(1)}}
.slash{position:absolute;width:90px;height:16px;border-radius:50%;background:radial-gradient(closest-side,#fff,#ffffff00);transform:translate(-50%,-50%) rotate(var(--r));animation:slash .22s ease-out forwards;pointer-events:none}
@keyframes slash{from{opacity:1;width:20px}to{opacity:0;width:130px}}
.coinFly{position:fixed;width:22px;height:22px;z-index:50;pointer-events:none;will-change:transform}
#skills{position:absolute;right:10px;top:62px;display:flex;flex-direction:column;gap:8px;z-index:6}
.skill{width:52px;height:52px;border-radius:18px;background:#fff;box-shadow:0 3px 0 #E8C3D4;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:9px;font-weight:700;color:var(--ink2)}
.skill svg{width:26px;height:26px}
.skill .cd{position:absolute;left:0;right:0;bottom:0;background:#4A355055;transition:height .2s}
.skill .cdt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:800;text-shadow:0 1px 2px #0006}
.skill.active{box-shadow:0 0 0 3px var(--lemon),0 3px 0 #E8C3D4;animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px #FFE08A99,0 3px 0 #E8C3D4}}
#bossBtn{position:absolute;left:12px;top:44px;z-index:6;display:none;background:linear-gradient(#FF9DC2,#FF7AA8);color:#fff;font-weight:800;font-size:13px;padding:8px 14px;border-radius:999px;box-shadow:0 3px 0 #D9558A;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
#banner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:7;pointer-events:none;font-size:26px;font-weight:800;color:#fff;white-space:nowrap;opacity:0;
  text-shadow:0 3px 0 #E0558A,3px 0 0 #E0558A,-3px 0 0 #E0558A,0 -3px 0 #E0558A,3px 3px 0 #E0558A,-3px 3px 0 #E0558A}
#banner.show{animation:banner 1.6s ease-out forwards}
@keyframes banner{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%)}}
#battle.shake{animation:shake .25s}
@keyframes shake{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,0)}}
#tapHint{position:absolute;left:50%;top:58%;transform:translateX(-50%);z-index:7;background:#fff;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:800;color:var(--pink);box-shadow:0 3px 0 #F3C9DA;pointer-events:none;animation:pulse 1s infinite;display:none}

/* ---------- dps row ---------- */
#dpsRow{display:flex;justify-content:center;gap:14px;font-size:12px;font-weight:700;color:var(--ink2);padding:6px 0 4px}
#dpsRow b{color:var(--ink);font-size:14px}
#boostTag{display:none;background:var(--lemon);color:#7A5A00;border-radius:999px;padding:1px 8px}

/* ---------- panel ---------- */
#panel{flex:1;min-height:0;margin:0 10px;background:var(--panel);border-radius:24px 24px 0 0;box-shadow:0 -2px 0 #F3C9DA;display:flex;flex-direction:column;overflow:hidden}
#panelHead{display:flex;align-items:center;padding:10px 14px 6px;gap:8px}
#panelTitle{font-size:16px;font-weight:800}
#mulBox{margin-left:auto;display:flex;background:#fff;border-radius:999px;padding:3px;box-shadow:0 2px 0 #F3C9DA}
#mulBox button{font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;color:var(--ink3)}
#mulBox button.on{background:var(--pink);color:#fff}
#list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 10px 14px}
.row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:8px 10px;margin-bottom:8px;box-shadow:0 2px 0 var(--line)}
.row .av{width:52px;height:52px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--pink3);position:relative}
.row .av svg{width:100%;height:100%;display:block}
.row .info{flex:1;min-width:0}
.row .nm{font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px}
.row .nm small{font-size:11px;color:var(--ink3);font-weight:700}
.row .sub{font-size:11px;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:6px;border-radius:4px;background:#F6E8EF;margin-top:4px;overflow:hidden}
.prog div{height:100%;background:linear-gradient(90deg,#B9A8F5,#FF8FB8);border-radius:4px;transition:width .2s}
.buy{min-width:86px;padding:7px 8px;border-radius:14px;background:linear-gradient(#FFA9CB,#FF84B0);color:#fff;font-weight:800;font-size:13px;box-shadow:0 3px 0 #D9558A;line-height:1.15;text-align:center;transition:transform .08s}
.buy small{display:block;font-size:10px;opacity:.95}
.buy.no{background:#EADDE4;box-shadow:0 3px 0 #D3C1CB;color:#fff}
.buy.mint{background:linear-gradient(#9BE6CE,#6FD3B4);box-shadow:0 3px 0 #3FAE8C}
.buy.lav{background:linear-gradient(#C8B9FF,#A893F2);box-shadow:0 3px 0 #7D69C9}
.buy:active,.press:active{transform:scale(.93) translateY(2px)}
.stars{color:#FFC94D;font-size:11px;letter-spacing:-1px}
.badgeNew{background:var(--pink);color:#fff;font-size:9px;border-radius:999px;padding:1px 6px}
.lockAv{filter:brightness(0) opacity(.18)}
.sec{font-size:13px;font-weight:800;color:var(--ink2);margin:10px 4px 6px;display:flex;align-items:center;gap:6px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{background:#fff;border-radius:16px;padding:6px 4px;text-align:center;box-shadow:0 2px 0 var(--line);font-size:10px;font-weight:700;color:var(--ink2)}
.cell .pic{width:100%;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--pink3)}
.cell .pic svg{width:100%;height:100%;display:block}
.cell .cnt{font-size:9px;color:var(--ink3)}
.card{background:#fff;border-radius:20px;padding:14px;box-shadow:0 2px 0 var(--line);margin-bottom:10px}
.big{font-size:22px;font-weight:800}
.note{font-size:12px;color:var(--ink2);line-height:1.6}

/* ---------- tabs ---------- */
#tabs{display:flex;background:#fff;margin:0 10px;padding:6px 4px calc(var(--sb) + 6px);border-top:1px solid var(--line)}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:800;color:var(--ink3);position:relative;padding:4px 0;border-radius:14px}
#tabs button svg{width:24px;height:24px}
#tabs button.on{color:var(--pink);background:var(--pink3)}
#tabs .dot{position:absolute;top:2px;right:22%;width:9px;height:9px;border-radius:50%;background:#FF5C8D;box-shadow:0 0 0 2px #fff;display:none}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;background:#4A355066;z-index:40;display:none;align-items:center;justify-content:center;padding:24px}
#modal.show{display:flex}
#mbox{background:#fff;border-radius:28px;width:100%;max-width:360px;padding:22px 18px 18px;text-align:center;box-shadow:0 6px 0 #E8C3D4;animation:mIn .35s cubic-bezier(.3,1.5,.5,1);max-height:86vh;overflow-y:auto}
@keyframes mIn{from{transform:scale(.6);opacity:0}}
#mbox h2{margin:0 0 6px;font-size:20px}
#mbox .mbtns{display:flex;gap:10px;margin-top:16px;justify-content:center}
#mbox .mbtns .buy{min-width:120px;padding:11px 14px;font-size:15px}
.ray{width:120px;height:120px;margin:0 auto 6px;position:relative}
.ray:before{content:"";position:absolute;inset:-20px;background:repeating-conic-gradient(#FFE08A55 0 12deg,#ffffff00 12deg 24deg);border-radius:50%;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ray > *{position:relative}
.loginRow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0 4px}
.loginRow div{border-radius:12px;background:var(--pink3);padding:6px 0;font-size:10px;font-weight:800;color:var(--ink2)}
.loginRow div.done{background:var(--mint2);color:#2E8B6F}
.loginRow div.today{background:var(--pink);color:#fff;animation:pulse 1s infinite}
#toast{position:fixed;left:50%;top:calc(var(--st) + 54px);transform:translate(-50%,-140%);z-index:60;background:#fff;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:800;box-shadow:0 4px 0 #E8C3D4;transition:transform .35s cubic-bezier(.3,1.5,.5,1),opacity .2s;opacity:0;white-space:nowrap;display:flex;gap:6px;align-items:center;pointer-events:none}
#toast.show{transform:translate(-50%,0);opacity:1}
.toggle{width:52px;height:30px;border-radius:999px;background:#EADDE4;position:relative;transition:background .2s;flex:none}
.toggle:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px #0002}
.toggle.on{background:var(--mint)}
.toggle.on:after{left:25px}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="pill" id="goldPill"><span class="ic" id="coinIcon"></span><span id="goldTxt">0</span></div>
    <div class="pill" id="gemPill"><span class="ic" id="gemIcon"></span><span id="gemTxt">0</span></div>
    <div class="pill" id="featherPill"><span class="ic" id="featherIcon"></span><span id="featherTxt">0</span></div>
    <button id="setBtn" class="press" aria-label="設定"></button>
  </div>

  <div id="battle">
    <div id="sky"></div>
    <div id="clouds"></div>
    <div id="ground"></div>
    <div id="stageBar"><span id="stageNo">1</span><span id="areaName">花の丘</span><div id="dots"></div></div>
    <div id="bossTimer"><div></div></div>
    <button id="bossBtn" class="press">ボスに挑む！</button>
    <div id="skills"></div>
    <div id="enemyBox">
      <div id="enemyName"></div>
      <div id="hpBar"><div id="hpFill"></div></div>
      <div id="hpTxt"></div>
      <div id="enemy"><div class="squ"><div class="bob" id="enemySvg"></div></div></div>
    </div>
    <div id="party"></div>
    <canvas id="fx"></canvas>
    <div id="floatLayer"></div>
    <div id="banner"></div>
    <div id="tapHint">タップしてこうげき！</div>
  </div>

  <div id="dpsRow"><span>毎秒 <b id="dpsTxt">0</b></span><span>タップ <b id="tapTxt">1</b></span><span id="boostTag"></span></div>

  <div id="panel">
    <div id="panelHead"><div id="panelTitle">仲間</div>
      <div id="mulBox"><button data-m="1" class="on">×1</button><button data-m="10">×10</button><button data-m="25">×25</button><button data-m="0">MAX</button></div>
    </div>
    <div id="list"></div>
  </div>
  <div id="tabs"></div>
</div>

<div id="modal"><div id="mbox"></div></div>
<div id="toast"></div>

<script>
"use strict";
/* =====================================================================
   そらいろ冒険隊 — 放置×キャラ育成
   ===================================================================== */

/* ---------- 端末とのやりとり（セーブ・振動・通知） ---------- */
const Native = {
  ok: !!(window.ReactNativeWebView && window.ReactNativeWebView.postMessage),
  send(o){ try{ if(this.ok) window.ReactNativeWebView.postMessage(JSON.stringify(o)); }catch(e){} },
  lastHaptic: 0,
  haptic(kind){ const n=performance.now(); if(kind==='light' && n-this.lastHaptic<70) return; this.lastHaptic=n;
    if(!S || S.set.haptic) this.send({type:'haptic',kind}); }
};

/* ---------- 数字の表示（万・億・兆…） ---------- */
const UNITS=['','万','億','兆','京','垓','秭','穣','溝','澗','正','載','極'];
function fmt(n){
  if(!isFinite(n)) return '∞';
  n=Math.floor(n);
  if(n<10000) return n.toLocaleString('ja-JP');
  const e=Math.floor(Math.log10(n)/4);
  if(e<UNITS.length){ const v=n/Math.pow(10,e*4); return (v>=1000?Math.floor(v).toString():v>=100?v.toFixed(1):v.toFixed(2)).replace(/\.0+$/,'').replace(/(\.\d*?)0+$/,'$1')+UNITS[e]; }
  return n.toExponential(2).replace('e+','e');
}
function fmtTime(sec){ sec=Math.max(0,Math.floor(sec)); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  return h? `${h}時間${m}分` : m? `${m}分${s}秒` : `${s}秒`; }
const $=id=>document.getElementById(id);
function setH(el,h){ if(el && el._h!==h){ el._h=h; el.innerHTML=h; } }
function setT(el,t){ if(el && el.textContent!==t) el.textContent=t; }
function setC(el,c){ if(el && el.className!==c) el.className=c; }
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
function todayStr(t=Date.now()){ const d=new Date(t); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }

/* =====================================================================
   キャラクター（アニメ調・バストアップ）
   ===================================================================== */
const HEROES=[
 {name:'ミル',  role:'剣士',     cost:10,    dps:1,     hair:'#FF9EC4',hair2:'#E8679B',eye:'#3BB7A8',style:'long', acc:'ribbon', accC:'#FFFFFF',outfit:'#FFFFFF',trim:'#FF8FB8',bg:'#FFE3EE'},

function fringePath(top, pts){
  const r=v=>Math.round(v*10)/10;
  let d=`M${pts[pts.length-1][0]},${pts[pts.length-1][1]} ${top} `;
  for(let i=1;i<pts.length;i++){ const p=pts[i-1], q=pts[i]; const down=q[1]>p[1];
    const c1= down? [p[0]+(q[0]-p[0])*0.15, p[1]+(q[1]-p[1])*0.55] : [p[0]+(q[0]-p[0])*0.3, p[1]-1.5];
    const c2= down? [q[0]-(q[0]-p[0])*0.3, q[1]-1.5] : [q[0]-(q[0]-p[0])*0.15, q[1]+(p[1]-q[1])*0.55];
    d+=`C${r(c1[0])},${r(c1[1])} ${r(c2[0])},${r(c2[1])} ${q[0]},${q[1]} `; }
  return d+'Z';
}

const isBossStage=s=>s%5===0, isAreaBoss=s=>s%25===0;
const areaIdx=s=>Math.floor((s-1)/25)%AREAS.length;
const areaLoop=s=>Math.floor((s-1)/(25*AREAS.length));
function enemyHP(s){ return 10*Math.pow(HP_RATE,s-1)*(isAreaBoss(s)?10:isBossStage(s)?6:1); }
function enemyGold(s){ return Math.ceil(10*Math.pow(HP_RATE,s-1)/6*(isBossStage(s)?3:1)+1); }
function milestoneMult(L){ let m=1; if(L>=10)m*=2; for(let t=25;t<=L;t+=25)m*=3; return m; }
function nextMilestone(L){ return L<10?10:(Math.floor(L/25)+1)*25; }
function heroCost(i,L){ return HEROES[i].cost*Math.pow(COST_RATE,L); }
function heroCostN(i,L,n){ return HEROES[i].cost*Math.pow(COST_RATE,L)*(Math.pow(COST_RATE,n)-1)/(COST_RATE-1); }
function heroMaxN(i,L,gold){ const c=heroCost(i,L); return Math.max(0,Math.floor(Math.log(gold*(COST_RATE-1)/c+1)/Math.log(COST_RATE))); }
function leadCost(L){ return 5*Math.pow(1.08,L-1); }
function leadCostN(L,n){ return 5*Math.pow(1.08,L-1)*(Math.pow(1.08,n)-1)/0.08; }
function leadMaxN(L,gold){ const c=leadCost(L); return Math.max(0,Math.floor(Math.log(gold*0.08/c+1)/Math.log(1.08))); }
function feathersFor(m){ return m<40?0:Math.floor(Math.pow((m-20)/4,1.6)); }

function loadState(){
  let raw=null;
  try{ raw = window.__SR_SAVE__ || localStorage.getItem(SAVE_KEY); }catch(e){}
  const base=freshState();
  if(!raw) return base;
  try{
    const o=JSON.parse(raw);
    const merge=(a,b)=>{ for(const k in b){ if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object') merge(a[k],b[k]); else if(b[k]!==undefined) a[k]=b[k]; } return a; };
    merge(base,o);
    while(base.heroes.length<HEROES.length) base.heroes.push({lv:0,star:0});
    return base;
  }catch(e){ return base; }
}

/* =====================================================================

   ===================================================================== */
function featherMult(){ return 1+0.1*S.feathers; }
function heroDps(i){ const h=S.heroes[i]; if(!h.lv) return 0;
  return HEROES[i].dps*h.lv*milestoneMult(h.lv)*Math.pow(2,h.star)*featherMult()*(1+S.perm.dmg*0.25); }
function rageMult(){ return now()<S.skill.rageEnd?3:1; }
function totalDps(){ let t=0; for(let i=0;i<HEROES.length;i++) t+=heroDps(i); return t*rageMult(); }
function tapDmg(){ const base=S.lead*2+Math.floor(S.lead/25)*S.lead*2; return (base+totalDps()*0.04)*(1+S.perm.tap*0.5)*featherMult()*rageMult(); }
function goldMult(){ return (1+S.perm.gold*0.2)*(now()<S.skill.rainEnd?3:1); }
function offlineCapSec(){ return (8+S.perm.offH*2)*3600; }
function offlineRate(){ return 0.5+S.perm.offR*0.1; }
function bossTime(){ return BOSS_TIME+S.perm.boss*3; }
function goldPerSec(){ // 放置中の目安
  const s=Math.max(1,S.farm||isBossStage(S.stage)?S.stage-(isBossStage(S.stage)?1:0):S.stage);
  let d=0; for(let i=0;i<HEROES.length;i++) d+=heroDps(i);
  if(d<=0) return 0;
  const tKill=enemyHP(s)/d+0.6;
  return enemyGold(s)/tKill*(1+S.perm.gold*0.2);
}
function now(){ return Date.now(); }

  tone(freq,dur,type='sine',vol=.08,delay=0,slide=0){ if(!S.set.sound||!this.ctx) return; const c=this.ctx,t=c.currentTime+delay;
    const o=c.createOscillator(),g=c.createGain(); o.type=type; o.frequency.setValueAtTime(freq,t); if(slide) o.frequency.exponentialRampToValueAtTime(freq*slide,t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.02); },

const fx=$('fx'), fctx=fx.getContext('2d'); let parts=[];
function resizeFx(){ const r=$('battle').getBoundingClientRect(), d=Math.min(2,window.devicePixelRatio||1); fx.width=r.width*d; fx.height=r.height*d; fctx.setTransform(d,0,0,d,0,0); }
window.addEventListener('resize',resizeFx);
function burst(x,y,n,cols,spd=4,star=false){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=rnd(spd*.4,spd);
  parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.5,life:1,dec:rnd(.018,.035),r:rnd(2.5,5.5),c:cols[i%cols.length],star}); } }
function drawStar(ctx,x,y,r){ ctx.beginPath(); for(let i=0;i<10;i++){ const rr=i%2?r*.45:r, a=i*Math.PI/5-Math.PI/2; ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);} ctx.closePath(); ctx.fill(); }
function stepFx(){ fctx.clearRect(0,0,fx.width,fx.height);
  for(const p of parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.vx*=0.98; p.life-=p.dec; fctx.globalAlpha=Math.max(0,p.life); fctx.fillStyle=p.c;
    if(p.star) drawStar(fctx,p.x,p.y,p.r*1.4); else { fctx.beginPath(); fctx.arc(p.x,p.y,p.r*p.life+0.5,0,7); fctx.fill(); } }
  fctx.globalAlpha=1; parts=parts.filter(p=>p.life>0); }
function enemyCenter(){ const b=$('battle').getBoundingClientRect(), e=$('enemy').getBoundingClientRect(); return {x:e.left-b.left+e.width/2, y:e.top-b.top+e.height*.55, w:e.width}; }
let floatCount=0;
function floatText(x,y,txt,cls){ if(floatCount>22) return; floatCount++; const d=document.createElement('div'); d.className='dmg '+(cls||''); d.textContent=txt; d.style.left=x+'px'; d.style.top=y+'px';
  $('floatLayer').appendChild(d); setTimeout(()=>{d.remove();floatCount--;},1000); }
function slashAt(x,y){ const d=document.createElement('div'); d.className='slash'; d.style.left=x+'px'; d.style.top=y+'px'; d.style.setProperty('--r',rnd(-50,20)+'deg'); $('floatLayer').appendChild(d); setTimeout(()=>d.remove(),240); }
function hitEnemy(){ const e=$('enemy'); e.classList.remove('hit','flash'); void e.offsetWidth; e.classList.add('hit','flash'); clearTimeout(hitEnemy.t); hitEnemy.t=setTimeout(()=>e.classList.remove('flash'),60); }
function shake(){ const b=$('battle'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); }
function banner(t){ const b=$('banner'); b.textContent=t; b.classList.remove('show'); void b.offsetWidth; b.classList.add('show'); }
function flyCoins(x,y,n){ const br=$('battle').getBoundingClientRect(), tr=$('coinIcon').getBoundingClientRect();
  for(let i=0;i<n;i++){ const c=document.createElement('div'); c.className='coinFly'; c.innerHTML=ICON.coin; document.body.appendChild(c);
    const sx=br.left+x+rnd(-30,30), sy=br.top+y+rnd(-20,20), mx=sx+rnd(-60,60), my=sy-rnd(40,90), ex=tr.left, ey=tr.top;
    const t0=performance.now()+i*45, dur=650+rnd(0,200);
    (function anim(t){ const k=clamp((t-t0)/dur,0,1); if(t<t0){ c.style.transform=`translate(${sx}px,${sy}px) scale(0)`; requestAnimationFrame(anim); return; }
      const e=k<.35? k/.35 : 1, k2= k<.35?0:(k-.35)/.65, ease=k2*k2;
      const px= k<.35? sx+(mx-sx)*(1-Math.pow(1-e,2)) : mx+(ex-mx)*ease, py= k<.35? sy+(my-sy)*(1-Math.pow(1-e,2)) : my+(ey-my)*ease;
      c.style.transform=`translate(${px}px,${py}px) scale(${k<.1?k*10:1-.3*k2})`;
      if(k<1) requestAnimationFrame(anim); else { c.remove(); if(i===n-1){ $('goldPill').classList.remove('bump'); void $('goldPill').offsetWidth; $('goldPill').classList.add('bump'); Snd.coin(); } } })(performance.now()); } }

/* ---------- ダメージ処理 ---------- */
function dealDamage(dmg){
  if(!enemy || enemy.hp<=0) return false;
  enemy.hp-=dmg; updateHp();
  if(enemy.hp<=0){ killEnemy(); return true; }
  return false;
}
function killEnemy(){
  const e=enemy, c=enemyCenter();
  const g=Math.ceil(enemyGold(e.stage)*goldMult());
  S.gold+=g; S.stats.gold+=g; S.stats.kills++; S.daily.p.kill++;
  S.dex[e.key]=(S.dex[e.key]||0)+1;
  if(S.dex[e.key]===1){ S.gems+=1; toast(`図鑑に「${e.name.replace('ボス・','')}」を登録！ ${ICON.gem}+1`); }
  $('enemy').classList.add('die'); Snd.pop(); burst(c.x,c.y,e.boss?40:16,['#FFD45E','#FF9EC4','#FFFFFF','#C9B2FF'],e.boss?7:4.5,true);
  floatText(c.x,c.y-c.w*.35,'+'+fmt(g),'gold'); flyCoins(c.x,c.y,e.boss?8:3);
  if(e.boss){
    S.stats.bossKills++; S.daily.p.boss++; Native.haptic('success'); Snd.win(); bossLeft=0; $('bossTimer').style.display='none';
    if(!S.firstBoss[e.stage]){ S.firstBoss[e.stage]=1; const gem=e.ab?5:1; S.gems+=gem; setTimeout(()=>toast(`はじめての撃破！ ${ICON.gem}+${gem}`),900); }
    banner(e.ab?'大ボス撃破！':'ボス撃破！');
    if(!S.askedNotify && S.stats.bossKills>=1){ S.askedNotify=true; setTimeout(()=>Native.send({type:'askNotify'}),2500); }
    advanceStage();
  } else {
    if(!S.farm){ S.kills++; if(S.kills>=ENEMIES_PER_STAGE) advanceStage(); }
    else { S.kills=Math.min(ENEMIES_PER_STAGE,S.kills+1); }
  }
  enemy=null; spawnLock=performance.now()+330;
  setTimeout(()=>{ stageInfo(); spawnEnemy(); },330);
  checkAch();
}
function advanceStage(){
  S.stage++; S.kills=0;
  if(S.stage>S.maxStage){ S.maxStage=S.stage; if(S.stage%25===1 && S.stage>1) setTimeout(()=>banner(`新しい場所：${AREAS[areaIdx(S.stage)].name}`),700); }
  S.farm=false; buildSkills();
}
function bossFail(){
  Snd.fail(); Native.haptic('soft'); banner('時間切れ…'); S.stage=Math.max(1,S.stage-1); S.kills=0; S.farm=true;
  setTimeout(()=>toast('仲間を強くして「ボスに挑む」をタップ！'),900);
  enemy=null; setTimeout(()=>{ stageInfo(); spawnEnemy(); },500);
}
$('bossBtn').addEventListener('click',e=>{ e.stopPropagation(); S.farm=false; S.stage++; S.kills=0; enemy=null; Native.haptic('soft'); stageInfo(); spawnEnemy(); });

let tapHintShown=false;
$('battle').addEventListener('pointerdown',e=>{
  if(e.target.closest('.skill,#bossBtn')) return;
  Snd.init();
  if(!enemy || enemy.hp<=0) return;
  const r=$('battle').getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
  const crit=Math.random()<0.06; let d=tapDmg()*(crit?5:1);
  S.stats.taps++; S.daily.p.tap++;
  const c=enemyCenter();
  slashAt(c.x+rnd(-c.w*.2,c.w*.2), c.y+rnd(-c.w*.2,c.w*.1)); hitEnemy();
  burst(c.x+rnd(-20,20),c.y+rnd(-20,10),crit?14:6,crit?['#FFB347','#FFE08A','#fff']:['#fff','#FFC2D8'],crit?5:3);
  floatText(x+rnd(-14,14), y-24, fmt(d)+(crit?'!':''), crit?'crit':'');
  if(crit){ shake(); Snd.crit(); Native.haptic('soft'); } else { Snd.tap(); Native.haptic('light'); }
  if(S.tut===0 && S.stats.taps>=3){ S.tut=1; $('tapHint').style.display='none'; }
  dealDamage(d);
});

const SKILLS=[
 {k:'rage', name:'全力', unlock:10, ic:ICON.sword, dur:30, cd:300, desc:'30秒間 ダメージ3倍'},
 {k:'rain', name:'金の雨', unlock:20, ic:ICON.rain, dur:20, cd:480, desc:'20秒間 コイン3倍'},
 {k:'bolt', name:'星の矢', unlock:35, ic:ICON.bolt, dur:0, cd:180, desc:'毎秒ダメージ×60を一撃'},
];
function buildSkills(){
  const html=SKILLS.filter(s=>S.maxStage>=s.unlock).map(s=>`<button class="skill press" data-k="${s.k}">${s.ic}<span>${s.name}</span><div class="cd" id="cd-${s.k}"></div><div class="cdt" id="cdt-${s.k}"></div></button>`).join('');
  if($('skills').dataset.h!==html){ $('skills').innerHTML=html; $('skills').dataset.h=html; }
}
$('skills').addEventListener('pointerdown',e=>{ e.stopPropagation(); });
$('skills').addEventListener('click',e=>{
  const b=e.target.closest('.skill'); if(!b) return; const sk=SKILLS.find(s=>s.k===b.dataset.k); const t=now();
  if(t<S.skill[sk.k+'Ready']){ toast(`あと ${fmtTime((S.skill[sk.k+'Ready']-t)/1000)} で使えます`); return; }
  S.skill[sk.k+'Ready']=t+sk.cd*1000; if(sk.dur) S.skill[sk.k+'End']=t+sk.dur*1000;
  Native.haptic('success'); Snd.milestone(); banner(sk.name+'！');
  if(sk.k==='bolt' && enemy){ const c=enemyCenter(); const d=totalDps()*60; burst(c.x,c.y,30,['#9FD3FF','#fff','#C9B2FF'],7,true); shake(); floatText(c.x,c.y-30,fmt(d)+'!','crit'); dealDamage(d); }
  save();
});
function updateSkills(){
  const t=now();
  for(const sk of SKILLS){ const cd=$('cd-'+sk.k); if(!cd) continue; const ready=S.skill[sk.k+'Ready'], end=S.skill[sk.k+'End']||0;
    const btn=cd.parentElement; const active=t<end; btn.classList.toggle('active',active);
    const left=Math.max(0,ready-t); cd.style.height=(left>0? (left/(sk.cd*1000))*100:0)+'%';
    $('cdt-'+sk.k).textContent= active? Math.ceil((end-t)/1000)+'s' : left>0? (left>60000? Math.ceil(left/60000)+'分': Math.ceil(left/1000)+'s') : ''; }
  const tags=[]; if(t<S.skill.rageEnd) tags.push('ダメージ×3'); if(t<S.skill.rainEnd) tags.push('コイン×3');
  const bt=$('boostTag'); bt.style.display=tags.length?'inline':'none'; bt.textContent=tags.join(' ');
}

  if(t.dataset.hero!==undefined && t.dataset.hero!=='' && !t.dataset.buy) return heroModal(+t.dataset.hero);
  if(t.dataset.buy!==undefined){
    if(t.dataset.buy==='lead'){ const q=buyN('lead'); if(S.gold<q.c) return nope(t); S.gold-=q.c; S.lead+=q.n; Snd.buy(); Native.haptic('light'); pressFx(t); refreshList(); return; }
    const i=+t.dataset.buy, st=S.heroes[i];
    if(!st.lv){ const c=heroCost(i,0); if(S.gold<c) return nope(t); S.gold-=c; st.lv=1; S.daily.p.lvup++; S.stats.lvups++; Snd.milestone(); Native.haptic('success'); buildParty(); renderList(); welcome(i); if(S.tut===1) S.tut=2; checkAch(); save(); return; }
    const q=buyN('hero',i); if(S.gold<q.c) return nope(t);
    const before=st.lv; S.gold-=q.c; st.lv+=q.n; S.daily.p.lvup+=q.n; S.stats.lvups+=q.n;
    if(nextMilestone(before)<=st.lv){ Snd.milestone(); Native.haptic('success'); toast(`${HEROES[i].name}のちからが大きく上がった！`); sparkleRow(i); } else { Snd.buy(); Native.haptic('light'); }
    pressFx(t); buildParty(); refreshList(); return; }
  if(t.dataset.perm){ const p=PERMS.find(x=>x.key===t.dataset.perm), lv=S.perm[p.key]; if(lv>=p.max) return; if(S.gems<p.cost(lv)) return nope(t,'星のかけらが足りません');
    S.gems-=p.cost(lv); S.perm[p.key]++; Snd.milestone(); Native.haptic('success'); pressFx(t); refreshList(); save(); return; }
  if(t.dataset.daily){ const k=t.dataset.daily;
    if(k==='bonus'){ if(S.daily.bonus || !DAILY.every(d=>S.daily.got[d.k])) return nope(t); S.daily.bonus=true; gainGems(10,t); }
    else { const d=DAILY.find(x=>x.k===k); if(S.daily.got[k]||S.daily.p[k]<d.goal) return nope(t); S.daily.got[k]=1; gainGems(d.gem,t); }
    refreshList(); save(); return; }
  if(t.dataset.ach){ const a=ACH.find(x=>x.k===t.dataset.ach); if(S.ach[a.k]||!a.chk()) return nope(t); S.ach[a.k]=1; gainGems(a.gem,t); refreshList(); save(); return; }
});
function nope(el,msg){ el.animate([{transform:'translateX(0)'},{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:200}); Native.haptic('light'); if(msg) toast(msg); }
function pressFx(el){ const r=el.getBoundingClientRect(); for(let i=0;i<6;i++){ const s=document.createElement('div'); s.className='coinFly'; s.style.width='10px'; s.style.height='10px';
  s.innerHTML='<svg viewBox="0 0 10 10"><path d="M5,0 L6.3,3.7 L10,5 L6.3,6.3 L5,10 L3.7,6.3 L0,5 L3.7,3.7 Z" fill="#FFD45E"/></svg>'; document.body.appendChild(s);
  const a=Math.random()*6.28, d=rnd(20,40); s.animate([{transform:`translate(${r.left+r.width/2}px,${r.top+r.height/2}px) scale(1)`,opacity:1},{transform:`translate(${r.left+r.width/2+Math.cos(a)*d}px,${r.top+r.height/2+Math.sin(a)*d}px) scale(.2)`,opacity:0}],{duration:450,easing:'ease-out'}).onfinish=()=>s.remove(); } }
function sparkleRow(i){ const r=$('row-'+i); if(!r) return; r.animate([{boxShadow:'0 0 0 0 #FFE08A'},{boxShadow:'0 0 0 6px #FFE08A'},{boxShadow:'0 2px 0 #F3DCE8'}],{duration:600}); }
function gainGems(n,el){ S.gems+=n; Snd.win(); Native.haptic('success'); if(el) pressFx(el); $('gemPill').classList.remove('bump'); void $('gemPill').offsetWidth; $('gemPill').classList.add('bump'); }

/* =====================================================================
   モーダル
   ===================================================================== */
let modalCb=null;
function modal(html,cb){ $('mbox').innerHTML=html; $('modal').classList.add('show'); modalCb=cb||null; }
function closeModal(){ $('modal').classList.remove('show'); const cb=modalCb; modalCb=null; if(cb) cb(); }
$('modal').addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(b){ Snd.init(); const a=b.dataset.act; if(a==='close') closeModal(); else if(modalActs[a]) modalActs[a](b); } });
const modalActs={};
function toast(html){ const t=$('toast'); t.innerHTML=html.replace(/<svg viewBox/g,'<svg width="16" height="16" viewBox'); t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),2200); }

function welcome(i){ const H=HEROES[i];
  const lines=['よろしくね！いっしょに空の果てまで行こう！','ぼくの魔法、見ててね。','狙った獲物は外さないよ！','このカイが みんなを守る！','けがしたら すぐ言ってね。','……影から支える。','旅には歌が必要でしょ？','星が きみを選んだみたいだ。','モモもいっしょに行くー！','槍のさばき、見せてあげる。','おもしろい発明、できたよ！','月の光が みちびいてくれます。'];
  modal(`<div class="ray"><div style="width:120px;height:120px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 4px #fff,0 0 0 7px var(--pink2)">${heroPic(i)}</div></div>
   <h2>${H.name}が仲間になった！</h2><div class="note">${H.role}</div><div class="card" style="margin:12px 0 0;background:var(--pink3);box-shadow:none;font-weight:700">「${lines[i]}」</div>
   <div class="mbtns"><button class="buy" data-act="close">よろしく！</button></div>`);
}
function heroModal(i){
  const H=HEROES[i], st=S.heroes[i]; if(!st.lv) return;
  const c=AWAKEN_COST(st.star), can=st.star<5;
  modal(`<div style="width:150px;height:150px;margin:0 auto 8px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 4px #fff,0 0 0 7px var(--lav2)">${heroPic(i)}</div>
   <h2>${H.name} <span class="stars" style="font-size:16px">${'★'.repeat(st.star)}${'☆'.repeat(5-st.star)}</span></h2>
   <div class="note">${H.role}　Lv.${st.lv}　毎秒 ${fmt(heroDps(i))}</div>
   <div class="card" style="margin:12px 0 0;background:var(--lav2);box-shadow:none"><div style="font-weight:800">覚醒</div><div class="note">★1つにつき ${H.name}のダメージ ×2。おやすみしても消えません。</div></div>
   <div class="mbtns"><button class="buy no" data-act="close" style="min-width:90px">とじる</button>
   ${can?`<button class="buy lav" data-act="awaken" data-i="${i}">覚醒する<small>${ICON.gem.replace('viewBox','width="11" height="11" viewBox')} ${c}</small></button>`:'<button class="buy no">最大まで覚醒</button>'}</div>`);
}
modalActs.awaken=b=>{ const i=+b.dataset.i, st=S.heroes[i], c=AWAKEN_COST(st.star); if(S.gems<c){ nope(b,'星のかけらが足りません'); return; }
  S.gems-=c; st.star++; Snd.win(); Native.haptic('success'); pressFx(b); save(); heroModal(i); refreshList(); checkAch(); };

function askRest(){ const gain=feathersFor(S.maxStage);
  if(gain<=0){ toast('ステージ40まで進むと おやすみできます'); return; }
  modal(`<div class="ray" style="width:90px;height:90px">${ICON.feather.replace('viewBox','width="90" height="90" viewBox')}</div><h2>おやすみしますか？</h2>
   <div class="note">そらの羽を <b style="font-size:18px;color:#4E8FD9">+${fmt(gain)}</b> 枚もらえます。<br>（ダメージ +${fmt(gain*10)}%）<br>ステージ・コイン・仲間のレベルは最初に戻ります。</div>
   <div class="mbtns"><button class="buy no" data-act="close" style="min-width:90px">やめる</button><button class="buy lav" data-act="doRest">おやすみ</button></div>`); }
modalActs.doRest=()=>{ const gain=feathersFor(S.maxStage); if(gain<=0) return;
  S.feathers+=gain; S.feathersTotal+=gain; S.stats.prestige++;
  S.gold=0; S.stage=1; S.maxStage=1; S.kills=0; S.farm=false; S.lead=1; S.heroes.forEach(h=>h.lv=0);
  S.skill.rageEnd=S.skill.rainEnd=0;
  closeModal(); save(); partyIdx=[]; buildParty(); buildSkills(); stageInfo(); enemy=null; spawnEnemy(); setTab('party'); banner('おはよう！'); Snd.win(); Native.haptic('success'); checkAch(); };

/* ---------- 設定 ---------- */
$('setBtn').addEventListener('click',()=>{ Snd.init(); settings(); });
function settings(){ modal(`<h2>せってい</h2>
  <div class="row" style="box-shadow:none;background:var(--pink3)"><div class="info"><div class="nm">効果音</div></div><button class="toggle ${S.set.sound?'on':''}" data-act="tgSound"></button></div>
  <div class="row" style="box-shadow:none;background:var(--pink3)"><div class="info"><div class="nm">振動</div></div><button class="toggle ${S.set.haptic?'on':''}" data-act="tgHaptic"></button></div>
  <div class="note" style="text-align:left;margin-top:6px">あそんだ時間 ${fmtTime(S.stats.playSec)}<br>たおしたまもの ${S.stats.kills.toLocaleString()}体<br>タップ ${S.stats.taps.toLocaleString()}回<br>おやすみ ${S.stats.prestige}回</div>
  <div class="mbtns"><button class="buy" data-act="close">とじる</button></div>`); }
modalActs.tgSound=b=>{ S.set.sound=!S.set.sound; b.classList.toggle('on',S.set.sound); save(); };
modalActs.tgHaptic=b=>{ S.set.haptic=!S.set.haptic; b.classList.toggle('on',S.set.haptic); save(); };

/* =====================================================================
   おかえり報酬・ログイン
   ===================================================================== */
const LOGIN_GEMS=[10,10,20,10,10,20,50];
function dayRollover(){
  const d=todayStr();
  if(S.daily.day!==d){ S.daily={day:d,p:{tap:0,kill:0,lvup:0,boss:0},got:{},bonus:false}; }
}
function checkLogin(after){
  const d=todayStr(); if(S.login.last===d || $('modal').classList.contains('show')){ after&&after(); return; }
  const y=todayStr(Date.now()-86400000);
  S.login.streak = S.login.last===y ? S.login.streak+1 : 1; S.login.last=d;
  const idx=(S.login.streak-1)%7, g=LOGIN_GEMS[idx];
  modal(`<h2>ログインボーナス</h2><div class="note">連続 ${S.login.streak} 日目</div>
   <div class="loginRow">${LOGIN_GEMS.map((v,i)=>`<div class="${i<idx?'done':i===idx?'today':''}">${i+1}日<br>${v}</div>`).join('')}</div>
   <div class="ray" style="width:80px;height:80px;margin-top:14px">${ICON.gem.replace('viewBox','width="80" height="80" viewBox')}</div>
   <div class="big">+${g}</div>
   <div class="mbtns"><button class="buy mint" data-act="close">受け取る</button></div>`, ()=>{ gainGems(g); save(); after&&after(); });
}
function offlineReward(){
  const away=(Date.now()-S.savedAt)/1000;
  if(away<60 || S.heroes.every(h=>!h.lv)) return null;
  const sec=Math.min(away,offlineCapSec());
  const gold=Math.floor(goldPerSec()*sec*offlineRate());
  if(gold<=0) return null;
  // 留守中のちょっとしたおみやげ（毎回ちがう）
  const gifts=[];
  if(away>=3600 && Math.random()<0.5) gifts.push({t:'gem',n:Math.min(5,1+Math.floor(away/7200))});
  return {away,sec,gold,gifts};
}
function showWelcomeBack(r,after){
  const lead=partyIdx.length? partyIdx[partyIdx.length-1] : 0;
  const capped = r.away>r.sec;
  const said=['おかえり！ みんなで がんばったよ！','おかえりなさい。宝箱、いっぱいです。','おかえり！ 待ってたよ！'][Math.floor(Math.random()*3)];
  const giftHtml=r.gifts.map(g=>`<div class="note" style="margin-top:6px">おみやげ：${ICON.gem.replace('viewBox','width="14" height="14" style="vertical-align:-2px" viewBox')} 星のかけら ×${g.n}</div>`).join('');
  modal(`<div class="ray"><div style="width:120px;height:120px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 4px #fff,0 0 0 7px var(--pink2)">${heroPic(lead)}</div></div>
    <h2>${said}</h2>
    <div class="note">${fmtTime(r.away)} のあいだに</div>
    <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0">${ICON.coin.replace('viewBox','width="34" height="34" viewBox')}<span class="big" style="font-size:28px">+${fmt(r.gold)}</span></div>
    ${capped?`<div class="note" style="color:#E0558A">宝箱がいっぱいでした（最大 ${fmtTime(offlineCapSec())}）</div>`:''}${giftHtml}
    <div class="mbtns"><button class="buy" data-act="close">受け取る</button><button class="buy lav" data-act="double">2倍にする<small>${ICON.gem.replace('viewBox','width="11" height="11" viewBox')} 10</small></button></div>`,
    ()=>{ S.gold+=r.gold*(r.doubled?2:1); S.stats.gold+=r.gold; r.gifts.forEach(g=>{ if(g.t==='gem') S.gems+=g.n; }); const c=enemyCenter(); flyCoins(c.x,c.y,10); Native.haptic('success'); save(); after&&after(); });
  modalActs.double=b=>{ if(S.gems<10){ nope(b,'星のかけらが足りません'); return; } S.gems-=10; r.doubled=true; closeModal(); };
}

/* =====================================================================
   実績・バッジ
   ===================================================================== */
function checkAch(){ /* バッジだけ更新（受け取りは手動） */ }
function updateDots(){
  const affordable = (()=>{ for(let i=0;i<HEROES.length;i++){ const st=S.heroes[i]; if(!st.lv){ if(i===0||S.heroes[i-1].lv) return S.gold>=heroCost(i,0); return false; } } return false; })();
  $('dot-party').style.display = affordable?'block':'none';
  const mis = DAILY.some(d=>!S.daily.got[d.k]&&S.daily.p[d.k]>=d.goal) || (!S.daily.bonus&&DAILY.every(d=>S.daily.got[d.k])) || ACH.some(a=>!S.ach[a.k]&&a.chk());
  $('dot-mission').style.display = mis?'block':'none';
  $('dot-up').style.display = PERMS.some(p=>S.perm[p.key]<p.max&&S.gems>=p.cost(S.perm[p.key])) ? 'block':'none';
  $('dot-rest').style.display = feathersFor(S.maxStage)>=Math.max(5,S.feathers*0.5) ? 'block':'none';
}

/* =====================================================================
   メインループ
   ===================================================================== */
let last=performance.now(), acc10=0, accSave=0, dispGold=S.gold, dispGems=S.gems;
function frame(t){
  let dt=Math.min(0.1,(t-last)/1000); last=t;
  dayRollover();
  if(enemy && enemy.hp>0 && t>spawnLock){
    // 仲間それぞれが自分のペースで攻撃
    const rm=rageMult();
    for(let i=0;i<HEROES.length;i++){ if(!S.heroes[i].lv) continue; heroTimers[i]-=dt;
      if(heroTimers[i]<=0){ const iv=1+(i%4)*0.12; heroTimers[i]+=iv; const d=heroDps(i)*rm*iv;
        const el=$('ph'+i);
        if(el){ const f=el.firstElementChild; if(!f._busy){ f._busy=true; f.animate([{transform:'translate(0,0) rotate(0) scale(1)'},{transform:'translate(4px,-12px) rotate(-5deg) scale(1.06)',offset:.4},{transform:'translate(0,0) rotate(0) scale(1)'}],{duration:420,easing:'cubic-bezier(.33,0,.25,1)'}).onfinish=()=>{f._busy=false;}; }
          const c=enemyCenter(); const br=$('battle').getBoundingClientRect(), hr=el.getBoundingClientRect();
          burst(c.x+rnd(-15,15),c.y+rnd(-15,15),4,[HEROES[i].hair,'#fff'],3); floatText(c.x+rnd(-c.w*.45,c.w*.45), c.y-c.w*.05+rnd(-c.w*.25,c.w*.15), fmt(d),'sm');
          if(Math.random()<0.5) hitEnemy(); }
        if(dealDamage(d)) break; } }
    if(bossLeft>0){ bossLeft-=dt; $('bossTimer').firstElementChild.style.width=clamp(bossLeft/bossTime()*100,0,100)+'%'; if(bossLeft<=0 && enemy && enemy.hp>0) bossFail(); }
  }
  stepFx();
  // 数字はなめらかに
  dispGold += (S.gold-dispGold)*Math.min(1,dt*10); if(Math.abs(S.gold-dispGold)<1) dispGold=S.gold;
  dispGems += (S.gems-dispGems)*Math.min(1,dt*10); if(Math.abs(S.gems-dispGems)<.5) dispGems=S.gems;
  $('goldTxt').textContent=fmt(dispGold); $('gemTxt').textContent=fmt(Math.round(dispGems)); $('featherTxt').textContent=fmt(S.feathers);
  acc10+=dt; accSave+=dt; S.stats.playSec+=dt;
  if(acc10>0.15){ acc10=0; $('dpsTxt').textContent=fmt(totalDps()); $('tapTxt').textContent=fmt(tapDmg()); refreshList(); updateSkills(); updateDots();
    if(S.tut===1 && S.gold>=10 && tab==='party'){ toast('コインが貯まった！「雇う」で仲間をむかえよう'); S.tut=1.5; } }
  if(accSave>10){ accSave=0; save(); }
  requestAnimationFrame(frame);
}

/* ---------- アプリの表示・非表示 ---------- */
function scheduleNotices(){
  const cap=offlineCapSec(); const items=[];
  if(S.heroes.some(h=>h.lv)) items.push({id:'full',after:cap,title:'そらいろ冒険隊',body:'宝箱がいっぱいになったよ！ コインを受け取りに来てね'});
  const n=new Date(); const t=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1,19,30); items.push({id:'daily',after:Math.floor((t-n)/1000),title:'そらいろ冒険隊',body:'今日のミッションとログインボーナスが待ってるよ'});
  Native.send({type:'schedule',items});
}
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ hiddenAt=Date.now(); save(); scheduleNotices(); }
  else { Native.send({type:'clearNotify'}); dayRollover(); const r=offlineReward(); last=performance.now(); if(r && !$('modal').classList.contains('show')) showWelcomeBack(r,()=>checkLogin()); else checkLogin(); }
});
window.addEventListener('pagehide',save);

/* ---------- はじまり ---------- */
function start(){
  resizeFx(); dayRollover(); buildParty(); buildSkills(); stageInfo(); spawnEnemy(); setTab('party');
  if(S.tut===0){ $('tapHint').style.display='block'; }
  const r=offlineReward();
  const first = S.stats.taps===0 && S.heroes.every(h=>!h.lv) && S.stats.prestige===0;
  const after=()=>checkLogin();
  if(first){
    modal(`<div class="ray"><div style="width:120px;height:120px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 4px #fff,0 0 0 7px var(--pink2)">${heroPic(0)}</div></div>
      <h2>そらいろ冒険隊へようこそ！</h2><div class="note">まものをタップしてコインを集め、仲間を雇おう。<br>仲間はアプリを閉じていても戦ってくれます。<br>空の果てを目指して、のんびり冒険しよう！</div>
      <div class="mbtns"><button class="buy" data-act="close">はじめる</button></div>`, after);
  } else if(r) showWelcomeBack(r,after); else after();
  requestAnimationFrame(t=>{ last=t; requestAnimationFrame(frame); });
}
start();
</script>
</body>
</html>

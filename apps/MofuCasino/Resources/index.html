<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>もふもふカジノ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- タイトル（カジノのロビー） -->
  <section class="screen" id="scr-title">
    <div class="lobby">
      <div class="lobby-stars"></div>
      <div class="lobby-top">
        <div id="titleCoin"></div>
        <div class="lobby-icons">
          <button class="icon-btn" data-go="profile" aria-label="キャラ・記録">🐾</button>
          <button class="icon-btn" id="sndBtn" aria-label="音">🔊</button>
        </div>
      </div>
      <div class="marquee">
        <div class="bulbs"></div>
        <div class="mq-sub">MOFU MOFU</div>
        <div class="mq-main">もふもふカジノ</div>
        <div class="mq-suits"><span>♠</span><span class="r">♥</span><span class="r">♦</span><span>♣</span></div>
      </div>
      <div class="stage" id="stage"></div>
      <div class="hot-head"><span>🔥 人気のゲーム</span><small>タップですぐ遊べる</small></div>
      <div class="hot-row" id="hotRow"></div>
      <div class="menu-grid">
        <button class="mbtn m-solo" data-go="solo"><span class="ico">🎰</span><b>ひとりでマシン</b><small id="cntSolo">スロットなど</small></button>
        <button class="mbtn m-cpu" data-go="cpu"><span class="ico">🤖</span><b>CPUとカジノ</b><small id="cntCpu">カジノゲーム</small></button>
        <button class="mbtn m-local" data-go="local"><span class="ico">👨‍👩‍👧</span><b>みんなで（1台で）</b><small>スマホを回して2〜5人で</small></button>
        <button class="mbtn m-online" data-go="online"><span class="ico">📡</span><b>オンライン対戦</b><small>招待コードで友だち・恋人と</small></button>
      </div>
      <p class="free-note">コイン・チップはすべて遊び用です（お金の価値はありません）</p>
    </div>
  </section>

  <!-- ゲーム選択 -->
  <section class="screen" id="scr-list">
    <header class="bar"><button class="back" data-back>‹</button><h2 id="listTitle">ゲームを選ぶ</h2><span></span></header>
    <div class="scroll"><div class="game-list" id="gameList"></div></div>
  </section>

  <!-- 設定 -->
  <section class="screen" id="scr-setup">
    <header class="bar"><button class="back" data-back>‹</button><h2 id="setupTitle"></h2><button class="qbtn" id="setupRules">？</button></header>
    <div class="scroll"><div class="setup" id="setupBody"></div></div>
  </section>

  <!-- オンライン -->
  <section class="screen" id="scr-online">
    <header class="bar"><button class="back" data-back>‹</button><h2>オンライン対戦</h2><span></span></header>
    <div class="scroll"><div class="online" id="onlineBody"></div></div>
  </section>

  <!-- プロフィール -->
  <section class="screen" id="scr-profile">
    <header class="bar"><button class="back" data-back>‹</button><h2>キャラ・記録</h2><span></span></header>
    <div class="scroll"><div class="profile" id="profileBody"></div></div>
  </section>

  <!-- ゲーム画面 -->
  <section class="screen" id="scr-game">
    <header class="bar gamebar"><button class="back" id="gameBack">‹</button><h2 id="gameTitle"></h2><button class="qbtn" id="gameRules">？</button></header>
    <div class="game-area" id="gameArea"></div>
  </section>
</div>

<div id="modal" class="modal hidden"><div class="modal-card" id="modalCard"></div></div>
<div id="toast" class="toast"></div>
<div id="fx" class="fx"></div>

<script src="core.js"></script>
<script src="kit.js"></script>
<script src="cards.js"></script>
<script src="casino.js"></script>
<script src="games_cards.js"></script>
<script src="games_dice.js"></script>
<script src="games_social.js"></script>
<script src="solo.js"></script>
<script src="table.js"></script>
<script src="net.js"></script>
<script src="app.js"></script>
</body>
</html>

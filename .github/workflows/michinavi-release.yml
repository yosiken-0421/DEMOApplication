name: ミチナビ iOS / TestFlight

# GitHub の「Actions」→「ミチナビ iOS / TestFlight」→「Run workflow」で実行します。
#   testflight : ビルドして App Store Connect（TestFlight）へアップロード
#   build_only : ビルドと署名付き IPA の作成まで（アップロードしない）
# apps/MichiNavi を変更して main に push したときは、自動で testflight を実行します。
on:
  push:
    branches:
      - main
    paths:
      - "apps/MichiNavi/**"
      - ".github/workflows/michinavi-release.yml"
  workflow_dispatch:
    inputs:
      release_mode:
        description: "testflight = TestFlight へアップロード / build_only = ビルドだけ"
        type: choice
        options:
          - testflight
          - build_only
        default: testflight
      version:
        description: "表示バージョン（例 1.0.1）。空なら 1.0.0"
        required: false
        type: string
      build_number:
        description: "ビルド番号（数字）。空なら自動で増やす"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: michinavi-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      RELEASE_MODE: ${{ inputs.release_mode || 'testflight' }}
      BUNDLE_ID: com.yosiken0421.michinavi
      DD: ${{ github.workspace }}/../michinavi-dd

    steps:
      - uses: actions/checkout@v4

      - name: Xcode を選ぶ（Xcode 26 以降）
        id: xcode
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error::Xcode 26 以降が見つかりません"; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: バージョンとビルド番号を決める
        id: version
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_BUILD: ${{ inputs.build_number }}
        run: |
          VERSION="${IN_VERSION:-1.0.0}"
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then echo "::error::version は 0.4.0 のような数字で入力してください"; exit 1; fi
          BUILD=$((GITHUB_RUN_NUMBER + 1000))
          if [ -n "$IN_BUILD" ]; then
            if ! [[ "$IN_BUILD" =~ ^[0-9]{1,9}$ ]]; then echo "::error::build_number は数字で入力してください"; exit 1; fi
            BUILD="$IN_BUILD"
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "バージョン $VERSION（ビルド $BUILD）"

      - name: テスト（ルート計算・案内文・地図データの読み取り）
        id: test
        working-directory: apps/MichiNavi
        run: |
          swiftc -O -o "$RUNNER_TEMP/michi-tests" ios-native/MichiNavi/NaviCore.swift ios-native/MichiNavi/TrafficCore.swift tests/main.swift
          "$RUNNER_TEMP/michi-tests"

      - name: 外部データの確認（参考：JARTIC と OpenStreetMap に届くか）
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          UA = {"User-Agent": "Mozilla/5.0 (iPhone)", "Referer": "https://www.jartic.or.jp/map/"}
          t = json.loads(urllib.request.urlopen(urllib.request.Request("https://www.jartic.or.jp/d/traffic_info/r1/target.json", headers=UA), timeout=20).read())["target"]
          print("JARTIC 更新時刻:", t)
          q = '[out:json][timeout:25];(node(around:300,35.681236,139.767125)["highway"="stop"];node(around:3000,35.681236,139.767125)["railway"="level_crossing"];);out;'
          req = urllib.request.Request("https://overpass-api.de/api/interpreter", data=urllib.parse.urlencode({"data": q}).encode(),
                                       headers={"User-Agent": "MichiNavi-CI/1.0"})
          j = json.loads(urllib.request.urlopen(req, timeout=40).read())
          print("OpenStreetMap（東京駅付近）の注意地点:", len(j.get("elements", [])), "件")
          PY

      - name: Xcode プロジェクトを生成（アイコン生成を含む）
        id: generate
        working-directory: apps/MichiNavi/ios-native
        run: |
          brew install xcodegen
          bash scripts/prepare-mac.sh

      - name: シミュレーター用ビルド（コードの確認）
        id: build
        run: |
          .github/scripts/run-logged.sh mn-build xcodebuild build \
            -project apps/MichiNavi/ios-native/MichiNavi.xcodeproj -scheme MichiNavi \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DD-sim" CODE_SIGNING_ALLOWED=NO

      - name: 署名の準備（App Store Connect API キー）
        id: signing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do [ -z "${!v}" ] && missing="$missing $v"; done
          if [ -n "$missing" ]; then
            echo "::error::Repository secrets に次が登録されていません:$missing（Settings → Secrets and variables → Actions）"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          chmod 700 "$RUNNER_TEMP/keys"
          python3 - <<'PY'
          import os, re, base64, sys
          raw = os.environ["ASC_KEY_P8"]
          body = re.sub(r"-----(BEGIN|END)[^-]*-----", "", raw)
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          try:
              der = base64.b64decode(body + "=" * (-len(body) % 4))
          except Exception:
              der = b""
          if len(der) < 100:
              print("::error::ASC_KEY_P8 の中身が正しくありません。.p8 ファイルの中身を全部貼り直してください")
              sys.exit(1)
          b64 = base64.b64encode(der).decode()
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(b64[i:i+64] for i in range(0, len(b64), 64)) + "\n-----END PRIVATE KEY-----\n"
          path = os.path.join(os.environ["RUNNER_TEMP"], "keys", "AuthKey.p8")
          with open(path, "w") as f:
              f.write(pem)
          os.chmod(path, 0o600)
          PY
          {
            echo "KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')"
            echo "ISSUER_ID=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')"
            echo "TEAM_ID=$(printf '%s' "$APPLE_TEAM_ID" | tr -d '[:space:]')"
          } >> "$GITHUB_ENV"
          echo "署名の準備ができました"

      - name: Bundle ID の登録（まだなら）
        id: bundle
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/keys/AuthKey.p8
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet pyjwt cryptography requests
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import json, os, sys, time
          import jwt, requests
          now = int(time.time())
          token = jwt.encode({"iss": os.environ["ISSUER_ID"], "iat": now, "exp": now + 900, "aud": "appstoreconnect-v1"},
                             open(os.environ["ASC_KEY_PATH"]).read(), algorithm="ES256",
                             headers={"kid": os.environ["KEY_ID"], "typ": "JWT"})
          h = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
          base = "https://api.appstoreconnect.apple.com/v1"
          bid = os.environ["BUNDLE_ID"]
          r = requests.get(f"{base}/bundleIds", params={"filter[identifier]": bid, "limit": "10"}, headers=h, timeout=30)
          if r.status_code != 200:
              print(f"::error::Bundle ID の確認に失敗しました（HTTP {r.status_code}）"); print(r.text[:1500]); sys.exit(1)
          if any(d.get("attributes", {}).get("identifier") == bid for d in r.json().get("data", [])):
              print(f"Bundle ID は登録済みです: {bid}")
          else:
              p = {"data": {"type": "bundleIds", "attributes": {"name": "MichiNavi", "identifier": bid, "platform": "IOS"}}}
              r = requests.post(f"{base}/bundleIds", headers=h, data=json.dumps(p), timeout=30)
              if r.status_code != 201:
                  print(f"::error::Bundle ID の登録に失敗しました（HTTP {r.status_code}）"); print(r.text[:1500]); sys.exit(1)
              print(f"Bundle ID を登録しました: {bid}")
          r = requests.get(f"{base}/apps", params={"filter[bundleId]": bid, "limit": "5"}, headers=h, timeout=30)
          has_app = r.status_code == 200 and len(r.json().get("data", [])) > 0
          print("App Store Connect のアプリ: " + ("あり" if has_app else "まだありません"))
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"HAS_APP={'yes' if has_app else 'no'}\n")
          if not has_app and os.environ.get("RELEASE_MODE") == "testflight":
              print("::warning::App Store Connect にこの Bundle ID のアプリがまだありません。アップロード前に「新規App」で作成してください（Bundle ID: " + bid + "）")
          PY

      - name: 自動作成された開発用証明書の整理（証明書の上限エラーを防ぐ）
        id: certcleanup
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/keys/AuthKey.p8
        run: python3 .github/scripts/asc_cleanup_dev_certs.py

      - name: Release Archive
        id: archive
        run: |
          .github/scripts/run-logged.sh mn-archive xcodebuild archive \
            -project apps/MichiNavi/ios-native/MichiNavi.xcodeproj -scheme MichiNavi \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MichiNavi.xcarchive" -derivedDataPath "$DD-device" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$APP_BUILD"
          APP="$RUNNER_TEMP/MichiNavi.xcarchive/Products/Applications/MichiNavi.app"
          V=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Info.plist")
          B=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$APP/Info.plist")
          BID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          echo "Archive: $BID $V ($B)"
          /usr/libexec/PlistBuddy -c "Print UIBackgroundModes" "$APP/Info.plist" || echo "::warning::バックグラウンド（音声・位置）の設定がありません"
          test -d "$APP/Metadata.appintents" || echo "::warning::Siri 用の情報（Metadata.appintents）が見つかりません"
          if [ "$V" != "$APP_VERSION" ] || [ "$B" != "$APP_BUILD" ] || [ "$BID" != "$BUNDLE_ID" ]; then
            echo "::error::バージョン/ビルド番号/Bundle ID が想定と違います: $BID $V ($B)"; exit 1
          fi

      - name: IPA 書き出し
        id: export
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<EOF2
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF2
          .github/scripts/run-logged.sh mn-export xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/MichiNavi.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/ipa" -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
          IPA=$(ls "$RUNNER_TEMP"/ipa/*.ipa | head -1)
          mkdir -p "$RUNNER_TEMP/out"
          cp "$IPA" "$RUNNER_TEMP/out/MichiNavi-$APP_VERSION-$APP_BUILD.ipa"

      - name: Artifact 保存
        uses: actions/upload-artifact@v4
        with:
          name: MichiNavi-iOS-${{ env.APP_VERSION }}-${{ env.APP_BUILD }}
          path: ${{ runner.temp }}/out/*.ipa
          retention-days: 14

      - name: App Store Connect（TestFlight）へアップロード
        id: upload
        if: env.RELEASE_MODE == 'testflight'
        run: |
          cat > "$RUNNER_TEMP/upload.plist" <<EOF2
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF2
          .github/scripts/run-logged.sh mn-upload xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/MichiNavi.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/upload.plist" -exportPath "$RUNNER_TEMP/upload" -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"

      - name: 一時ファイルの削除
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/export.plist" "$RUNNER_TEMP/upload.plist"

      - name: 結果の要約
        if: always()
        env:
          S_TEST: ${{ steps.test.outcome }}
          S_BUILD: ${{ steps.build.outcome }}
          S_SIGN: ${{ steps.signing.outcome }}
          S_BUNDLE: ${{ steps.bundle.outcome }}
          S_ARCHIVE: ${{ steps.archive.outcome }}
          S_EXPORT: ${{ steps.export.outcome }}
          S_UPLOAD: ${{ steps.upload.outcome }}
        run: |
          m() { case "$1" in success) echo "✅ 成功";; failure) echo "❌ 失敗";; skipped|"") echo "⏭ 実行せず";; cancelled) echo "⛔ 中止";; *) echo "$1";; esac; }
          {
            echo "## ミチナビ iOS ビルド結果"
            echo ""
            echo "| 項目 | 結果 |"
            echo "|---|---|"
            echo "| モード | ${RELEASE_MODE} |"
            echo "| バージョン | ${APP_VERSION:-?}（ビルド ${APP_BUILD:-?}） |"
            echo "| テスト | $(m "$S_TEST") |"
            echo "| ビルド（コード確認） | $(m "$S_BUILD") |"
            echo "| 署名の準備 | $(m "$S_SIGN") |"
            echo "| Bundle ID | $(m "$S_BUNDLE") |"
            echo "| Release Archive | $(m "$S_ARCHIVE") |"
            echo "| IPA 書き出し | $(m "$S_EXPORT") |"
            echo "| TestFlight へアップロード | $(m "$S_UPLOAD") |"
            echo ""
            if [ "$S_UPLOAD" = "success" ]; then
              echo "アップロードしました。App Store Connect での処理に 10〜30 分ほどかかります。終わると TestFlight に表示されます。"
            fi
            if [ "$S_UPLOAD" = "failure" ] && [ "${HAS_APP:-}" = "no" ]; then
              echo "**App Store Connect にアプリがまだありません。** 「マイApp」→「＋」→「新規App」で、Bundle ID に com.yosiken0421.michinavi を選んで作成し、もう一度 Run workflow を押してください。"
            fi
            if [ "$S_SIGN" = "failure" ]; then
              echo "Settings → Secrets and variables → Actions に ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8 / APPLE_TEAM_ID が登録されているか確認してください。"
            fi
            if [ "$S_ARCHIVE" = "failure" ] || [ "$S_UPLOAD" = "failure" ]; then
              echo "Apple 側の設定で止まった可能性があります。上の赤いエラーの内容を確認してください（契約への同意、Bundle ID、API キーの権限が Admin か など）。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

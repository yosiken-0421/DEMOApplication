name: まちかね iOS / TestFlight

# GitHub の「Actions」→「まちかね iOS / TestFlight」→「Run workflow」で実行します。
#   testflight : ビルドして App Store Connect（TestFlight）へアップロード
#   build_only : ビルド・テスト・署名付き IPA の作成まで（アップロードしない）
# apps/machikane を変更して main に push したときは、自動で testflight を実行します。
# machikane/ で始まるブランチに push したときは build_only で確認だけ行います。
on:
  push:
    branches:
      - main
      - "machikane/**"
    paths:
      - "apps/machikane/**"
      - ".github/workflows/machikane-testflight.yml"
  workflow_dispatch:
    inputs:
      release_mode:
        description: "testflight = TestFlight へアップロード / build_only = ビルドだけ"
        type: choice
        options:
          - testflight
          - build_only
        default: testflight
      version:
        description: "表示バージョン（例 1.1）。空なら 1.0"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: machikane-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      RELEASE_MODE: ${{ inputs.release_mode || (github.ref == 'refs/heads/main' && 'testflight' || 'build_only') }}
      BUNDLE_ID: com.yosiken0421.machikane
      WIDGET_BUNDLE_ID: com.yosiken0421.machikane.widget
      APP_GROUP_ID: group.com.yosiken0421.machikane
      DD: ${{ github.workspace }}/../machikane-dd

    steps:
      - uses: actions/checkout@v4

      - name: Xcode を選ぶ（Xcode 26 以降）
        id: xcode
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error::Xcode 26 以降が見つかりません"; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
          echo "XCODE_VERSION=$(xcodebuild -version | head -1)" >> "$GITHUB_ENV"

      - name: バージョンとビルド番号を決める
        id: version
        env:
          IN_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION="${IN_VERSION:-1.0}"
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then echo "::error::version は 1.0 のような数字で入力してください"; exit 1; fi
          BUILD="$RUN_NUMBER"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "バージョン $VERSION（ビルド $BUILD）・モード $RELEASE_MODE"

      - name: ユニットテスト（日付の解釈・カウントダウン・通知の上限・ダブルチェック・API 解析）
        id: unit
        run: |
          .github/scripts/run-logged.sh mk-unit swift test --package-path apps/machikane/MachikaneCore
          N=$(grep -Eo "Executed [0-9]+ tests?, with 0 failures" "$RUNNER_TEMP/mk-unit.log" | tail -1 | grep -Eo "[0-9]+" | head -1)
          echo "UNIT_COUNT=${N:-?}" >> "$GITHUB_ENV"
          echo "::notice title=ユニットテスト::${N:-?} 件すべて成功"

      - name: Xcode プロジェクトを生成
        id: generate
        working-directory: apps/machikane
        run: |
          brew install xcodegen
          xcodegen generate

      - name: シミュレーター用ビルド（ウィジェットを含む）
        id: build
        run: |
          .github/scripts/run-logged.sh mk-build xcodebuild build \
            -project apps/machikane/Machikane.xcodeproj -scheme Machikane \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DD-sim" CODE_SIGNING_ALLOWED=NO
          APPEX=$(find "$DD-sim/Build/Products" -maxdepth 4 -path "*Machikane.app/PlugIns/MachikaneWidget.appex" | head -1)
          if [ -z "$APPEX" ]; then echo "::error::アプリにウィジェット拡張が入っていません"; exit 1; fi
          echo "ウィジェット拡張を確認: ${APPEX#$DD-sim/}"

      - name: 署名の準備（App Store Connect API キー）
        id: signing
        if: env.RELEASE_MODE == 'testflight' || github.ref == 'refs/heads/main'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do [ -z "${!v}" ] && missing="$missing $v"; done
          if [ -n "$missing" ]; then
            echo "::error::Repository secrets に次が登録されていません:$missing（Settings → Secrets and variables → Actions）"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          chmod 700 "$RUNNER_TEMP/keys"
          python3 - <<'PY'
          import os, re, base64, sys
          raw = os.environ["ASC_KEY_P8"]
          body = re.sub(r"-----(BEGIN|END)[^-]*-----", "", raw)
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          try:
              der = base64.b64decode(body + "=" * (-len(body) % 4))
          except Exception:
              der = b""
          if len(der) < 100:
              print("::error::ASC_KEY_P8 の中身が正しくありません。.p8 ファイルの中身を全部貼り直してください")
              sys.exit(1)
          b64 = base64.b64encode(der).decode()
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(b64[i:i+64] for i in range(0, len(b64), 64)) + "\n-----END PRIVATE KEY-----\n"
          path = os.path.join(os.environ["RUNNER_TEMP"], "keys", "AuthKey.p8")
          with open(path, "w") as f:
              f.write(pem)
          os.chmod(path, 0o600)
          PY
          {
            echo "KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')"
            echo "ISSUER_ID=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')"
            echo "TEAM_ID=$(printf '%s' "$APPLE_TEAM_ID" | tr -d '[:space:]')"
          } >> "$GITHUB_ENV"
          echo "署名の準備ができました"

      - name: Bundle ID と App Group の登録（まだなら）
        id: bundle
        if: steps.signing.outcome == 'success'
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/keys/AuthKey.p8
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet pyjwt cryptography requests
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import json, os, sys, time
          import jwt, requests
          now = int(time.time())
          token = jwt.encode({"iss": os.environ["ISSUER_ID"], "iat": now, "exp": now + 900, "aud": "appstoreconnect-v1"},
                             open(os.environ["ASC_KEY_PATH"]).read(), algorithm="ES256",
                             headers={"kid": os.environ["KEY_ID"], "typ": "JWT"})
          h = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
          base = "https://api.appstoreconnect.apple.com/v1"

          def ensure_bundle(identifier, name):
              r = requests.get(f"{base}/bundleIds", params={"filter[identifier]": identifier, "limit": "10"}, headers=h, timeout=30)
              if r.status_code != 200:
                  print(f"::error::Bundle ID の確認に失敗しました（HTTP {r.status_code}）"); print(r.text[:1500]); sys.exit(1)
              for d in r.json().get("data", []):
                  if d.get("attributes", {}).get("identifier") == identifier:
                      print(f"Bundle ID は登録済みです: {identifier}")
                      return d["id"]
              p = {"data": {"type": "bundleIds", "attributes": {"name": name, "identifier": identifier, "platform": "IOS"}}}
              r = requests.post(f"{base}/bundleIds", headers=h, data=json.dumps(p), timeout=30)
              if r.status_code != 201:
                  print(f"::error::Bundle ID の登録に失敗しました（HTTP {r.status_code}）"); print(r.text[:1500]); sys.exit(1)
              print(f"Bundle ID を登録しました: {identifier}")
              return r.json()["data"]["id"]

          def ensure_app_groups(bid_resource_id, identifier):
              # App Groups の機能を有効化（POST /v1/bundleIdCapabilities, capabilityType = APP_GROUPS）。
              # グループ ID（group.…）そのものの作成と Bundle ID への割り当ては公開 API に無いため、
              # PadGuide と同じく Apple Developer サイトで 1 回だけ手作業で行う（README 参照）。
              r = requests.get(f"{base}/bundleIds/{bid_resource_id}/bundleIdCapabilities", headers=h, timeout=30)
              if r.status_code == 200 and any(c.get("attributes", {}).get("capabilityType") == "APP_GROUPS" for c in r.json().get("data", [])):
                  print(f"App Groups は有効です: {identifier}")
                  return
              p = {"data": {"type": "bundleIdCapabilities",
                            "attributes": {"capabilityType": "APP_GROUPS"},
                            "relationships": {"bundleId": {"data": {"type": "bundleIds", "id": bid_resource_id}}}}}
              r = requests.post(f"{base}/bundleIdCapabilities", headers=h, data=json.dumps(p), timeout=30)
              if r.status_code == 201:
                  print(f"App Groups を有効にしました: {identifier}")
              else:
                  print(f"::warning::App Groups の有効化を API で行えませんでした（HTTP {r.status_code}）。Archive 時に Xcode の自動署名で設定します")
                  print(r.text[:800])

          app_id = ensure_bundle(os.environ["BUNDLE_ID"], "Machikane")
          widget_id = ensure_bundle(os.environ["WIDGET_BUNDLE_ID"], "Machikane Widget")
          ensure_app_groups(app_id, os.environ["BUNDLE_ID"])
          ensure_app_groups(widget_id, os.environ["WIDGET_BUNDLE_ID"])
          print("App Group ID: " + os.environ["APP_GROUP_ID"] + "（Apple Developer サイトで作成し、上の 2 つの Bundle ID に割り当ててください）")

          bid = os.environ["BUNDLE_ID"]
          r = requests.get(f"{base}/apps", params={"filter[bundleId]": bid, "limit": "5"}, headers=h, timeout=30)
          has_app = r.status_code == 200 and len(r.json().get("data", [])) > 0
          print("App Store Connect のアプリ: " + ("あり" if has_app else "まだありません"))
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"HAS_APP={'yes' if has_app else 'no'}\n")
          if not has_app and os.environ.get("RELEASE_MODE") == "testflight":
              print("::warning::App Store Connect にこの Bundle ID のアプリがまだありません。アップロード前に「新規App」で作成してください（Bundle ID: " + bid + "）")
          PY

      - name: 自動作成された開発用証明書の整理（証明書の上限エラーを防ぐ）
        id: certcleanup
        if: steps.signing.outcome == 'success'
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/keys/AuthKey.p8
        run: python3 .github/scripts/asc_cleanup_dev_certs.py

      - name: Release Archive
        id: archive
        if: steps.signing.outcome == 'success'
        run: |
          .github/scripts/run-logged.sh mk-archive xcodebuild archive \
            -project apps/machikane/Machikane.xcodeproj -scheme Machikane \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Machikane.xcarchive" -derivedDataPath "$DD-device" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$APP_BUILD"
          APP="$RUNNER_TEMP/Machikane.xcarchive/Products/Applications/Machikane.app"
          for P in "$APP/Info.plist" "$APP/PlugIns/MachikaneWidget.appex/Info.plist"; do
            V=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$P")
            B=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$P")
            BID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$P")
            echo "${P#$RUNNER_TEMP/}: $BID $V ($B)"
            if [ "$V" != "$APP_VERSION" ] || [ "$B" != "$APP_BUILD" ]; then
              echo "::error::バージョン/ビルド番号が想定と違います: $V ($B)、想定 $APP_VERSION ($APP_BUILD)"; exit 1
            fi
          done
          BID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          WID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/PlugIns/MachikaneWidget.appex/Info.plist")
          if [ "$BID" != "$BUNDLE_ID" ] || [ "$WID" != "$WIDGET_BUNDLE_ID" ]; then
            echo "::error::Bundle ID が想定と違います: $BID / $WID"; exit 1
          fi
          # App Group が署名に入ったか確認
          codesign -d --entitlements :- "$APP" 2>/dev/null | grep -q "$APP_GROUP_ID" \
            && echo "App Group を確認: $APP_GROUP_ID" \
            || { echo "::error::署名済みアプリに App Group（$APP_GROUP_ID）が入っていません"; exit 1; }

      - name: IPA 書き出し
        id: export
        if: steps.archive.outcome == 'success'
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<EOF2
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF2
          .github/scripts/run-logged.sh mk-export xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Machikane.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/ipa" -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
          IPA=$(ls "$RUNNER_TEMP"/ipa/*.ipa | head -1)
          mkdir -p "$RUNNER_TEMP/out"
          cp "$IPA" "$RUNNER_TEMP/out/Machikane-$APP_VERSION-$APP_BUILD.ipa"

      - name: Artifact 保存
        if: steps.export.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Machikane-iOS-${{ env.APP_VERSION }}-${{ env.APP_BUILD }}
          path: ${{ runner.temp }}/out/*.ipa
          retention-days: 14

      - name: App Store Connect（TestFlight）へアップロード
        id: upload
        if: env.RELEASE_MODE == 'testflight' && steps.export.outcome == 'success'
        run: |
          cat > "$RUNNER_TEMP/upload.plist" <<EOF2
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF2
          .github/scripts/run-logged.sh mk-upload xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Machikane.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/upload.plist" -exportPath "$RUNNER_TEMP/upload" -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"

      - name: 一時ファイルの削除
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/export.plist" "$RUNNER_TEMP/upload.plist"

      - name: 結果の要約
        if: always()
        env:
          S_UNIT: ${{ steps.unit.outcome }}
          S_BUILD: ${{ steps.build.outcome }}
          S_SIGN: ${{ steps.signing.outcome }}
          S_BUNDLE: ${{ steps.bundle.outcome }}
          S_ARCHIVE: ${{ steps.archive.outcome }}
          S_EXPORT: ${{ steps.export.outcome }}
          S_UPLOAD: ${{ steps.upload.outcome }}
        run: |
          m() { case "$1" in success) echo "✅ 成功";; failure) echo "❌ 失敗";; skipped|"") echo "⏭ 実行せず";; cancelled) echo "⛔ 中止";; *) echo "$1";; esac; }
          {
            echo "## まちかね iOS ビルド結果"
            echo ""
            echo "| 項目 | 結果 |"
            echo "|---|---|"
            echo "| モード | ${RELEASE_MODE} |"
            echo "| バージョン | ${APP_VERSION:-?}（ビルド ${APP_BUILD:-?}） |"
            echo "| Xcode | ${XCODE_VERSION:-?} |"
            echo "| ユニットテスト | $(m "$S_UNIT")（${UNIT_COUNT:-?} 件） |"
            echo "| ビルド（ウィジェットを含む） | $(m "$S_BUILD") |"
            echo "| 署名の準備 | $(m "$S_SIGN") |"
            echo "| Bundle ID / App Group | $(m "$S_BUNDLE") |"
            echo "| Release Archive | $(m "$S_ARCHIVE") |"
            echo "| IPA 書き出し | $(m "$S_EXPORT") |"
            echo "| TestFlight へアップロード | $(m "$S_UPLOAD") |"
            echo ""
            if [ "$S_UPLOAD" = "success" ]; then
              echo "アップロードしました。App Store Connect での処理に 10〜30 分ほどかかります。終わると TestFlight に表示されます。"
            fi
            if [ "$S_UPLOAD" = "failure" ] && [ "${HAS_APP:-}" = "no" ]; then
              echo "**App Store Connect にアプリがまだありません。** 「マイApp」→「＋」→「新規App」で、Bundle ID に com.yosiken0421.machikane を選んで作成し、もう一度 Run workflow を押してください。"
            fi
            if [ "$S_SIGN" = "failure" ]; then
              echo "Settings → Secrets and variables → Actions に ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8 / APPLE_TEAM_ID が登録されているか確認してください。"
            fi
            if grep -q "maximum number of certificates" "$RUNNER_TEMP/mk-archive.log" 2>/dev/null; then
              echo "**証明書の上限に達しています。** もう一度 Run workflow を押してください（開発用証明書を整理してから作り直します）。"
            fi
            if grep -q "application-groups entitlement" "$RUNNER_TEMP/mk-archive.log" 2>/dev/null; then
              echo ""
              echo "**App Group がまだ Bundle ID に割り当てられていません。** Apple Developer → Identifiers で App Group \`group.com.yosiken0421.machikane\` を作成し、"
              echo "\`com.yosiken0421.machikane\` と \`com.yosiken0421.machikane.widget\` の両方の App Groups に割り当ててから、もう一度 Run workflow を押してください。"
              echo "https://developer.apple.com/account/resources/identifiers/list/applicationGroup"
            fi
            if [ "$S_ARCHIVE" = "failure" ] || [ "$S_UPLOAD" = "failure" ]; then
              echo "Apple 側の設定で止まった可能性があります。上の赤いエラーの内容を確認してください（契約への同意、Bundle ID、App Group、API キーの権限が Admin か など）。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

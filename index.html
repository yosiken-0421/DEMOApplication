const $=s=>document.querySelector(s); const yen=n=>'¥'+Number(n).toLocaleString('ja-JP');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEYS={cart:'nolune-demo-cart-v1',fav:'nolune-demo-fav-v1',orders:'nolune-demo-orders-v1'};
function load(k,fallback){try{let v=JSON.parse(localStorage.getItem(k));return v??fallback}catch{return fallback}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
let cart=load(KEYS.cart,{}),fav=load(KEYS.fav,[]),orders=load(KEYS.orders,[]),filter='すべて',searchTerm='',sortBy='recommend',detailQty=1,checkoutDraft=null,checkStep=1,toastTimer;
const cats=['すべて','食器・キッチン','照明・香り','バッグ・ファッション','インテリア','文房具'];
function validCart(){const safe={};for(const p of P){const q=Math.floor(Number(cart[p.id])||0);if(q>0)safe[p.id]=Math.min(q,99)}cart=safe;save(KEYS.cart,cart)}validCart();
function getCart(){return P.filter(p=>cart[p.id]>0).map(p=>({...p,qty:cart[p.id]}))}
function subtotal(){return getCart().reduce((s,p)=>s+p.price*p.qty,0)}
function shipping(){return subtotal()===0?0:subtotal()>=8000?0:650}
function total(){return subtotal()+shipping()}
function count(){return getCart().reduce((s,p)=>s+p.qty,0)}
function updBadge(){const el=$('#cartCount');el.textContent=count();el.hidden=count()===0;document.querySelectorAll('.mobilebar button').forEach(b=>b.classList.toggle('active',currentPath()===b.dataset.go))}
function notify(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2900)}
function go(path){location.hash='#/'+path;if(location.hash==='#/'+path)render();}
function currentPath(){return (location.hash.match(/^#\/([^/?]+)/)||[])[1]||'home'}
function titleBlock(title,desc=''){return `<div class="pagetop"><div class="crumb"><a href="#/home">TOP</a> / ${esc(title)}</div><h1>${esc(title)}</h1>${desc?`<p>${esc(desc)}</p>`:''}</div>`}
function image(p){return `<img src="${p.img}" alt="${esc(p.name)}のオリジナルデモ商品イメージ" loading="lazy">`}
function card(p){return `<article class="product"><div style="position:relative"><button class="prod-photo" data-product="${p.id}" aria-label="${esc(p.name)}を見る">${image(p)}</button><span class="ribbon">${esc(p.tag)}</span><button class="heart ${fav.includes(p.id)?'is-on':''}" data-fav="${p.id}" aria-label="お気に入り${fav.includes(p.id)?'を解除':'に追加'}" aria-pressed="${fav.includes(p.id)}">${fav.includes(p.id)?'♥':'♡'}</button></div><div class="prod-body"><div class="prod-sub">${esc(p.cat)}</div><button class="textlink prod-title" data-product="${p.id}" style="display:block;padding:0;text-align:left;color:var(--ink)">${esc(p.name)}</button><div class="prod-desc">${esc(p.desc)}</div><div class="prod-bottom"><div class="price">${yen(p.price)}<small>税込</small></div><button class="roundadd" data-add="${p.id}" aria-label="${esc(p.name)}をカートに追加">＋</button></div></div></article>`}

function shop(onlyFavorites=false){let items=P.filter(p=>(!onlyFavorites||fav.includes(p.id))&&(filter==='すべて'||filter===p.cat)&&(`${p.name} ${p.en} ${p.desc} ${p.cat}`.toLowerCase().includes(searchTerm.toLowerCase())));if(sortBy==='price-asc')items.sort((a,b)=>a.price-b.price);if(sortBy==='price-desc')items.sort((a,b)=>b.price-a.price);if(sortBy==='name')items.sort((a,b)=>a.name.localeCompare(b.name,'ja'));
return `${titleBlock(onlyFavorites?'お気に入り':'商品一覧',onlyFavorites?'気になった商品をあとから見返せます。':'毎日が少し楽しくなるアイテムを集めました。')}<div class="searchpage"><input id="shopSearch" class="input" placeholder="キーワードで探す（マグ、照明、ギフトなど）" value="${esc(searchTerm)}" aria-label="商品を絞り込む"></div><div class="filterbar">${cats.map(c=>`<button class="chip ${c===filter?'active':''}" data-filter="${esc(c)}">${esc(c)}</button>`).join('')}</div><div class="listtools"><div class="minor"><strong>${items.length}</strong> 件の商品</div><select id="sortSelect" aria-label="並べ替え"><option value="recommend" ${sortBy==='recommend'?'selected':''}>おすすめ順</option><option value="price-asc" ${sortBy==='price-asc'?'selected':''}>価格が安い順</option><option value="price-desc" ${sortBy==='price-desc'?'selected':''}>価格が高い順</option><option value="name" ${sortBy==='name'?'selected':''}>商品名順</option></select></div>${items.length?`<div class="productgrid">${items.map(card).join('')}</div>`:`<div class="empty"><span class="big">🔎</span><h2>商品が見つかりませんでした</h2><p>別のキーワードやカテゴリをお試しください。</p><button class="btn btn-subtle" data-reset-filter>条件をクリア</button></div>`}`}
function detail(id){let p=P.find(x=>x.id===id);if(!p)return titleBlock('商品が見つかりません');return `<div class="pagetop"><div class="crumb"><a href="#/home">TOP</a> / <a href="#/shop">商品一覧</a> / ${esc(p.name)}</div></div><div class="detail"><div>${image(p).replace('loading="lazy"','class="detail-photo"')}<div class="hint" style="margin-top:10px">※ 写真は架空商品のイメージ画像です。</div></div><div><span class="eyebrow">${esc(p.en)}</span><h1>${esc(p.name)}</h1><div class="lead">${esc(p.desc)}</div><p>${esc(p.details)}</p><div class="largeprice">${yen(p.price)} <small style="font:12px sans-serif;color:var(--muted)">税込</small></div><div class="notice">📦 送料 ¥650 ／ 商品合計 ¥8,000以上で送料無料<br>配送・返品条件はご利用ガイドをご確認ください。（デモ設定）</div><label style="display:block;font-weight:700;margin-bottom:9px">数量</label><div class="qty"><button data-detailqty="-1" aria-label="数量を減らす">−</button><span>${detailQty}</span><button data-detailqty="1" aria-label="数量を増やす">＋</button></div><div class="detailactions"><button class="btn btn-primary" data-add="${p.id}" data-use-detail-qty style="flex:1">カートに入れる →</button><button class="btn btn-subtle" data-fav="${p.id}">${fav.includes(p.id)?'♥ 保存済み':'♡ お気に入り'}</button></div><h3 style="margin-top:34px;font-size:17px">商品について</h3><table class="specs"><tr><th>カテゴリ</th><td>${esc(p.cat)}</td></tr><tr><th>素材</th><td>${esc(p.material)}</td></tr><tr><th>サイズ・容量</th><td>${esc(p.size)}</td></tr><tr><th>カラー</th><td>${esc(p.color)}</td></tr><tr><th>ご注意</th><td>全商品情報はデモ用の架空設定です。</td></tr></table><p class="hint">実際の製品では、素材・使用上の注意・保証・原産国等、商品に応じた正確な情報が必要です。</p></div></div><section class="section"><div class="sectionhead"><div><span class="eyebrow">You may also like</span><h2>こちらもおすすめ</h2></div></div><div class="productgrid">${P.filter(x=>x.id!==p.id).slice(0,3).map(card).join('')}</div></section>`}
function cartPage(){const items=getCart();return `${titleBlock('ショッピングカート','商品を確認してから、レジへお進みください。')}${!items.length?`<div class="empty"><span class="big">🧺</span><h2>カートは空っぽです</h2><p>お気に入りのアイテムを探してみましょう。</p><button class="btn btn-primary" data-go="shop">お買い物を続ける →</button></div>`:`<div class="cols"><div><div class="content-card"><h2 style="font-size:21px">カートの商品 <span class="minor">${count()}点</span></h2>${items.map(p=>`<div class="cartrow">${image(p)}<div><h3>${esc(p.name)}</h3><p>${esc(p.color)}</p><div class="qty"><button data-qty="${p.id},-1" aria-label="${esc(p.name)}を1個減らす">−</button><span>${p.qty}</span><button data-qty="${p.id},1" aria-label="${esc(p.name)}を1個増やす">＋</button></div><button class="mini-btn" data-remove="${p.id}">削除</button></div><strong>${yen(p.price*p.qty)}</strong></div>`).join('')}</div><button class="textlink" data-go="shop">← お買い物を続ける</button></div><aside class="content-card summary"><h2>ご注文内容</h2><div class="rowbetween"><span>商品合計（税込）</span><strong>${yen(subtotal())}</strong></div><div class="rowbetween"><span>送料</span><strong>${shipping()===0?'無料':yen(shipping())}</strong></div><div class="progress"><i style="width:${Math.min(subtotal()/8000*100,100)}%"></i></div><p class="hint">${subtotal()<8000?`あと ${yen(8000-subtotal())} で送料無料`: '送料無料になりました 🎉'}</p><div class="rowbetween big"><span>お支払い合計</span><span>${yen(total())}</span></div><button class="btn btn-primary wfull" data-checkout>レジに進む →</button><p class="hint">※ デモのため実際の注文・決済は発生しません。</p></aside></div>`}`}
function checkoutSteps(){return `<div class="steps"><span class="${checkStep===1?'active':''}"><b>1</b>情報入力</span>──<span class="${checkStep===2?'active':''}"><b>2</b>最終確認</span>──<span><b>3</b>完了</span></div>`}
function checkout(){if(!getCart().length)return cartPage();if(checkStep===2)return review();return `${titleBlock('ご購入手続き','ご注文前に必要な情報をご確認ください。')}${checkoutSteps()}<div class="cols"><form id="checkoutForm"><div class="content-card"><h2 style="font-size:23px">お届け先</h2><div class="alert">これはデモです。氏名・住所・メールアドレスなどの実際の個人情報は入力しないでください。入力内容は送信・保存されません。</div><div class="fields"><div class="field"><label for="lastName">姓 <small>必須</small></label><input id="lastName" name="lastName" value="山田" maxlength="30" required autocomplete="off"></div><div class="field"><label for="firstName">名 <small>必須</small></label><input id="firstName" name="firstName" value="花子" maxlength="30" required autocomplete="off"></div><div class="field full"><label for="email">メールアドレス <small>必須</small></label><input type="email" id="email" name="email" value="demo@example.com" required autocomplete="off"></div><div class="field"><label for="post">郵便番号 <small>必須</small></label><input id="post" name="post" value="000-0000" pattern="[0-9]{3}-[0-9]{4}" placeholder="000-0000" required autocomplete="off" inputmode="numeric"></div><div class="field"><label for="pref">都道府県 <small>必須</small></label><input id="pref" name="pref" value="架空県" required autocomplete="off"></div><div class="field full"><label for="address">市区町村・番地 <small>必須</small></label><input id="address" name="address" value="サンプル市 ひだまり町 0-0" required autocomplete="off"></div><div class="field full"><label for="address2">建物名・部屋番号（任意）</label><input id="address2" name="address2" placeholder="建物名・部屋番号" autocomplete="off"></div></div></div><div class="content-card"><h2 style="font-size:23px">配送方法</h2><label class="choice"><input type="radio" name="delivery" value="通常配送" checked> <span><b>通常配送</b><span class="status" style="display:block">発送目安：注文から3〜5営業日（架空の設定）</span></span></label></div><div class="content-card"><h2 style="font-size:23px">お支払い方法</h2><div class="alert">カード番号等の決済情報は入力しません。以下は表示のみの模擬選択です。</div><label class="choice"><input type="radio" name="payment" value="クレジットカード（デモ）" checked><span><b>クレジットカード（デモ）</b><span class="status" style="display:block">カード決済は行われません。</span></span></label><label class="choice"><input type="radio" name="payment" value="銀行振込（デモ）"><span><b>銀行振込（デモ）</b><span class="status" style="display:block">振込先は発行されません。</span></span></label></div><button type="submit" class="btn btn-primary wfull">最終確認へ進む →</button><button type="button" class="textlink" data-go="cart">← カートに戻る</button></form>${summaryPanel(false)}</div>`}
function summaryPanel(showButton){return `<aside class="content-card summary"><h2>ご注文内容</h2>${getCart().map(p=>`<div class="rowbetween" style="font-size:12px"><span>${esc(p.name)} × ${p.qty}</span><strong>${yen(p.price*p.qty)}</strong></div>`).join('')}<div class="rowbetween"><span>商品合計</span><strong>${yen(subtotal())}</strong></div><div class="rowbetween"><span>送料</span><strong>${shipping()?yen(shipping()):'無料'}</strong></div><div class="rowbetween big"><span>合計（税込）</span><span>${yen(total())}</span></div><p class="hint">${showButton?'表示内容を確認して進んでください。':'ご請求は発生しません。'}</p></aside>`}
function review(){if(!checkoutDraft){checkStep=1;return checkout()}return `${titleBlock('注文内容の最終確認','確定前に商品・数量・送料・支払方法・配送先・返品条件を確認できます。')}${checkoutSteps()}<div class="cols"><div><div class="content-card"><h2>ご注文商品</h2><table class="reviewtable">${getCart().map(p=>`<tr><td>${esc(p.name)} × ${p.qty}</td><td>${yen(p.price*p.qty)}</td></tr>`).join('')}</table><button class="textlink" data-go="cart">数量・商品を変更する →</button></div><div class="content-card"><h2>お届け先・お支払い</h2><p><strong>${esc(checkoutDraft.lastName)} ${esc(checkoutDraft.firstName)} 様</strong><br>〒${esc(checkoutDraft.post)}<br>${esc(checkoutDraft.pref)}${esc(checkoutDraft.address)} ${esc(checkoutDraft.address2)}<br>${esc(checkoutDraft.email)}</p><p><b>配送：</b>${esc(checkoutDraft.delivery)}<br><b>支払方法：</b>${esc(checkoutDraft.payment)}<br><b>支払時期：</b>デモのため支払いは発生しません<br><b>発送時期：</b>3〜5営業日（架空の条件）</p><button class="textlink" data-edit-checkout>お届け先・支払方法を修正する →</button></div><div class="content-card"><h2>返品・キャンセル条件（見本）</h2><p>お客様都合の返品は、未使用品に限り商品到着後7日以内に事前連絡が必要、返送料はお客様負担というデモ設定です。不良品・誤配送時は販売者負担で対応する設定です。定期購入ではありません。</p><p class="hint">この条件は架空の見本であり、本番の販売条件ではありません。</p><button class="textlink" data-go="shipping">返品・配送の詳細を見る →</button></div><label class="choice"><input type="checkbox" id="agree" required><span>本画面が <b>注文体験のデモ</b> であり、注文・支払い・配送が発生しないことを理解しました。</span></label><button class="btn btn-terra wfull" data-place-order>デモ注文を確定する（課金なし） →</button><p class="hint">注文内容はこの端末のブラウザにだけ商品名・数量・合計金額が記録されます。個人情報は保存しません。</p></div>${summaryPanel(true)}</div>`}
function done(){return `${titleBlock('デモ注文完了')}<div class="content-card success"><div class="successmark">✓</div><h1>ありがとうございます！</h1><p>デモ注文を記録しました。</p><p>実際の注文受付・決済・配送・メール送信は行っていません。</p><div class="alert" style="max-width:560px;margin:18px auto">これは体験用の注文完了表示です。商品が届くことはありません。</div><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn btn-primary" data-go="history">注文履歴を見る</button><button class="btn btn-subtle" data-go="shop">お買い物を続ける</button></div></div>`}
function historyPage(){return `${titleBlock('購入履歴（デモ）','このブラウザで試した注文のみ表示します。実際の購入履歴ではありません。')}<div class="alert">注文履歴はご利用の端末内にのみ保存されます。別端末やLINEで共有した相手の履歴とは同期しません。</div>${orders.length?`<div class="content-card">${[...orders].reverse().map(o=>`<div class="record"><div class="rowbetween"><b>注文番号（デモ） ${esc(o.id)}</b><span class="badge-demo">模擬注文・未決済</span></div><div class="hint">${esc(o.date)}</div><p class="items">${o.items.map(i=>`${esc(i.name)} × ${i.qty}`).join(' ／ ')}</p><div class="rowbetween"><b>合計（税込・送料込） ${yen(o.total)}</b><button class="btn btn-subtle" data-reorder="${esc(o.id)}">同じ商品をカートに入れる</button></div></div>`).join('')}</div><button class="mini-btn" data-clearhistory>デモ注文履歴を削除する</button>`:`<div class="empty"><span class="big">🧾</span><h2>まだ注文履歴がありません</h2><p>商品をカートに入れて、デモ注文を試してみましょう。</p><button class="btn btn-primary" data-go="shop">商品を選ぶ →</button></div>`}`}

function legal(){return `${titleBlock('特定商取引法に基づく表記','通販に必要な項目の配置例です。以下は架空の値であり、法令対応済みの実販売サイトではありません。')}<div class="alert"><b>重要：</b>下記の会社名・担当者・住所・電話番号等はすべて架空です。実際に販売する場合は、法令に沿って正確な事業者情報・販売条件に置き換えてください。</div><div class="content-card"><dl class="details-list">${[
['販売業者','株式会社ノルネラボ（架空）'],['運営統括責任者','サンプル 太郎（架空人物）'],['所在地','架空県サンプル市ひだまり町 0-0（デモ用・実在しない住所）'],['電話番号','000-0000-0000（通話不可の架空番号）'],['メールアドレス','contact@example.com（例示専用・受信不可）'],['販売価格','各商品ページに税込価格で記載（架空のサンプル価格）'],['商品代金以外の必要料金','送料 一律650円（税込）。商品代金8,000円（税込）以上で送料無料（デモ設定）'],['お支払い方法','クレジットカード・銀行振込（表示のみ／どちらも決済不可）'],['お支払い時期','デモのため支払いは発生しません'],['引渡し時期','注文後3〜5営業日を想定した架空条件。実際の発送はありません'],['申込期間','期間限定販売・定期購入は設定していません'],['キャンセル・返品','商品到着後7日以内・未使用品について事前連絡で受け付け、返送料は購入者負担というデモ設定。不良品・誤配送時は販売者負担の想定です'],['不良品','内容に問題があった場合の案内例を記載。実際の返品・交換はできません'],['利用目的','実際の個人情報は収集しません。入力フォームの表示のみです']].map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl></div><p class="footnote">参考：消費者庁「特定商取引法ガイド（通信販売）」。法的な適否は実際の事業内容と運用により異なります。</p>`}
function guide(){return `${titleBlock('ご利用ガイド','初めての方も、迷わずお買い物できるように。')}<div class="content-card prose"><h2>お買い物の流れ</h2><p>① 商品を探す → ② 商品詳細を確認 → ③ カートに追加 → ④ お届け先・決済方法を選ぶ → ⑤ 最終確認画面で条件を確認・訂正 → ⑥ デモ注文を確定 → ⑦ この端末内の注文履歴を確認。</p><h2>会員登録について</h2><p>見本では会員登録は不要です。ログイン・パスワード・メール送信・実際の注文管理には対応していません。</p><h2>お支払いについて</h2><p>クレジットカード／銀行振込の選択見本はありますが、実際の決済には接続していません。カード番号を入力する欄もありません。</p><h2>送料・お届けについて</h2><p>一律650円（税込）、8,000円（税込）以上のご注文で送料無料という架空の条件です。発送目安は3〜5営業日のデモ設定で、実物の発送は行いません。</p><h2>ギフトについて</h2><p>ギフト向けのおすすめは閲覧できます。ラッピングやメッセージカードの注文機能は未実装です。</p><h2>購入履歴の確認</h2><p>デモ注文後、「購入履歴」から確認可能です。同じブラウザのローカルストレージに商品・数量・金額のみ保存します。氏名・住所・メールは保存しません。</p></div><div style="margin-top:20px"><button class="btn btn-primary" data-go="shop">商品を探してみる →</button></div>`}
function shippingPage(){return `${titleBlock('配送・返品について','発送と返品の条件をわかりやすく。※すべて架空のデモ条件です。')}<div class="content-card prose"><h2>送料</h2><p>全国一律 ¥650（税込）／商品合計 ¥8,000（税込）以上で送料無料というデモ設定です。配送地域別の追加料金は設定していません。</p><h2>お届けの目安</h2><p>注文後3〜5営業日で発送するというデモ設定です。商品の発送・追跡番号の発行は行いません。</p><h2>お客様都合の返品</h2><p>商品到着後7日以内に事前連絡し、未使用品に限り返品を受け付けるという見本条件です。返送料は購入者負担の設定です。</p><h2>初期不良・誤配送</h2><p>商品に不備がある場合や誤配送の場合には、販売者負担で交換または返金するという見本条件です。</p><h2>キャンセル</h2><p>発送前であればキャンセルを受け付けるというデモ設定です。実際の注文が存在しないため、キャンセル処理は不要です。</p></div>`}
function privacy(){return `${titleBlock('プライバシーポリシー（デモ）','実運用する際には、取得する個人情報と利用目的に合わせて作成する必要があります。')}<div class="content-card prose"><h2>この見本で扱う情報</h2><p>このサイトはサンプルです。カートの内容、お気に入り、デモ注文の商品名・数量・金額をブラウザのローカルストレージに保存します。これらのデータは当サイトのサーバーに送信しません。</p><h2>購入・お問い合わせの入力欄</h2><p>入力内容は表示用であり、フォームからサーバーへ送信されません。氏名・住所・メールアドレスなどの実際の個人情報を入力しないでください。入力内容は注文履歴には保存されません。</p><h2>外部サービスについて</h2><p>デモ本体は外部の解析ツールや広告タグを使用していません。共有ボタンからLINEなどの外部アプリを開いた場合には、遷移先のサービスの取り扱いが適用されます。</p><h2>データ削除</h2><p>このブラウザのサイトデータを消去すると保存情報も消えます。デモ注文履歴は購入履歴画面から個別の全件削除ができます。</p><h2>本番公開前の注意</h2><p>本番では個人情報保護法に沿った利用目的の特定・通知または公表・安全管理、適切なサーバー管理などの検討が必要です。</p></div>`}
function terms(){return `${titleBlock('利用規約（デモ）','操作確認用の見本サイトに関するご案内。')}<div class="content-card prose"><h2>デモサイトの性質</h2><p>ここに表示される店舗・会社・商品・価格・連絡先はサンプルです。商品売買契約は成立しません。</p><h2>注文とお支払い</h2><p>「デモ注文を確定する」は画面操作のテストにすぎません。課金・銀行振込指示・商品の配送・メール送信は行われません。</p><h2>画像・表示について</h2><p>掲載の画像はこの見本用に生成した商品イメージであり、商品仕様は架空の設定です。第三者サイトのロゴ・デザイン・掲載文章を複製したものではありません。</p><h2>共有について</h2><p>HTMLファイルを共有するか、静的サイトとして公開したURLをLINEで共有できます。ファイルを開く環境によって挙動が異なる場合があります。</p></div>`}
function faq(){return `${titleBlock('よくあるご質問','気になることをまとめました。')}<div class="content-card faq">${[
['本当に商品を購入できますか？','いいえ。このサイトはHTMLのデモです。決済・発送・注文受付はできません。'],['送料はいくらですか？','サンプル条件は一律650円、商品代金8,000円以上で送料無料です。'],['会員登録は必要ですか？','見本では不要です。ログイン機能やクラウド上のアカウント管理はありません。'],['購入履歴が別のスマホで見えないのはなぜですか？','デモ注文履歴は操作した端末のブラウザ内だけに保存され、端末間で同期されないためです。'],['LINEでショップを共有できますか？','はい。公開済みのhttpsアドレスなら「LINEで共有」でリンクを送れます。公開前はZIP/HTMLファイルを送るか、先に公開してからURLを共有してください。'],['返品はできますか？','実際の注文がないため返品も発生しません。デモ条件の例は「配送・返品について」で確認できます。'],['問い合わせすると返信は来ますか？','いいえ。問い合わせフォームは入力例の表示のみで、外部へ送信しません。']].map(([q,a])=>`<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('')}</div>`}
function contact(){return `${titleBlock('お問い合わせ','お困りのことがあれば、お気軽に。※送信できないデモフォームです。')}<div class="cols"><div class="content-card"><div class="alert">見本のため問い合わせは送信されません。実際の個人情報を入力しないでください。</div><form id="contactForm"><div class="fields"><div class="field full"><label for="contactName">お名前 <small>必須</small></label><input id="contactName" name="contactName" placeholder="例：サンプル 花子" value="サンプル 花子" required autocomplete="off"></div><div class="field full"><label for="contactEmail">メールアドレス <small>必須</small></label><input id="contactEmail" type="email" name="contactEmail" value="demo@example.com" required autocomplete="off"></div><div class="field full"><label for="contactTopic">お問い合わせ項目</label><select id="contactTopic"><option>商品について</option><option>配送・返品について</option><option>注文について</option><option>その他</option></select></div><div class="field full"><label for="contactMessage">お問い合わせ内容 <small>必須</small></label><textarea id="contactMessage" required placeholder="お問い合わせの内容（デモ文章のみ）">商品について詳しく知りたいです。</textarea></div></div><button class="btn btn-primary wfull" type="submit" style="margin-top:20px">入力内容を確認（送信しない） →</button></form><div id="contactResponse" role="status" style="margin-top:15px"></div></div><aside class="content-card summary"><h2>お問い合わせ窓口</h2><p>架空企業「株式会社ノルネラボ」<br>メール：contact@example.com <span class="minor">（受信不可）</span><br>電話：000-0000-0000 <span class="minor">（通話不可）</span></p><p class="hint">実際の問い合わせ先ではありません。本番では受信可能な窓口に置き換えてください。</p><button class="textlink" data-go="faq">よくある質問を見る</button></aside></div>`}
function sharePage(){return `${titleBlock('ショップを共有する','LINEに送れるよう、ファイルまたは公開URLで共有しましょう。')}<div class="content-card"><h2>LINEで共有する</h2><p>インターネットに公開したサイトなら、友だちがすぐ開けるURLを送れます。</p><div class="sharerow"><button class="btn btn-primary" data-line-share>LINEで共有する</button><button class="btn btn-subtle" data-web-share>共有メニューを開く</button><button class="btn btn-subtle" data-copy-link>サイトのURLをコピー</button></div><p class="sharehint">「file://」で開いている場合は、リンクをLINEに送っても相手は開けません。まずZIP/HTMLをファイルとしてLINEで送るか、公開URLを取得してください。</p><div class="alert">現在のサイトはデモです。HTTPSで公開する際も、決済・注文機能が実装されたわけではありません。</div></div>`}
function render(keepScroll=false){const parts=location.hash.replace(/^#\//,'').split('/');const route=parts[0]||'home';document.title=`${({home:'NOLUNE | 暮らしに、小さな余白を。',shop:'商品一覧 | NOLUNE',cart:'カート | NOLUNE',checkout:'お支払い | NOLUNE',history:'購入履歴 | NOLUNE'})[route]||'NOLUNE | デモショップ'}`;const el=$('#app');let html='';if(route==='home')html=home();else if(route==='shop')html=shop();else if(route==='favorites')html=shop(true);else if(route==='product'){html=detail(Number(parts[1]));}else if(route==='cart')html=cartPage();else if(route==='checkout')html=checkout();else if(route==='done')html=done();else if(route==='history')html=historyPage();else if(route==='about')html=about();else if(route==='legal')html=legal();else if(route==='guide')html=guide();else if(route==='shipping')html=shippingPage();else if(route==='privacy')html=privacy();else if(route==='faq')html=faq();else if(route==='contact')html=contact();else if(route==='terms')html=terms();else if(route==='share')html=sharePage();else html=home();el.innerHTML=html;updBadge();if(!keepScroll)window.scrollTo({top:0,behavior:'instant'});}
function add(id,n=1){if(!P.some(p=>p.id===id))return;cart[id]=Math.min(99,(cart[id]||0)+n);save(KEYS.cart,cart);updBadge();notify('カートに追加しました 🧺');if(currentPath()==='cart')render(true)}
function modify(id,delta){cart[id]=Math.max(0,Math.min(99,(cart[id]||0)+delta));if(cart[id]===0)delete cart[id];save(KEYS.cart,cart);render(true)}
function toggleFav(id){fav=fav.includes(id)?fav.filter(x=>x!==id):[...fav,id];save(KEYS.fav,fav);render(true);notify(fav.includes(id)?'お気に入りに追加しました ♥':'お気に入りを解除しました')}
async function share(kind){if(location.protocol!=='https:' || /^(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])$/i.test(location.hostname)){notify('LINEでURLを共有するには、先にHTTPSの公開サイトに配置してください。公開前はZIP/HTMLファイルを送れます。');return}const url=location.href.split('#')[0]+'#/home';if(kind==='line'){window.open('https://social-plugins.line.me/lineit/share?url='+encodeURIComponent(url),'_blank','noopener');return}if(kind==='web'&&navigator.share){try{await navigator.share({title:'NOLUNE | デモショップ',text:'架空の生活雑貨ショップの見本です。',url})}catch{}return}try{await navigator.clipboard.writeText(url);notify('サイトのURLをコピーしました')}catch{notify('URLをコピーできませんでした')}}
// クリック操作はイベント委譲で管理し、動的に生成したボタンにも対応します。
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.go){if(b.dataset.go==='shop'&&currentPath()!=='shop'){filter='すべて';searchTerm=''}go(b.dataset.go);return}
if(b.dataset.product){detailQty=1;go('product/'+Number(b.dataset.product));return}
if(b.dataset.add){add(Number(b.dataset.add),b.hasAttribute('data-use-detail-qty')?detailQty:1);return}
if(b.dataset.fav){toggleFav(Number(b.dataset.fav));return}
if(b.dataset.cat){filter=b.dataset.cat;searchTerm='';sortBy='recommend';go('shop');return}
if(b.dataset.filter){filter=b.dataset.filter;render(true);return}
if(b.hasAttribute('data-reset-filter')){filter='すべて';searchTerm='';render(true);return}
if(b.dataset.qty){const [id,n]=b.dataset.qty.split(',').map(Number);modify(id,n);return}
if(b.dataset.remove){delete cart[b.dataset.remove];save(KEYS.cart,cart);render(true);return}
if(b.dataset.detailqty){detailQty=Math.max(1,Math.min(99,detailQty+Number(b.dataset.detailqty)));render(true);return}
if(b.hasAttribute('data-checkout')){checkStep=1;checkoutDraft=null;go('checkout');return}
if(b.hasAttribute('data-edit-checkout')){checkStep=1;render();return}
if(b.hasAttribute('data-place-order')){if(!$('#agree')?.checked){notify('デモ注文の説明をご確認ください');return}if(!checkoutDraft){notify('お届け先をご入力ください');checkStep=1;render();return}const rec={id:'D'+Date.now().toString().slice(-9),date:new Date().toLocaleString('ja-JP'),items:getCart().map(p=>({id:p.id,name:p.name,qty:p.qty,price:p.price})),total:total()};orders.push(rec);save(KEYS.orders,orders);cart={};save(KEYS.cart,cart);checkoutDraft=null;checkStep=1;go('done');return}
if(b.dataset.reorder){const order=orders.find(o=>o.id===b.dataset.reorder);if(!order)return;for(const p of order.items){cart[p.id]=Math.min(99,(cart[p.id]||0)+p.qty)}save(KEYS.cart,cart);go('cart');notify('同じ商品をカートに入れました');return}
if(b.hasAttribute('data-clearhistory')){if(confirm('この端末に保存されたデモ注文履歴をすべて消去しますか？')){orders=[];save(KEYS.orders,orders);render()}return}
if(b.dataset.mood){const moods={relax:'食器・キッチン',refresh:'インテリア',gift:'文房具'};filter=moods[b.dataset.mood]||'すべて';searchTerm='';go('shop');return}
if(b.hasAttribute('data-line-share')){share('line');return}if(b.hasAttribute('data-web-share')){share('web');return}if(b.hasAttribute('data-copy-link')){share('copy');return}
if(b.id==='footerShare'){go('share');return}
});
document.addEventListener('input',e=>{if(e.target.id==='shopSearch'){const pos=e.target.selectionStart;searchTerm=e.target.value;render(true);const inpt=$('#shopSearch');if(inpt){inpt.focus();inpt.setSelectionRange(pos,pos)}}if(e.target.id==='topSearch'){} });
document.addEventListener('keydown',e=>{if(e.target.id==='topSearch'&&e.key==='Enter'){searchTerm=e.target.value;filter='すべて';go('shop')}});
document.addEventListener('change',e=>{if(e.target.id==='sortSelect'){sortBy=e.target.value;render(true)}});
document.addEventListener('submit',e=>{if(e.target.id==='checkoutForm'){e.preventDefault();const form=e.target;if(!form.reportValidity())return;const v=Object.fromEntries(new FormData(form));checkoutDraft={lastName:v.lastName,firstName:v.firstName,email:v.email,post:v.post,pref:v.pref,address:v.address,address2:v.address2||'',delivery:v.delivery,payment:v.payment};checkStep=2;render();return}if(e.target.id==='contactForm'){e.preventDefault();if(!e.target.reportValidity())return;$('#contactResponse').innerHTML='<div class="form-ok"><b>入力内容の確認ができました。</b><br>このデモフォームは送信されません。メールや問い合わせの受付は発生していません。</div>';return}});
window.addEventListener('hashchange',()=>render());
render();
</script>

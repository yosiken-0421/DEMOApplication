<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>みなパ！</title>
<meta name="description" content="友だち・恋人・職場のみんなで遊べるミニゲームパーティー。13種類のミニゲームでハイスコアに挑戦！">
<meta property="og:title" content="みなパ！ MINI GAME PARTY">
<meta property="og:description" content="13種類のミニゲームでハイスコアに挑戦！ブラウザですぐ遊べます。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://yosiken-0421.github.io/DEMOApplication/minapa/">

<style>
:root{
  --bg1:#ffd6e8; --bg2:#c9e4ff; --ink:#3a2a4d; --sub:#7a6a8d; --card:#ffffffee;
  --pink:#ff5fa2; --blue:#4c8dff; --yellow:#ffc93c; --green:#3ccf8e; --purple:#8b6cff;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#2a1f4a;color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","HiraMaruProN-W4","Hiragino Sans","Noto Sans CJK JP","Noto Sans JP",sans-serif}
button{font-family:inherit;color:inherit;border:0;cursor:pointer}
#app{position:fixed;inset:0;overflow:hidden;background:linear-gradient(160deg,var(--bg1),var(--bg2))}
#app::before{content:"";position:absolute;inset:-50%;background-image:radial-gradient(#ffffff88 2px,transparent 2.5px);
  background-size:34px 34px;animation:drift 30s linear infinite;pointer-events:none}
@keyframes drift{to{transform:translate(34px,34px)}}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  padding:calc(var(--st) + 14px) 16px calc(var(--sb) + 16px);overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen.on{display:flex;animation:fadein .28s ease}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1.logo{margin:6px 0 0;font-size:56px;letter-spacing:2px;line-height:1;color:#fff;
  text-shadow:0 4px 0 var(--pink),0 8px 0 #c2307a,0 12px 18px #0003;transform:rotate(-4deg)}
h1.logo span{display:inline-block;animation:hop 1.6s ease-in-out infinite}
h1.logo span:nth-child(2){animation-delay:.12s}h1.logo span:nth-child(3){animation-delay:.24s}h1.logo span:nth-child(4){animation-delay:.36s}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-10px)}}
.tag{margin:16px 0 4px;font-size:14px;color:var(--sub);background:#fff9;padding:4px 12px;border-radius:99px}
h2{margin:4px 0 12px;font-size:24px;color:#fff;text-shadow:0 3px 0 var(--purple),0 5px 10px #0003}
.btn{display:block;width:100%;max-width:340px;margin:8px auto;padding:16px 18px;border-radius:22px;font-size:20px;font-weight:bold;
  color:#fff;background:linear-gradient(180deg,#ff7cb8,var(--pink));box-shadow:0 6px 0 #c2307a,0 10px 16px #0002;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c2307a}
.btn.blue{background:linear-gradient(180deg,#7aa9ff,var(--blue));box-shadow:0 6px 0 #2d5fc4,0 10px 16px #0002}
.btn.blue:active{box-shadow:0 2px 0 #2d5fc4}
.btn.yellow{color:#5a3a00;background:linear-gradient(180deg,#ffe07a,var(--yellow));box-shadow:0 6px 0 #c48a00,0 10px 16px #0002}
.btn.yellow:active{box-shadow:0 2px 0 #c48a00}
.btn.gray{color:var(--ink);background:#fff;box-shadow:0 6px 0 #c9bfd9,0 10px 16px #0001}
.btn.gray:active{box-shadow:0 2px 0 #c9bfd9}
.btn.small{font-size:16px;padding:11px 14px;border-radius:16px}
.btn small{display:block;font-size:12px;font-weight:normal;opacity:.9;margin-top:2px}
.card{width:100%;max-width:380px;background:var(--card);border-radius:24px;padding:14px;box-shadow:0 8px 24px #0002;margin:6px 0}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1}
.hero{position:relative;width:260px;height:250px;margin:6px 0 0}
.hero .c{position:absolute;width:150px;bottom:0}
.c svg{width:100%;height:auto;display:block;overflow:visible}
.bob{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.jump{animation:jump .7s ease-in-out infinite}
@keyframes jump{0%,100%{transform:translateY(0) scaleY(1)}15%{transform:translateY(0) scaleY(.92)}45%{transform:translateY(-26px) scaleY(1.04)}}
.shake{animation:shake .5s ease-in-out infinite}
@keyframes shake{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-3px) rotate(-3deg)}75%{transform:translateX(3px) rotate(3deg)}}
.droop{animation:droop 2.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes droop{0%,100%{transform:scaleY(.97) translateY(4px)}50%{transform:scaleY(.95) translateY(6px)}}
.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:380px}
.cpick{background:#fff;border-radius:18px;padding:6px 4px 4px;box-shadow:0 4px 0 #ddd1ec;position:relative}
.cpick.sel{outline:4px solid var(--pink);box-shadow:0 4px 0 #c2307a}
.cpick .nm{font-size:13px;font-weight:bold;text-align:center;margin-top:2px}
.speech{position:relative;background:#fff;border-radius:18px;padding:10px 14px;font-size:16px;box-shadow:0 4px 12px #0002;margin:8px 0;max-width:330px;text-align:center}
.speech::after{content:"";position:absolute;left:50%;top:-10px;margin-left:-10px;border:10px solid transparent;border-top:0;border-bottom-color:#fff}
.glist{width:100%;max-width:380px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gitem{background:#fff;border-radius:18px;padding:12px 10px;text-align:left;box-shadow:0 5px 0 #ddd1ec;position:relative;overflow:hidden}
.gitem:active{transform:translateY(3px);box-shadow:0 2px 0 #ddd1ec}
.gitem .ic{font-size:30px;line-height:1}
.gitem .t{font-weight:bold;font-size:15px;margin-top:4px}
.gitem .b{font-size:12px;color:var(--sub);margin-top:2px}
.back{position:absolute;left:12px;top:calc(var(--st) + 10px);background:#fff;border-radius:99px;width:44px;height:44px;font-size:22px;box-shadow:0 3px 0 #ddd1ec;z-index:5}
.seg{display:flex;background:#efe8f8;border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px 6px;border-radius:12px;background:transparent;font-weight:bold;font-size:15px;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px #0002}
.plist{display:flex;flex-direction:column;gap:8px;width:100%}
.pl{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:6px 10px;box-shadow:0 3px 0 #e6def0}
.pl .av{width:52px;height:52px;border-radius:50%;overflow:hidden;background:#f5effc;flex:none}
.pl .av svg{width:100%;height:auto;transform:translateY(-2px) scale(1.55);transform-origin:50% 22%}
.pl .nm{font-weight:bold;font-size:15px}
.pl .sub{font-size:12px;color:var(--sub)}
.pl .sc{margin-left:auto;font-weight:bold;font-size:20px}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;background:var(--yellow);color:#5a3a00;margin-left:4px;vertical-align:middle}
.note{font-size:13px;color:var(--sub);text-align:center;line-height:1.6;margin:6px 0}
/* game */
#game{padding:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(var(--st) + 8px) 12px 6px;pointer-events:none;z-index:3}
#hud .top{display:flex;align-items:center;gap:8px;background:#2a1f4a88;border-radius:16px;padding:4px 12px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#hud .gname{font-weight:bold;font-size:15px;color:#fff;text-shadow:0 2px 3px #0006;flex:1}
#hud .score{font-weight:bold;font-size:26px;color:#fff;text-shadow:0 3px 0 #0004,0 0 8px #0005;min-width:70px;text-align:right}
#tbar{height:10px;background:#0003;border-radius:99px;margin-top:6px;overflow:hidden}
#tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffe07a,#ff8fb8);border-radius:99px;transform-origin:left;transition:transform .1s linear}
#live{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
#live .lv{display:flex;align-items:center;gap:4px;background:#ffffffcc;border-radius:99px;padding:2px 8px 2px 2px;font-size:12px;font-weight:bold}
#live .lv .d{width:18px;height:18px;border-radius:50%}
#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:4;pointer-events:none}
#overlay.on{display:flex}
#overlay .big{font-size:110px;font-weight:bold;color:#fff;text-shadow:0 6px 0 var(--pink),0 10px 24px #0005;animation:pop .5s ease}
#overlay .mid{font-size:44px;font-weight:bold;color:#fff;text-shadow:0 5px 0 var(--purple),0 8px 20px #0005;animation:pop .5s ease;text-align:center;padding:0 16px}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
/* intro */
.intro-ic{font-size:84px;margin-top:20px;animation:bob 1.6s ease-in-out infinite}
.intro-t{font-size:34px;font-weight:bold;color:#fff;text-shadow:0 4px 0 var(--pink),0 8px 16px #0003;margin:6px 0}
.intro-d{font-size:17px;background:#fff;border-radius:18px;padding:14px 16px;max-width:340px;line-height:1.7;box-shadow:0 6px 18px #0002;text-align:center}
.roundno{font-size:16px;font-weight:bold;color:#fff;background:var(--purple);padding:4px 14px;border-radius:99px;margin-top:6px}
/* results */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:4px;width:100%;max-width:380px;margin-top:34px;min-height:300px}
.pod{flex:1;display:flex;flex-direction:column;align-items:center;max-width:120px}
.pod .c{width:100%}
.pod .stand{width:100%;border-radius:12px 12px 4px 4px;color:#fff;font-weight:bold;font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;box-shadow:inset 0 -6px 0 #0002}
.pod .stand small{font-size:12px;opacity:.95}
.pod .pn{font-size:13px;font-weight:bold;margin-top:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.coopbox{text-align:center}
.coopbox .num{font-size:52px;font-weight:bold;color:var(--pink)}
.meter{height:18px;background:#efe8f8;border-radius:99px;overflow:hidden;margin:8px 0}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#3ccf8e,#ffe07a);border-radius:99px;width:0;transition:width 1.2s ease}
.stars{font-size:40px;letter-spacing:4px}
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 24px);transform:translateX(-50%);background:#3a2a4dee;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;z-index:99;max-width:90%;text-align:center;display:none}
.spin{width:44px;height:44px;border-radius:50%;border:5px solid #fff;border-top-color:var(--pink);animation:spin 1s linear infinite;margin:14px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:50;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ===== 大人も楽しめるテーマ（上書き） ===== */
:root{--ink:#1f2340;--sub:#6b7090;--card:#ffffff;--pink:#ff6b81;--blue:#4f7cff;--yellow:#f5b301;--purple:#7c5cff}
html,body{background:#15172e;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP",sans-serif}
#app{background:radial-gradient(120% 70% at 50% 0%,#3a2f78 0%,#1d1f42 55%,#141630 100%)}
#app::before{background-image:radial-gradient(#ffffff12 1.4px,transparent 1.8px);background-size:26px 26px;animation-duration:60s}
.tag{color:#d9d6ff;background:#ffffff12;border:1px solid #ffffff26;font-size:12px;letter-spacing:.18em;padding:5px 14px}
h1.logo{font-size:60px;font-weight:900;letter-spacing:1px;color:#fff;text-shadow:0 3px 0 #ff6b81,0 6px 0 #7c3aed,0 14px 30px #0008;transform:skewX(-8deg)}
h1.logo span{animation-duration:2.4s}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
h2{color:#fff;font-weight:800;text-shadow:0 2px 10px #0006;letter-spacing:.04em}
.btn{font-weight:800;letter-spacing:.04em;border-radius:18px;background:linear-gradient(135deg,#ff9a62,#ff5c7c);box-shadow:0 5px 0 #b83a55,0 12px 24px #0005}
.btn:active{box-shadow:0 1px 0 #b83a55}
.btn.blue{background:linear-gradient(135deg,#6e9bff,#4a5cf0);box-shadow:0 5px 0 #2f3aa8,0 12px 24px #0005}
.btn.blue:active{box-shadow:0 1px 0 #2f3aa8}
.btn.yellow{color:#2b2100;background:linear-gradient(135deg,#ffe08a,#f5b301);box-shadow:0 5px 0 #a87a00,0 12px 24px #0004}
.btn.yellow:active{box-shadow:0 1px 0 #a87a00}
.btn.gray{color:#fff;background:#ffffff16;border:1px solid #ffffff30;box-shadow:0 4px 0 #0004}
.btn.gray:active{box-shadow:0 1px 0 #0004}
.card .btn.gray{color:var(--ink);background:#f1f0f8;border:0;box-shadow:0 4px 0 #d6d3e6}
.back{background:#ffffff18;color:#fff;border:1px solid #ffffff30;box-shadow:none}
.note{color:#c9c7e6}
.card .note{color:var(--sub)}
.speech{color:var(--ink);border-radius:16px}
.cpick{box-shadow:0 4px 0 #0004;padding:8px 4px 6px}
.cpick.sel{outline:3px solid #ff7a59;box-shadow:0 4px 0 #b83a55}
.cpick .rl{font-size:10px;color:var(--sub);text-align:center;margin-top:1px;line-height:1.3}
.charrole{color:#d9d6ff;font-size:13px;margin-top:-2px}
.gitem{box-shadow:0 4px 0 #0004}
.pod .pn{color:#fff}
.intro-t{text-shadow:0 3px 0 #ff6b81,0 8px 20px #0006}
.roundno{background:#ffffff1c;border:1px solid #ffffff33}
.hero{width:300px;height:250px}
.pl .av svg{transform:translateY(6px) scale(2.3);transform-origin:50% 36%}
#charBig{width:190px!important}
.round-ic{position:absolute;right:14px;bottom:calc(var(--sb) + 14px);display:flex;gap:10px;z-index:5}
.round-ic button{width:46px;height:46px;border-radius:50%;background:#ffffff18;border:1px solid #ffffff30;font-size:20px;color:#fff}
</style>

<body>
<div id="app">

  <!-- タイトル -->
  <section class="screen" id="s-title">
    <div class="round-ic"><button id="voiceBtn" onclick="Voice.toggle()">🗣️</button><button id="bgmBtn" onclick="BGM.toggle()">🎵</button></div>
    <div class="tag">MINI GAME PARTY</div>
    <h1 class="logo"><span>み</span><span>な</span><span>パ</span><span>！</span></h1>
    <div class="hero" id="titleHero"></div>
    <div class="speech" id="titleSpeech"></div>
    <button class="btn" onclick="UI.go('online')">みんなで遊ぶ<small>Game Center で友だちを招待</small></button>
    <button class="btn blue" onclick="UI.go('solo')">ひとりで遊ぶ<small>ハイスコアに挑戦</small></button>
    <div class="row" style="width:100%;max-width:340px;gap:10px">

  <!-- キャラ選択 -->

  <!-- ソロ -->

  <!-- きろく -->

  <!-- オンライン入口 -->
  <section class="screen" id="s-online">
    <button class="back" onclick="UI.go('title')">‹</button>
    <h2>みんなで遊ぶ</h2>
    <div class="card" id="onlineBox"></div>
  </section>

  <!-- ロビー -->
  <section class="screen" id="s-lobby">
    <h2>ロビー</h2>
    <div class="card">
      <div class="plist" id="lobbyPlayers"></div>
    </div>
    <div class="card" id="lobbyCfg"></div>
    <button class="btn gray small" style="max-width:200px" onclick="Party.leave()">退出</button>
  </section>

  <!-- ゲーム説明 -->
  <section class="screen" id="s-intro">
    <div class="roundno" id="introRound"></div>
    <div class="intro-ic" id="introIc"></div>
    <div class="intro-t" id="introT"></div>
    <div class="intro-d" id="introD"></div>
    <div class="note" id="introNote" style="margin-top:14px"></div>
    <button class="btn" id="introGo" style="margin-top:14px">スタート！</button>

  <!-- ゲーム -->
  <section class="screen" id="s-game">

    <div id="hud">
      <div class="top"><div class="gname" id="hudName"></div><div class="score" id="hudScore">0</div></div>
      <div id="tbar"><i id="tbarI"></i></div>

  <!-- ラウンド結果 / 最終結果 / ソロ結果 -->
  <section class="screen" id="s-result">
    <h2 id="resTitle"></h2>
    <div id="resBody" style="width:100%;display:flex;flex-direction:column;align-items:center"></div>
    <div id="resBtns" style="width:100%"></div>
  </section>

</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
   ネイティブとの橋渡し
   ============================================================ */
const Native = {
  ok: !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.app),
  send(type, obj) {
    if (!this.ok) return;
    try { window.webkit.messageHandlers.app.postMessage(JSON.stringify(Object.assign({ type }, obj || {}))); } catch (e) {}
  },
  haptic(kind) { this.send("haptic", { kind }); }
};

/* ============================================================
   セーブ
   ============================================================ */
const Save = {
  d: { char: 0, best: {}, marathon: 0, plays: 0, wins: 0 },
  load() {
    let raw = window.__SAVE__ || null;
    if (!raw) { try { raw = localStorage.getItem("minapa_v1"); } catch (e) {} }
    if (raw) { try { Object.assign(this.d, JSON.parse(raw)); } catch (e) {} }
  },
  save() {
    const s = JSON.stringify(this.d);
    try { localStorage.setItem("minapa_v1", s); } catch (e) {}
    Native.send("save", { data: s });
  }
};

/* ============================================================
   乱数（同じ種なら全員同じ出題になる）
   ============================================================ */
function RNG(seed) {
  let a = seed >>> 0;
  const f = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  f.range = (lo, hi) => lo + f() * (hi - lo);
  f.int = (n) => Math.floor(f() * n);
  f.pick = (arr) => arr[Math.floor(f() * arr.length)];
  return f;
}
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ============================================================
   サウンド（その場で合成）
   ============================================================ */
const Snd = {
  ctx: null,
  init() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (this.ctx && this.ctx.state === "suspended") this.ctx.resume(); },
  tone(f, d, type = "sine", v = 0.18, slide = 0, delay = 0) {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();

  init(W, H, rng) {

    this.rounds = []; for (let r = 0; r < 7; r++) this.rounds.push(shuffle([...Array(16).keys()], rng).slice(0, 3 + r));

  },

  update(dt) {
    stepFx(this.fx, dt); if (this.done) return; this.t += dt;
    if (this.st === "show" && this.t > this.showTime()) { this.st = "input"; this.t = 0; Snd.tick(); }
    else if (this.st === "input" && this.t > 8) this.endRound(false);

  },
  down(x, y) {
    if (this.st !== "input") return;
    const c = this.size / 4, cx = Math.floor((x - this.ox) / c), cy = Math.floor((y - this.oy) / c);
    if (cx < 0 || cy < 0 || cx > 3 || cy > 3) return;
    const i = cy * 4 + cx, R = this.rounds[this.r];
    if (this.got[i]) return;

      this.got[i] = 1; this.score++; Snd.tone(500 + Object.keys(this.got).length * 60, 0.1, "triangle", 0.15); Native.haptic("light");
      if (Object.keys(this.got).length === R.length) this.endRound(true);

  },
  draw(g) {
    const { W, H } = this;
    const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, "#e5dbff"); gr.addColorStop(1, "#b197fc");
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    const R = this.rounds[Math.min(this.r, this.rounds.length - 1)];
    g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "middle"; g.font = "bold 20px sans-serif";
    g.fillText(`${Math.min(this.r + 1, 7)} / 7 回目（${R.length}こ）`, W / 2, this.oy - 60);
    const msg = this.done ? "おわり！" : this.st === "show" ? "おぼえて！" : this.st === "input" ? "タップ！" : this.clear ? "パーフェクト！" : "ざんねん…";
    g.font = "bold 28px sans-serif"; g.fillText(msg, W / 2, this.oy - 28);
    const c = this.size / 4;

      const x = this.ox + (i % 4) * c, y = this.oy + Math.floor(i / 4) * c, s = c - 10;
      let col = "#ffffff";
      if (this.st === "show" && R.includes(i)) col = "#ffd43b";

      g.fillStyle = "#7048e8"; roundRect(g, x + 5, y + 9, s, s, 14); g.fill();

/* --- 描画ヘルパー --- */
function roundRect(g, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function cloud(g, x, y, s) { g.fillStyle = "#ffffffcc"; [[0, 0, 26], [24, -10, 30], [52, 0, 24], [26, 8, 26]].forEach(([dx, dy, r]) => { g.beginPath(); g.arc(x + dx * s, y + dy * s, r * s, 0, 7); g.fill(); }); }
function burst(fx, x, y, col, n) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, v = 120 + Math.random() * 260; fx.push({ k: "p", x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.6, col, r: 3 + Math.random() * 4 }); } }
function floatText(fx, x, y, txt, col) { fx.push({ k: "t", x, y, vy: -70, life: 0.9, txt, col }); }
function stepFx(fx, dt) { for (const p of fx) { p.life -= dt; p.x += (p.vx || 0) * dt; p.y += (p.vy || 0) * dt; if (p.k === "p") p.vy += 600 * dt; } for (let i = fx.length - 1; i >= 0; i--) if (fx[i].life <= 0) fx.splice(i, 1); }
function drawFx(g, fx) {
  for (const p of fx) {
    g.globalAlpha = clamp(p.life / 0.5, 0, 1);
    if (p.k === "p") { g.fillStyle = p.col; g.beginPath(); g.arc(p.x, p.y, p.r, 0, 7); g.fill(); }
    else { g.font = "bold 24px sans-serif"; g.textAlign = "center"; g.textBaseline = "middle"; g.lineWidth = 5; g.strokeStyle = "#0006"; g.strokeText(p.txt, p.x, p.y); g.fillStyle = p.col; g.fillText(p.txt, p.x, p.y); }
  }
  g.globalAlpha = 1;
}

/* ============================================================
   BGM（オリジナル曲をその場で演奏）
   ============================================================ */
const NOTE_IDX = { C: 0, "C#": 1, Db: 1, D: 2, "D#": 3, Eb: 3, E: 4, F: 5, "F#": 6, Gb: 6, G: 7, "G#": 8, Ab: 8, A: 9, "A#": 10, Bb: 10, B: 11 };
function noteHz(n) { const m = /^([A-G][#b]?)(\d)$/.exec(n); if (!m) return 0; return 440 * Math.pow(2, (NOTE_IDX[m[1]] + 12 * (+m[2] + 1) - 69) / 12); }
const CHORD = {
  C: ["C3", "E3", "G3"], F: ["F2", "A2", "C3"], Am: ["A2", "C3", "E3"], G: ["G2", "B2", "D3"], E: ["E2", "G#2", "B2"], Dm: ["D3", "F3", "A3"]
};
function song(o) {
  o.mel = o.mel.replace(/\|/g, " ").trim().split(/\s+/);
  o.len = o.mel.length * 2;
  return o;
}
const BGM = {
  songs: {
    menu: song({
      bpm: 112, chords: ["C", "F", "Am", "G", "C", "F", "G", "C"], bass: "R . O . R . O .", drum: "k.h.s.h.k.hks.h.", arp: false,
      mel: "E5 - G5 - C6 - G5 E5 | F5 - A5 - C6 - A5 F5 | E5 - A5 - C6 - B5 A5 | G5 - - - D5 - . . | E5 G5 C6 G5 E5 G5 C6 E6 | D6 C6 A5 F5 A5 C6 - A5 | B5 - D6 - B5 G5 A5 B5 | C6 - - - . . . ."
    }),
    game: song({
      bpm: 150, chords: ["Am", "F", "C", "G", "Am", "F", "G", "E"], bass: "R R O R R R O R", drum: "x.hhs.hhx.hxs.hh", arp: true,
      mel: "A4 - C5 E5 A5 - G5 E5 | F5 - E5 - C5 - A4 C5 | G5 - E5 G5 C6 - B5 G5 | D5 - B4 D5 G5 - . G5 | A5 G5 E5 A5 G5 E5 C5 E5 | F5 A5 C6 A5 F5 C5 A4 C5 | B4 D5 G5 B5 D6 - B5 G5 | G#5 - E5 - B4 - G#4 B4"
    })
  },
  cur: null, want: null, timer: 0, step: 0, nextT: 0, rate: 1, out: null, noise: null,
  enabled() { return Save.d.bgm !== false; },
  ensure() {
    const c = Snd.ctx; if (!c) return null;
    if (!this.noise) {
      const b = c.createBuffer(1, c.sampleRate * 0.5, c.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      this.noise = b;
    }
    if (!this.out) { this.out = c.createGain(); this.out.gain.value = 0.5; this.out.connect(c.destination); }
    return c;
  },
  request(name) { this.want = name; this.play(name); },
  play(name) {
    if (this.cur === name && this.timer) return;
    this.stop(true);
    if (!this.enabled() || !Snd.ctx) return;
    const c = this.ensure(); if (!c) return;
    this.cur = name; this.rate = 1; this.step = 0; this.nextT = c.currentTime + 0.08;
    this.timer = setInterval(() => this.tick(), 25);
  },
  stop(keepWant) {
    clearInterval(this.timer); this.timer = 0; this.cur = null;
    if (!keepWant) this.want = null;
    const c = Snd.ctx, o = this.out;
    if (c && o) {
      const t = c.currentTime;
      o.gain.cancelScheduledValues(t); o.gain.setValueAtTime(o.gain.value, t); o.gain.linearRampToValueAtTime(0.0001, t + 0.15);
      setTimeout(() => { try { o.disconnect(); } catch (e) {} }, 400);
      this.out = null;
    }
  },
  wake() { if (this.want && !this.timer) this.play(this.want); },
  setRate(r) { this.rate = r; },
  duck(sec) {
    const c = Snd.ctx, o = this.out; if (!c || !o) return;
    const t = c.currentTime;
    o.gain.cancelScheduledValues(t); o.gain.setValueAtTime(o.gain.value, t);
    o.gain.linearRampToValueAtTime(0.18, t + 0.15); o.gain.setValueAtTime(0.18, t + sec); o.gain.linearRampToValueAtTime(0.5, t + sec + 0.6);
  },
  toggle() {
    Save.d.bgm = !this.enabled(); Save.save();
    if (this.enabled()) { Snd.init(); this.play(this.want || "menu"); } else { const w = this.want; this.stop(); this.want = w; }
    this.icon();
  },
  icon() { const b = $("bgmBtn"); if (b) b.textContent = this.enabled() ? "🎵" : "🔇"; },
  tick() {
    const c = Snd.ctx, S = this.songs[this.cur];
    if (!c || !S) return;
    if (c.state !== "running") { this.nextT = c.currentTime + 0.05; return; }
    const dt = 60 / S.bpm / 4 / this.rate;
    if (this.nextT < c.currentTime - 0.2) this.nextT = c.currentTime + 0.03;
    while (this.nextT < c.currentTime + 0.12) {
      this.playStep(S, this.step, this.nextT, dt);
      this.nextT += dt; this.step = (this.step + 1) % S.len;
    }
  },
  playStep(S, st, t, dt) {
    const bar = Math.floor(st / 16) % S.chords.length, chord = CHORD[S.chords[bar]], s16 = st % 16;
    // ドラム
    const d = S.drum[s16];
    if (d === "k" || d === "x") this.kick(t);
    if (d === "s") this.snare(t);
    if (d === "h" || d === "x") this.hat(t);
    // メロディ（8分音符単位、"-" でのばす）
    if (st % 2 === 0) {
      const i = st / 2, tok = S.mel[i];
      if (tok && tok !== "-" && tok !== ".") {
        let hold = 1; while (S.mel[(i + hold) % S.mel.length] === "-" && hold < 8) hold++;
        const f = noteHz(tok), dur = hold * 2 * dt;
        this.voice("square", f, t, dur * 0.92, 0.045);
        this.voice("triangle", f, t, dur * 0.92, 0.05);
        this.voice("square", f, t + dt * 3, dur * 0.6, 0.012); // ちょっとエコー
      }
      // ベース
      const bp = S.bass.split(" ")[(st / 2) % 8];
      if (bp === "R" || bp === "O") {
        const f = noteHz(chord[0]) * (bp === "O" ? 2 : 1);
        this.voice("triangle", f, t, dt * 1.7, 0.2);
      }
    }
    // アルペジオ
    if (S.arp) { const f = noteHz(chord[s16 % 3]) * 4; this.voice("square", f, t, dt * 0.8, 0.014); }
  },
  voice(type, f, t, d, v) {
    const c = Snd.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.012);
    g.gain.setValueAtTime(v * 0.8, t + Math.max(0.02, d - 0.04)); g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.03);
    o.connect(g); g.connect(this.out); o.start(t); o.stop(t + d + 0.05);
  },
  kick(t) {
    const c = Snd.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.45, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.connect(g); g.connect(this.out); o.start(t); o.stop(t + 0.18);
  },
  noiseHit(t, freq, len, v) {
    const c = Snd.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noise; f.type = "highpass"; f.frequency.value = freq;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    s.connect(f); f.connect(g); g.connect(this.out); s.start(t); s.stop(t + len + 0.02);
  },
  snare(t) { this.noiseHit(t, 1500, 0.13, 0.13); this.voice("triangle", 190, t, 0.06, 0.08); },
  hat(t) { this.noiseHit(t, 7000, 0.035, 0.045); }
};

const Voice = {
  enabled() { return Save.d.voice !== false; },
  say(idx, text, delay = 0) {
    if (!this.enabled() || !text) return;
    clearTimeout(this._t);
    this._t = setTimeout(() => {
      const v = CHARS[idx % CHARS.length].voice;
      BGM.duck(1.2 + text.length * 0.13);
      if (Native.ok) { Native.send("speak", { text, g: v.g, pitch: v.pitch, rate: v.rate }); return; }
      try {
        const ss = window.speechSynthesis; if (!ss) return;
        ss.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "ja-JP"; u.pitch = v.pitch; u.rate = v.rate;
        const ja = ss.getVoices().filter((x) => x.lang && x.lang.indexOf("ja") === 0);
        if (ja.length) u.voice = ja[0];
        ss.speak(u);
      } catch (e) {}
    }, delay);
  },
  toggle() {
    Save.d.voice = !this.enabled(); Save.save(); this.icon();
    if (this.enabled()) this.say(Save.d.char, "ボイスをオンにしました");
  },
  icon() { const b = $("voiceBtn"); if (b) b.style.opacity = this.enabled() ? 1 : 0.4; }
};

const Runner = {
  cv: null, g: null, game: null, raf: 0, onEnd: null, liveCb: null,
  start(id, seed, onEnd, liveCb) {
    UI.go("game");
    this.cv = $("cv"); this.g = this.cv.getContext("2d");
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    const W = this.cv.clientWidth, H = this.cv.clientHeight;
    this.cv.width = W * dpr; this.cv.height = H * dpr; this.g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const proto = GAMES[id];
    this.game = Object.create(proto); this.game.init(W, H, RNG(seed));
    this.id = id; this.onEnd = onEnd; this.liveCb = liveCb; this.hurry = false; this.state = "count"; this.elapsed = 0; this.count = 3.5; this.lastLive = -1;
    $("hudName").textContent = proto.icon + " " + proto.name; $("hudScore").textContent = "0";
    $("tbar").style.visibility = proto.timeLimit ? "visible" : "hidden"; $("tbarI").style.transform = "scaleX(1)";
    this.showOverlay("3", "big"); Snd.tick();
    let last = performance.now();
    const loop = (now) => {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      this.step(dt); this.raf = requestAnimationFrame(loop);
    };
    cancelAnimationFrame(this.raf); this.raf = requestAnimationFrame(loop);
  },
  step(dt) {
    const gm = this.game;
    if (this.state === "count") {
      const before = Math.ceil(this.count - 0.5); this.count -= dt; const after = Math.ceil(this.count - 0.5);
      if (after !== before) { if (after > 0) { this.showOverlay(String(after), "big"); Snd.tick(); } else { this.showOverlay("スタート！", "mid"); Snd.go(); } }
      if (this.count <= 0) { this.state = "play"; BGM.request("game"); setTimeout(() => this.hideOverlay(), 450); }
      gm.draw(this.g); return;
    }
    if (this.state === "play") {
      gm.update(dt); this.elapsed += dt;
      const lim = GAMES[this.id].timeLimit;
      if (lim && !this.hurry && lim - this.elapsed < 5) { this.hurry = true; BGM.setRate(1.22); }
      if (lim) $("tbarI").style.transform = `scaleX(${clamp(1 - this.elapsed / lim, 0, 1)})`;
      $("hudScore").textContent = gm.score;
      if (this.liveCb && Math.floor(this.elapsed * 2) !== this.lastLive) { this.lastLive = Math.floor(this.elapsed * 2); this.liveCb(gm.score); }
      if ((lim && this.elapsed >= lim) || gm.done || this.elapsed > (GAMES[this.id].maxTime || 40)) { this.state = "end"; this.endT = 0; BGM.stop(); this.showOverlay("そこまで！", "mid"); Snd.fanfare(); Native.haptic("success"); }
      gm.draw(this.g); return;
    }
    if (this.state === "end") {
      if (gm.fx) stepFx(gm.fx, dt);
      gm.draw(this.g); this.endT += dt;
      if (this.endT > 1.4) { this.state = "off"; cancelAnimationFrame(this.raf); this.hideOverlay(); const cb = this.onEnd; this.onEnd = null; cb && cb(gm.score); }
    }
  },
  stop() { cancelAnimationFrame(this.raf); this.state = "off"; this.onEnd = null; this.hideOverlay(); },
  showOverlay(t, cls) { const o = $("overlay"); o.innerHTML = `<div class="${cls}">${esc(t)}</div>`; o.classList.add("on"); },
  hideOverlay() { $("overlay").classList.remove("on"); },
  input(type, e) {
    if (this.state !== "play" || !this.game) return;
    const r = this.cv.getBoundingClientRect(); const x = e.clientX - r.left, y = e.clientY - r.top;
    if (type === "down" && this.game.down) this.game.down(x, y);
    if (type === "move" && this.game.move) this.game.move(x, y);
    if (type === "up" && this.game.up) this.game.up(x, y);
  }
};

      $("charGrid").querySelectorAll(".cpick").forEach((b) => b.onclick = () => { Save.d.char = +b.dataset.i; Save.save(); Snd.pop(); Native.haptic("light"); draw(); Voice.say(Save.d.char, CHARS[Save.d.char].lines.hi); if (Party.active) Party.sendHello(); });
    };

  },
  solo() {
    $("soloList").innerHTML = GAME_IDS.map((id) => {
      const g = GAMES[id], best = Save.d.best[id];
      return `<button class="gitem" data-id="${id}"><div class="ic">${g.icon}</div><div class="t">${g.name}</div><div class="b">ベスト: ${best != null ? best : "—"}</div></button>`;
    }).join("");
    $("soloList").querySelectorAll(".gitem").forEach((b) => b.onclick = () => Solo.play(b.dataset.id));
  },
  records() {
    const d = Save.d;
    $("recBox").innerHTML = `<div class="plist">` + GAME_IDS.map((id) => `<div class="pl"><div style="font-size:28px">${GAMES[id].icon}</div><div><div class="nm">${GAMES[id].name}</div></div><div class="sc">${d.best[id] != null ? d.best[id] : "—"}</div></div>`).join("") +
      `<div class="pl"><div style="font-size:28px">🏆</div><div><div class="nm">おまかせ5本勝負</div></div><div class="sc">${d.marathon || "—"}</div></div>` +
      `<div class="pl"><div style="font-size:28px">🎉</div><div><div class="nm">みんなで遊んだ回数 / 優勝</div></div><div class="sc">${d.plays || 0} / ${d.wins || 0}</div></div></div>`;
  },
  online() { Party.renderEntry(); }
};
function showIntro({ id, round, note, auto, onGo }) {
  UI.go("intro");
  const g = GAMES[id];
  $("introRound").textContent = round || ""; $("introRound").style.display = round ? "" : "none";
  $("introIc").textContent = g.icon; $("introT").textContent = g.name; $("introD").innerHTML = g.desc;
  $("introNote").textContent = note || "";
  const btn = $("introGo");
  let fired = false;
  const go = () => { if (fired) return; fired = true; clearTimeout(timer); onGo(); };
  let timer = 0;
  if (auto) { btn.style.display = "none"; timer = setTimeout(go, auto); }
  else { btn.style.display = ""; btn.onclick = () => { Snd.init(); go(); }; }
}
function toast(msg, ms = 2600) { const t = $("toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = "none", ms); }
function confetti(n = 60) {
  const cols = ["#ff5fa2", "#4c8dff", "#ffc93c", "#3ccf8e", "#8b6cff"];
  for (let i = 0; i < n; i++) {
    const d = document.createElement("div"); d.className = "confetti";
    d.style.left = Math.random() * 100 + "vw"; d.style.background = cols[i % cols.length];
    d.style.animationDuration = 1.8 + Math.random() * 1.8 + "s"; d.style.animationDelay = Math.random() * 0.6 + "s";
    document.body.appendChild(d); setTimeout(() => d.remove(), 4500);
  }
}

/* ============================================================
   ソロ
   ============================================================ */
const Solo = {
  play(id) {
    showIntro({ id, onGo: () => Runner.start(id, (Math.random() * 1e9) | 0, (sc) => this.result(id, sc)) });
  },
  result(id, sc) {
    const prev = Save.d.best[id]; const isBest = prev == null || sc > prev;
    if (isBest) { Save.d.best[id] = sc; Save.save(); }
    const me = Save.d.char, c = CHARS[me];
    UI.go("result");
    $("resTitle").textContent = isBest ? "ハイスコア更新！" : "結果";
    $("resBody").innerHTML = `<div class="c ${isBest ? "jump" : "bob"}" style="width:170px">${charSVG(me, isBest ? "happy" : "normal")}</div>
      <div class="card coopbox"><div class="note">${GAMES[id].icon} ${GAMES[id].name}</div><div class="num">${sc}</div><div class="note">ベスト ${Save.d.best[id]}</div></div>
      <div class="speech">${esc(c.name)}「${esc(isBest ? c.lines.win : c.lines.mid)}」</div>`;
    $("resBtns").innerHTML = `<button class="btn" id="rb1">もう1回</button><button class="btn gray small" style="max-width:240px" id="rb2">ゲーム選択</button>`;
    $("rb1").onclick = () => this.play(id); $("rb2").onclick = () => UI.go("solo");
    if (isBest) { confetti(); Snd.fanfare(); }
    Voice.say(me, isBest ? c.lines.win : c.lines.mid, 900);
  },
  startMarathon() {
    const ids = shuffle(GAME_IDS.slice(), RNG((Math.random() * 1e9) | 0)).slice(0, 5);
    const scores = [];
    const next = (i) => {
      if (i >= ids.length) return this.marathonEnd(ids, scores);
      showIntro({ id: ids[i], round: `${i + 1} / ${ids.length} 本目`, onGo: () => Runner.start(ids[i], (Math.random() * 1e9) | 0, (sc) => { scores.push(sc); next(i + 1); }) });
    };
    next(0);
  },
  marathonEnd(ids, scores) {
    // 各ゲームの点数をコープ目標比で100点満点に直して合計（ゲーム間の点の差をならす）
    const pts = ids.map((id, i) => Math.round(clamp(scores[i] / GAMES[id].coop, 0, 2) * 100));
    const total = pts.reduce((a, b) => a + b, 0);
    const isBest = total > (Save.d.marathon || 0); if (isBest) { Save.d.marathon = total; Save.save(); }
    const me = Save.d.char, c = CHARS[me];
    UI.go("result");
    $("resTitle").textContent = isBest ? "ベスト更新！" : "5本勝負 結果";
    $("resBody").innerHTML = `<div class="c ${isBest ? "jump" : "bob"}" style="width:150px">${charSVG(me, isBest ? "happy" : "normal")}</div>
      <div class="card"><div class="plist">${ids.map((id, i) => `<div class="pl"><div style="font-size:26px">${GAMES[id].icon}</div><div><div class="nm">${GAMES[id].name}</div><div class="sub">${scores[i]} 点</div></div><div class="sc">${pts[i]}</div></div>`).join("")}</div>
      <div class="coopbox"><div class="note">合計（各ゲーム100点基準）</div><div class="num">${total}</div><div class="note">ベスト ${Save.d.marathon}</div></div></div>
      <div class="speech">${esc(c.name)}「${esc(isBest ? c.lines.win : c.lines.mid)}」</div>`;
    $("resBtns").innerHTML = `<button class="btn" id="rb1">もう1回</button><button class="btn gray small" style="max-width:240px" id="rb2">戻る</button>`;
    $("rb1").onclick = () => this.startMarathon(); $("rb2").onclick = () => UI.go("solo");
    if (isBest) { confetti(); Snd.fanfare(); }
    Voice.say(me, isBest ? c.lines.win : c.lines.mid, 900);
  }
};
function shuffle(a, rng) { for (let i = a.length - 1; i > 0; i--) { const j = rng.int(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ============================================================
   みんなで（Game Center）
   ============================================================ */
const Party = {
  auth: { state: "idle", name: "", id: "", error: "" },
  active: false, me: null, players: new Map(), charCache: {}, order: [], hostId: "",
  mode: "versus", rounds: 3, list: [], seeds: [], i: -1, scores: {}, live: {}, totals: {}, coopRes: {}, phase: "", waitTimer: 0, nextTimer: 0,

  /* ---- 入口 ---- */
  renderEntry() {
    const box = $("onlineBox");
    if (!Native.ok) {
      box.innerHTML = `<div class="note">オンライン対戦は iPhone アプリ版で遊べます。<br>（ブラウザ版では「ひとりで遊ぶ」を楽しめます）</div>`;
      return;
    }
    if (this.auth.state === "idle") { this.auth.state = "pending"; Native.send("gc_auth"); }
    if (this.auth.state === "pending") { box.innerHTML = `<div class="note">Game Center に接続中…</div><div class="spin"></div>`; return; }
    if (this.auth.state === "fail") {
      box.innerHTML = `<div class="note">Game Center にサインインできませんでした。<br>iPhoneの「設定」→「Game Center」でサインインしてから、もう一度ためしてね。</div>
        <div class="note" style="font-size:11px">${esc(this.auth.error || "")}</div>
        <button class="btn blue small" id="gcRetry">もう一度つなぐ</button>`;
      $("gcRetry").onclick = () => { this.auth.state = "pending"; Native.send("gc_auth"); this.renderEntry(); };
      return;
    }
    const me = Save.d.char;
    box.innerHTML = `<div class="row"><div class="pl grow" style="box-shadow:none"><div class="av">${charSVG(me)}</div><div><div class="nm">${esc(this.auth.name)}</div><div class="sub">${CHARS[me].name} で参加</div></div></div></div>
      <button class="btn" id="gcHost">友だちを招待して始める<small>2〜4人・招待された人は通知から参加</small></button>
      <div class="note">遊び方：ひとりが「招待してはじめる」を押して友だちを選ぶ → 招待された人は通知をタップして参加。<br>全員そろったらロビーでモードを決めてスタート！<br>みんな同じお題を同時に遊んで、点数で勝負します。</div>`;
    $("gcHost").onclick = () => { Snd.init(); Native.send("gc_host", { min: 2, max: 4 }); toast("招待画面をひらいています…"); };
  },

  /* ---- ネイティブからのイベント ---- */
  onEvent(e) {
    if (e.ev === "auth") {
      this.auth = e.ok ? { state: "ok", name: e.name, id: e.id } : { state: "fail", error: e.error || "" };
      if (UI.cur === "online") this.renderEntry();
    } else if (e.ev === "started") {
      this.begin(e.me, e.players);
    } else if (e.ev === "joined") {
      if (this.active && e.player && !this.players.has(e.player.id)) {
        this.players.set(e.player.id, { id: e.player.id, name: e.player.name, char: this.charCache[e.player.id] != null ? this.charCache[e.player.id] : -1 });
        this.calcHost(); this.sendHello(); toast(`${e.player.name} が参加しました`);
        if (UI.cur === "lobby") this.renderLobby();
      }
    } else if (e.ev === "data") {
      let m; try { m = JSON.parse(e.msg); } catch (x) { return; }
      this.onMsg(e.from, m);
    } else if (e.ev === "left") {
      this.onLeft(e.id);
    } else if (e.ev === "cancelled") {
      toast("招待をとじました");
    } else if (e.ev === "error") {
      toast("エラー: " + (e.message || "接続できませんでした"), 4000);
    } else if (e.ev === "disconnected") {
      if (this.active) { this.reset(); toast("通信が切れました"); UI.go("online"); }
    }
  },
  sendAll(obj) { Native.send("gc_send", { data: JSON.stringify(obj) }); },

  /* ---- マッチ開始 ---- */
  begin(me, others) {
    this.reset();
    this.active = true; this.me = me;
    this.players.set(me.id, { id: me.id, name: me.name, char: Save.d.char });
    for (const p of others) if (p.id !== me.id) this.players.set(p.id, { id: p.id, name: p.name, char: this.charCache[p.id] != null ? this.charCache[p.id] : -1 });
    this.calcHost();
    this.sendHello();
    Snd.fanfare(); Native.haptic("success");
    UI.go("lobby"); this.renderLobby();
  },
  reset() {
    clearTimeout(this.waitTimer); clearTimeout(this.nextTimer); Runner.stop();
    this.active = false; this.players = new Map(); this.i = -1; this.scores = {}; this.live = {}; this.totals = {}; this.phase = ""; this.list = []; this.seeds = [];
  },
  calcHost() { this.order = [...this.players.keys()].sort(); this.hostId = this.order[0]; },
  isHost() { return this.me && this.hostId === this.me.id; },
  sendHello() { if (!this.active) return; const p = this.players.get(this.me.id); p.char = Save.d.char; this.sendAll({ t: "hello", char: Save.d.char }); if (UI.cur === "lobby") this.renderLobby(); },
  leave() { Native.send("gc_leave"); this.reset(); UI.go("online"); },

  onMsg(from, m) {
    if (m.t === "hello") this.charCache[from] = m.char;
    if (!this.active) return;
    const p = this.players.get(from);
    if (!p) { this.players.set(from, { id: from, name: m.name || "プレイヤー", char: -1 }); this.calcHost(); }
    switch (m.t) {
      case "hello": {
        const pl = this.players.get(from); pl.char = m.char;
        if (!m.re) this.sendAll({ t: "hello", char: Save.d.char, re: true });
        if (this.isHost()) this.sendCfg();
        if (UI.cur === "lobby") this.renderLobby();
        break;
      }
      case "cfg": if (from === this.hostId) { this.mode = m.mode; this.rounds = m.rounds; if (UI.cur === "lobby") this.renderLobby(); } break;
      case "start": if (from === this.hostId) this.applyStart(m); break;
      case "next": if (from === this.hostId && m.i > this.i) this.runRound(m.i); break;
      case "score": this.gotScore(from, m.i, m.s); break;
      case "live": if (m.i === this.i) { this.live[from] = m.s; this.renderLive(); } break;
      case "again": if (from === this.hostId) this.toLobby(); break;
    }
  },
  onLeft(id) {
    const p = this.players.get(id); if (!p) return;
    this.players.delete(id); this.calcHost();
    toast(`${p.name} がぬけました`);
    if (this.players.size < 2) { toast("相手がいなくなったので終了します", 3500); this.leave(); return; }
    if (UI.cur === "lobby") this.renderLobby();
    if (this.phase === "wait") this.checkRound();
    if (this.phase === "result" && this.isHost() && !this.nextTimer) this.scheduleNext();
  },

  /* ---- ロビー ---- */
  sendCfg() { this.sendAll({ t: "cfg", mode: this.mode, rounds: this.rounds }); },
  renderLobby() {
    $("lobbyPlayers").innerHTML = this.order.map((id) => {
      const p = this.players.get(id); if (!p) return "";
      const ch = p.char >= 0 ? p.char : 0;
      return `<div class="pl"><div class="av">${charSVG(ch, p.char >= 0 ? "normal" : "surprise")}</div><div><div class="nm">${esc(p.name)}${id === this.hostId ? '<span class="badge">ホスト</span>' : ""}${id === this.me.id ? '<span class="badge" style="background:#d0ebff;color:#1864ab">あなた</span>' : ""}</div><div class="sub">${p.char >= 0 ? CHARS[p.char].name : "準備中…"}</div></div></div>`;
    }).join("");
    const cfg = $("lobbyCfg");
    const modeTxt = this.mode === "coop" ? "みんなで協力：全員の合計点で目標クリアをめざす" : "対戦：順位でポイントを取り合う";
    if (this.isHost()) {
      cfg.innerHTML = `<div class="note" style="margin-top:0">モード</div>
        <div class="seg" id="segMode"><button data-v="versus" class="${this.mode === "versus" ? "on" : ""}">⚔️ 対戦</button><button data-v="coop" class="${this.mode === "coop" ? "on" : ""}">🤝 協力</button></div>
        <div class="note">${modeTxt}</div>
        <div class="note">ゲーム数</div>
        <div class="seg" id="segRounds">${[3, 5, 7].map((n) => `<button data-v="${n}" class="${this.rounds === n ? "on" : ""}">${n}本</button>`).join("")}</div>
        <button class="btn" id="lobbyStart" style="margin-top:14px">スタート！</button>
        <button class="btn yellow small" id="lobbyChar">キャラ変更</button>`;
      cfg.querySelectorAll("#segMode button").forEach((b) => b.onclick = () => { this.mode = b.dataset.v; this.sendCfg(); this.renderLobby(); });
      cfg.querySelectorAll("#segRounds button").forEach((b) => b.onclick = () => { this.rounds = +b.dataset.v; this.sendCfg(); this.renderLobby(); });
      $("lobbyStart").onclick = () => this.hostStart();
    } else {
      cfg.innerHTML = `<div class="note" style="margin-top:0">モード：<b>${this.mode === "coop" ? "🤝 協力" : "⚔️ 対戦"}</b> ／ <b>${this.rounds}本</b></div><div class="note">${modeTxt}</div>
        <div class="note">ホストがスタートするのを待っています…</div><div class="spin"></div>
        <button class="btn yellow small" id="lobbyChar">キャラ変更</button>`;
    }
    $("lobbyChar").onclick = () => this.pickCharInLobby();
  },
  pickCharInLobby() {
    const me = this.players.get(this.me.id);
    Save.d.char = (Save.d.char + 1) % CHARS.length; Save.save(); me.char = Save.d.char;
    this.sendHello(); Snd.pop();
  },
  hostStart() {
    const rng = RNG((Math.random() * 1e9) | 0);
    const pool = shuffle(GAME_IDS.slice(), rng); const list = [];
    for (let k = 0; k < this.rounds; k++) list.push(pool[k % pool.length]);
    const seeds = list.map(() => (rng() * 1e9) | 0);
    const m = { t: "start", mode: this.mode, list, seeds };
    this.sendAll(m); this.applyStart(m);
  },
  applyStart(m) {
    this.mode = m.mode; this.list = m.list; this.seeds = m.seeds; this.rounds = m.list.length;
    this.scores = {}; this.totals = {}; this.coopRes = {}; this.i = -1;
    for (const id of this.players.keys()) this.totals[id] = 0;
    this.runRound(0);
  },

  /* ---- ラウンド ---- */
  runRound(i) {
    clearTimeout(this.nextTimer); this.nextTimer = 0; clearTimeout(this.waitTimer);
    this.i = i; this.live = {}; this.phase = "intro";
    if (!this.scores[i]) this.scores[i] = {};
    const id = this.list[i];
    const note = this.mode === "coop" ? `みんなの目標：合計 ${this.target(i)} 点` : "1位 3pt・2位 2pt・3位 1pt";
    showIntro({ id, round: `${i + 1} / ${this.rounds} 本目`, note, auto: 3800, onGo: () => {
      this.phase = "play";
      Runner.start(id, this.seeds[i], (sc) => this.myScore(i, sc), (sc) => { this.sendAll({ t: "live", i, s: sc }); });
      this.renderLive();
    } });
  },
  target(i) { return GAMES[this.list[i]].coop * this.players.size; },
  renderLive() {
    if (UI.cur !== "game") return;
    $("live").innerHTML = this.order.filter((id) => id !== this.me.id && this.players.has(id)).map((id) => {
      const p = this.players.get(id), c = CHARS[Math.max(0, p.char)];
      return `<div class="lv"><span class="d" style="background:${c.color}"></span>${esc(p.name.slice(0, 6))} ${this.live[id] != null ? this.live[id] : 0}</div>`;
    }).join("");
  },
  myScore(i, sc) {
    $("live").innerHTML = "";
    this.sendAll({ t: "score", i, s: sc });
    this.gotScore(this.me.id, i, sc);
    if (this.phase === "play") { this.phase = "wait"; UI.go("wait"); this.renderWait(); }
    this.checkRound();
    clearTimeout(this.waitTimer);
    this.waitTimer = setTimeout(() => { // 来ない人は0点あつかい
      if (this.phase !== "wait" || this.i !== i) return;
      for (const id of this.players.keys()) if (this.scores[i][id] == null) this.scores[i][id] = 0;
      this.checkRound();
    }, 90000);
  },
  gotScore(from, i, s) {
    if (!this.scores[i]) this.scores[i] = {};
    this.scores[i][from] = s;
    if (i === this.i && this.phase === "wait") { this.renderWait(); this.checkRound(); }
  },
  renderWait() {
    const sc = this.scores[this.i] || {};
    $("waitList").innerHTML = this.order.filter((id) => this.players.has(id)).map((id) => {
      const p = this.players.get(id), done = sc[id] != null;
      return `<div class="pl"><div class="av">${charSVG(Math.max(0, p.char), done ? "normal" : "surprise")}</div><div><div class="nm">${esc(p.name)}</div><div class="sub">${done ? "完了" : "プレイ中…"}</div></div><div class="sc">${done ? "✅" : "⏳"}</div></div>`;
    }).join("");
  },
  checkRound() {
    if (this.phase !== "wait") return;
    const sc = this.scores[this.i] || {};
    for (const id of this.players.keys()) if (sc[id] == null) return;
    clearTimeout(this.waitTimer);
    this.showRoundResult();
  },
  rankOf(sc) { // 同点は同順位
    const ids = Object.keys(sc).filter((id) => this.players.has(id)).sort((a, b) => sc[b] - sc[a]);
    const rank = {}; ids.forEach((id, k) => rank[id] = k > 0 && sc[id] === sc[ids[k - 1]] ? rank[ids[k - 1]] : k);
    return { ids, rank };
  },
  showRoundResult() {
    this.phase = "result";
    const i = this.i, sc = this.scores[i], gid = this.list[i];
    UI.go("result");
    $("resTitle").textContent = `${i + 1}本目 ${GAMES[gid].name} 結果`;
    let html = "";
    if (this.mode === "coop") {
      const sum = Object.keys(sc).filter((id) => this.players.has(id)).reduce((a, id) => a + sc[id], 0), tgt = this.target(i), ok = sum >= tgt;
      this.coopRes[i] = { sum, ok };
      html += `<div class="row" style="justify-content:center;flex-wrap:wrap">${this.order.filter((id) => this.players.has(id)).map((id) => { const p = this.players.get(id); return `<div style="width:90px;text-align:center"><div class="c ${ok ? "jump" : "droop"}">${charSVG(Math.max(0, p.char), ok ? "happy" : "sad")}</div><div class="pl" style="justify-content:center;padding:4px"><b>${sc[id]}</b></div></div>`; }).join("")}</div>
        <div class="card coopbox"><div class="note">みんなの合計</div><div class="num">${sum}</div><div class="meter"><i id="mtr"></i></div><div class="note">目標 ${tgt} 点 → <b style="color:${ok ? "#2f9e44" : "#e03131"}">${ok ? "クリア！" : "とどかず…"}</b></div></div>`;
      if (ok) { Snd.fanfare(); confetti(40); } else Snd.sad();
      Voice.say(Save.d.char, ok ? CHARS[Save.d.char].lines.mid : CHARS[Save.d.char].lines.lose, 900);
    } else {
      const { ids, rank } = this.rankOf(sc), n = ids.length;
      ids.forEach((id) => { const pts = n === 2 ? (rank[id] === 0 ? 3 : 1) : Math.max(0, 3 - rank[id]); this.totals[id] = (this.totals[id] || 0) + pts; });
      html += `<div class="card"><div class="plist">${ids.map((id) => {
        const p = this.players.get(id), r = rank[id], ex = r === 0 ? "happy" : r === n - 1 ? "sad" : "normal";
        return `<div class="pl"><div style="font-size:22px;width:28px;text-align:center">${["🥇", "🥈", "🥉", "4"][r]}</div><div class="av">${charSVG(Math.max(0, p.char), ex)}</div><div><div class="nm">${esc(p.name)}</div><div class="sub">${sc[id]} 点</div></div><div class="sc">${this.totals[id]}<span style="font-size:12px">pt</span></div></div>`;
      }).join("")}</div></div>`;
      const top = ids[0], tp = this.players.get(top), tc = CHARS[Math.max(0, tp.char)];
      html = `<div class="c jump" style="width:130px">${charSVG(Math.max(0, tp.char), "happy")}</div><div class="speech">${esc(tp.name)}（${tc.name}）「${esc(tc.lines.win)}」</div>` + html;
      if (rank[this.me.id] === 0) { Snd.fanfare(); confetti(30); } else Snd.tick();
      Voice.say(Math.max(0, tp.char), tc.lines.win, 900);
    }
    const last = i >= this.rounds - 1;
    html += `<div class="note">${last ? "最終結果を集計中…" : "まもなく次のゲームへ…"}</div>`;
    $("resBody").innerHTML = html; $("resBtns").innerHTML = "";
    if (this.mode === "coop") setTimeout(() => { const m = $("mtr"); if (m) m.style.width = Math.min(100, (this.coopRes[i].sum / this.target(i)) * 100) + "%"; }, 60);
    if (this.isHost()) this.scheduleNext();
    else if (last) { this.nextTimer = setTimeout(() => this.showFinal(), 6000); }
  },
  scheduleNext() {
    const i = this.i;
    this.nextTimer = setTimeout(() => {
      this.nextTimer = 0;
      if (i >= this.rounds - 1) { this.showFinal(); return; }
      this.sendAll({ t: "next", i: i + 1 }); this.runRound(i + 1);
    }, 6000);
  },
  showFinal() {
    if (this.phase === "final") return;
    this.phase = "final"; clearTimeout(this.nextTimer);
    Save.d.plays = (Save.d.plays || 0) + 1;
    UI.go("result");
    let html = "";
    if (this.mode === "coop") {
      const clears = [...Array(this.rounds).keys()].filter((k) => this.coopRes[k] && this.coopRes[k].ok).length;
      const stars = "★".repeat(clears) + "☆".repeat(this.rounds - clears);
      const great = clears >= Math.ceil(this.rounds * 0.6);
      $("resTitle").textContent = great ? "チーム大成功！" : "おつかれさまでした！";
      html += `<div class="row" style="justify-content:center;flex-wrap:wrap">${this.order.filter((id) => this.players.has(id)).map((id) => { const p = this.players.get(id); return `<div style="width:96px;text-align:center"><div class="c ${great ? "jump" : "bob"}">${charSVG(Math.max(0, p.char), great ? "happy" : "normal")}</div><div class="pn" style="font-size:13px;font-weight:bold">${esc(p.name)}</div></div>`; }).join("")}</div>
        <div class="card coopbox"><div class="stars" style="color:#fab005">${stars}</div><div class="note">${this.rounds}本中 <b>${clears}本</b> クリア！</div></div>`;
      if (great) { Save.d.wins = (Save.d.wins || 0) + 1; Snd.fanfare(); confetti(80); }
      Voice.say(Save.d.char, great ? CHARS[Save.d.char].lines.win : CHARS[Save.d.char].lines.lose, 1100);
    } else {
      const tot = {}; for (const id of this.players.keys()) tot[id] = this.totals[id] || 0;
      const { ids, rank } = this.rankOf(tot);
      const win = rank[this.me.id] === 0;
      $("resTitle").textContent = win ? "あなたが優勝！" : "最終結果";
      if (win) Save.d.wins = (Save.d.wins || 0) + 1;
      const podOrder = ids.length >= 3 ? [ids[1], ids[0], ids[2]] : ids.length === 2 ? [ids[1], ids[0]] : ids;
      const hs = [0, 1, 2, 3].map((r) => [130, 90, 64, 50][r]);
      const colors = ["#fab005", "#adb5bd", "#e8590c", "#868e96"];
      html += `<div class="podium">${podOrder.map((id) => { const p = this.players.get(id), r = rank[id], ex = r === 0 ? "happy" : r === ids.length - 1 ? "sad" : "normal";
        return `<div class="pod"><div class="c ${r === 0 ? "jump" : r === ids.length - 1 ? "droop" : "bob"}">${charSVG(Math.max(0, p.char), ex)}</div><div class="stand" style="height:${hs[r]}px;background:${colors[r]}">${r + 1}位<small>${tot[id]}pt</small></div><div class="pn">${esc(p.name)}</div></div>`; }).join("")}</div>`;
      if (ids.length === 4) { const id = ids[3], p = this.players.get(id); html += `<div class="pl" style="width:100%;max-width:380px;margin-top:8px"><div style="width:28px;text-align:center">4</div><div class="av">${charSVG(Math.max(0, p.char), "sad")}</div><div class="nm">${esc(p.name)}</div><div class="sc">${tot[id]}pt</div></div>`; }
      const tp = this.players.get(ids[0]), tc = CHARS[Math.max(0, tp.char)];
      html += `<div class="speech">${esc(tp.name)}（${tc.name}）「${esc(tc.lines.win)}」</div>`;
      if (win) { Snd.fanfare(); confetti(90); } else Snd.tick();
      Voice.say(Math.max(0, tp.char), tc.lines.win, 1100);
    }
    Save.save();
    $("resBody").innerHTML = html;
    $("resBtns").innerHTML = this.isHost()
      ? `<button class="btn" id="rbAgain">もう一回遊ぶ</button><button class="btn gray small" style="max-width:240px" id="rbLeave">退出</button>`
      : `<div class="note">ホストが「もう一回遊ぶ」を押すとロビーに戻ります</div><button class="btn gray small" style="max-width:240px" id="rbLeave">退出</button>`;
    if ($("rbAgain")) $("rbAgain").onclick = () => { this.sendAll({ t: "again" }); this.toLobby(); };
    $("rbLeave").onclick = () => this.leave();
  },
  toLobby() { clearTimeout(this.nextTimer); this.phase = "lobby"; this.i = -1; this.scores = {}; this.totals = {}; UI.go("lobby"); this.renderLobby(); }
};
window.__gcEvent = (e) => { try { Party.onEvent(typeof e === "string" ? JSON.parse(e) : e); } catch (x) { console.error(x); } };

/* ============================================================
   入力・起動
   ============================================================ */
(function boot() {
  Save.load();
  const cv = $("cv");
  cv.addEventListener("pointerdown", (e) => { e.preventDefault(); Snd.init(); Runner.input("down", e); });
  cv.addEventListener("pointermove", (e) => { e.preventDefault(); Runner.input("move", e); });
  cv.addEventListener("pointerup", (e) => { e.preventDefault(); Runner.input("up", e); });
  document.addEventListener("touchmove", (e) => { if (UI.cur === "game") e.preventDefault(); }, { passive: false });
  document.addEventListener("gesturestart", (e) => e.preventDefault());
  CHARS.forEach((c, i) => { charImg(i); charImg(i, "happy"); charImg(i, "surprise"); });
  document.addEventListener("pointerdown", () => { Snd.init(); BGM.wake(); }, true);
  document.addEventListener("visibilitychange", () => {
    if (!Snd.ctx) return;
    if (document.hidden) Snd.ctx.suspend(); else { Snd.ctx.resume(); BGM.wake(); }
  });
  BGM.icon(); Voice.icon();
  UI.go("title");
  Native.send("ready");
})();
</script>
</body>
